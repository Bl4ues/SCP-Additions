name: Finalize SCP Sign Fixes

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/scp-sign-ui-and-geometry
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make both sign cells expose one shared shape
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/net/mcreator/scpadditions/facility/FacilityLargePropStructure.java')
          text = path.read_text(encoding='utf-8')
          old = '''        for (Map.Entry<Direction, VoxelShape> entry :
                signShapes.entrySet()) {
            split(result, Kind.SIGN_SUPPORT, entry.getKey(),
                    entry.getValue());
            split(result, Kind.SCP_914_NOTICE, entry.getKey(),
                    entry.getValue());
        }
'''
          new = '''        for (Map.Entry<Direction, VoxelShape> entry :
                signShapes.entrySet()) {
            shareFullShape(result, Kind.SIGN_SUPPORT, entry.getKey(),
                    entry.getValue());
            shareFullShape(result, Kind.SCP_914_NOTICE, entry.getKey(),
                    entry.getValue());
        }
'''
          if old not in text:
              raise SystemExit('Sign shape registration block was not found')
          text = text.replace(old, new, 1)

          marker = '''    private static void split(Map<ShapeKey, VoxelShape> target, Kind kind,
            Direction facing, VoxelShape source) {
'''
          helper = '''    /**
     * The two occupied sign cells expose the same world-space shape. This keeps
     * the selection outline visually continuous instead of revealing the
     * invisible multiblock seam when the cursor crosses from one half to the
     * other.
     */
    private static void shareFullShape(Map<ShapeKey, VoxelShape> target,
            Kind kind, Direction facing, VoxelShape source) {
        target.put(new ShapeKey(kind, facing, 0, 0, 0), source.optimize());
        for (FacilityPropPartBlock.Part part :
                FacilityPropPartBlock.Part.forKind(kind)) {
            BlockPos relative = relativePosition(part, facing);
            VoxelShape local = source.move(-relative.getX(),
                    -relative.getY(), -relative.getZ()).optimize();
            target.put(new ShapeKey(kind, facing, relative.getX(),
                    relative.getY(), relative.getZ()), local);
        }
    }

'''
          if marker not in text:
              raise SystemExit('Shape split method marker was not found')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/finalize-scp-sign-fixes.yml

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Commit finalized fixes
        run: |
          git add -A
          git commit -m "Finalize SCP sign interface and geometry [skip ci]"
          git push origin HEAD:fix/scp-sign-ui-and-geometry
