name: Apply elevator repair on trigger branch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'automation/elevator-fix-trigger' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/elevator-fix-trigger
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extract and run prepared repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-elevator-collision-interaction-fix.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines)
                       if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines))
                     if lines[i].strip() == 'PY')
          script_lines = lines[start:end]
          first = next(line for line in script_lines if line.strip())
          indent = len(first) - len(first.lstrip())
          script = '\n'.join(
              line[indent:] if line.startswith(' ' * indent) else line
              for line in script_lines) + '\n'

          script = script.replace('import json\n', 'import json\nimport re\n', 1)
          label = "'Station direct button hit testing')"
          call_end = script.index(label) + len(label)
          call_start = script.rfind('replace_once(', 0, call_end)
          if call_start < 0:
              raise SystemExit('Station button replacement call not found')
          robust = '''module_text = module_path.read_text(encoding='utf-8')
          station_pattern = re.compile(
              r'            Vec3 local = CoreRoomElevatorGeometry\\.worldToModelLocal\\(.*?'
              r'            double downDistance = local\\.distanceToSqr\\(downButton\\);',
              re.S)
          station_replacement = """            Vec3 upButton = CoreRoomElevatorGeometry.stationButtonWorld(
                      pos, state.getValue(FACING), true);
              Vec3 downButton = CoreRoomElevatorGeometry.stationButtonWorld(
                      pos, state.getValue(FACING), false);
              double upDistance = hit.getLocation().distanceToSqr(upButton);
              double downDistance = hit.getLocation().distanceToSqr(downButton);"""
          module_text, station_count = station_pattern.subn(
              station_replacement, module_text, count=1)
          if station_count != 1:
              raise SystemExit(f'Station direct button hit testing: expected one pattern, found {station_count}')
          module_path.write_text(module_text, encoding='utf-8')'''
          script = script[:call_start] + robust + script[call_end:]
          Path('/tmp/apply_elevator_fix.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_elevator_fix.py

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Commit validated repair to trigger branch
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-elevator-collision-interaction-fix.yml \
            .github/workflows/pr-apply-elevator-collision-interaction-fix.yml \
            .github/workflows/pr-branch-apply-elevator-fix.yml \
            tools/hotfix/APPLY_ELEVATOR_COLLISION_INTERACTION_FIX \
            tools/hotfix/TRIGGER_ELEVATOR_FIX_PR
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Core Room elevator collision and interaction alignment"
          git push origin HEAD:automation/elevator-fix-trigger
