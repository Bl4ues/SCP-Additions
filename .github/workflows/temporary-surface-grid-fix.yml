name: Apply SCP-079 map credential correction

on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary-surface-grid-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Align SCP-079 keycard markers with door segments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java')
          text = p.read_text(encoding='utf-8')
          edits = [
              ('renderClosedKeycardBadge(graphics, marker, transform,\n                            locked);',
               'renderClosedKeycardBadge(graphics, marker, transform,\n                            locked, color);'),
              ('MapDoorMarker marker, MapTransform transform, boolean locked) {',
               'MapDoorMarker marker, MapTransform transform,\n            boolean locked, int color) {'),
              ('int half = 7;', 'int half = 8;'),
              ('int badge = locked ? 0xFF77868B : 0xFFF1FAFD;', 'int badge = color;'),
              ('drawFixedCenteredMapLabel(graphics, value, x, y,',
               'drawCenteredMapLabel(graphics, value, x, y, 1.30F,'),
              ('drawFixedCenteredMapLabel(graphics,\n                Integer.toString(marker.requiredLevel()),',
               'drawCenteredMapLabel(graphics,\n                Integer.toString(marker.requiredLevel()),'),
              ('x, y, 0xFFF1FAFD);', 'x, y, 1.30F, 0xFFFFFFFF);'),
          ]
          for old, new in edits:
              if text.count(old) != 1:
                  raise RuntimeError('Expected exactly one map fragment, got %d: %r' % (text.count(old), old))
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java
          git commit -m 'Align SCP-079 keycard labels and door marker colors'
          git push origin HEAD:master
