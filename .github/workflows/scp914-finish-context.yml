name: Finish SCP-914 Legacy Cleanup

on:
  push:
    paths:
      - '.github/workflows/scp914-finish-context.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Fix cleanup changelog anchor
        run: sed -i 's/## SCP-1176/## SCP-330/g; s/CHANGELOG SCP-1176/CHANGELOG SCP-330/g' .github/scripts/scp914_cleanup_legacy.py
      - name: Remove obsolete SCP-914 implementation
        run: python .github/scripts/scp914_cleanup_legacy.py
      - name: Compile final implementation
        run: ./gradlew compileJava --no-daemon
      - name: Commit final SCP-914 cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove legacy SCP-914 implementation"
          git push origin HEAD:master
