name: Refine SCP-294 result label

on:
  push:
    branches:
      - 'fix/config-center-toggle-ui'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Trigger accurate SCP-294 result label')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply result label fix
        run: python3 .github/scripts/refine_294_result_label.py
      - name: Commit result label fix
        run: |
          git config user.name 'Deyvid Campos'
          git config user.email 'deyvid04campos@gmail.com'
          git add src/main/java/net/mcreator/scpadditions/client/UnityConfigurationUiEvents.java
          git diff --cached --quiet && exit 0
          git commit -m 'Match SCP-294 result labels to dispensed cups'
          git push
