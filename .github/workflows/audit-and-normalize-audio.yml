name: Audit and normalize all mod audio

on:
  push:
    branches:
      - master
    paths:
      - tools/hotfix/AUDIT_AND_NORMALIZE_AUDIO
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Audit every audio asset and normalize multichannel files
        shell: bash
        run: |
          set -u -o pipefail
          report="tools/audio-channel-audit.tsv"
          mkdir -p tools
          printf 'path\tchannels_before\tchannels_after\tstatus\n' > "$report"

          total=0
          mono=0
          converted=0
          unreadable=0
          failures=0

          while IFS= read -r -d '' file; do
            total=$((total + 1))
            before="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of csv=p=0 "$file" 2>/dev/null | head -n1 || true)"

            if [[ ! "$before" =~ ^[0-9]+$ ]]; then
              printf '%s\t%s\t%s\t%s\n' "$file" "${before:-unknown}" "unknown" "unreadable" >> "$report"
              unreadable=$((unreadable + 1))
              failures=$((failures + 1))
              continue
            fi

            if (( before == 1 )); then
              printf '%s\t1\t1\talready-mono\n' "$file" >> "$report"
              mono=$((mono + 1))
              continue
            fi

            ext="${file##*.}"
            ext="${ext,,}"
            tmp="${file%.*}.mono-tmp.${ext}"

            case "$ext" in
              ogg|oga)
                ffmpeg -v error -y -i "$file" -map_metadata 0 -ac 1 -c:a libvorbis -q:a 6 "$tmp"
                ;;
              wav)
                ffmpeg -v error -y -i "$file" -map_metadata 0 -ac 1 -c:a pcm_s16le "$tmp"
                ;;
              mp3)
                ffmpeg -v error -y -i "$file" -map_metadata 0 -ac 1 -c:a libmp3lame -q:a 2 "$tmp"
                ;;
              flac)
                ffmpeg -v error -y -i "$file" -map_metadata 0 -ac 1 -c:a flac "$tmp"
                ;;
              *)
                printf '%s\t%s\t%s\t%s\n' "$file" "$before" "$before" "unsupported-extension" >> "$report"
                failures=$((failures + 1))
                continue
                ;;
            esac

            mv "$tmp" "$file"
            after="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of csv=p=0 "$file" 2>/dev/null | head -n1 || true)"
            if [[ "$after" == "1" ]]; then
              printf '%s\t%s\t1\tconverted-to-mono\n' "$file" "$before" >> "$report"
              converted=$((converted + 1))
            else
              printf '%s\t%s\t%s\tconversion-failed\n' "$file" "$before" "${after:-unknown}" >> "$report"
              failures=$((failures + 1))
            fi
          done < <(find src/main/resources/assets -type f \( -iname '*.ogg' -o -iname '*.oga' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.flac' \) -print0 | sort -z)

          {
            echo
            printf 'summary\ttotal\t%s\n' "$total"
            printf 'summary\talready_mono\t%s\n' "$mono"
            printf 'summary\tconverted\t%s\n' "$converted"
            printf 'summary\tunreadable\t%s\n' "$unreadable"
            printf 'summary\tfailures\t%s\n' "$failures"
          } >> "$report"

          cat "$report"

          if (( failures > 0 )); then
            echo "Audio audit found failures." >&2
            exit 1
          fi

      - name: Commit audit and converted audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets tools/audio-channel-audit.tsv
          git commit -m "Audit and normalize all mod audio channels"
          git push origin HEAD:master
