name: Asset Audit

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/scp106-ranged-audio-debug-order
          fetch-depth: 0

      - name: Capture complete apply diagnostics
        shell: bash
        run: |
          set +e
          {
            python - <<'PY'
          from pathlib import Path
          raw = Path('.github/workflows/build.yml').read_text()
          step = raw.index('      - name: Apply SCP-106 fixes and animation')
          start_marker = '        run: |\n'
          start = raw.index(start_marker, step) + len(start_marker)
          end = raw.index('\n      - name: Make Gradle wrapper executable', start)
          lines = []
          for line in raw[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-complete-scp106.sh').write_text('set -e\n' + '\n'.join(lines) + '\n')
          PY
            bash -e /tmp/apply-complete-scp106.sh
          } > scp106-complete-apply.log 2>&1
          status=$?
          echo "$status" > scp106-complete-apply.status
          cat scp106-complete-apply.log
          exit 0

      - name: Upload complete apply diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scp106-complete-apply-diagnostics
          path: |
            scp106-complete-apply.log
            scp106-complete-apply.status
          if-no-files-found: error
