name: Finish SCP-914 Context Integration

on:
  push:
    paths:
      - '.github/workflows/scp914-finish-context.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply SCP-914 context patch
        run: python .github/scripts/scp914_finish_context.py
      - name: Commit contextual integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/bl4ues/scpclassifieddirective/inventory/client/ContextPromptClient.java
          git add src/main/java/com/bl4ues/scpclassifieddirective/inventory/context/ContextInteractionRegistry.java
          git add src/main/java/com/bl4ues/scpclassifieddirective/inventory/context/DefaultContextInteractions.java
          git add src/main/java/com/bl4ues/scpclassifieddirective/init/ScpClassifiedDirectiveModTabs.java
          git add config/scp_classified_directive/context_interactions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finish SCP-914 physical contextual interactions"
          git push origin HEAD:master
