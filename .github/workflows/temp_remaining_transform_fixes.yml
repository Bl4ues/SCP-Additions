name: Validate remaining transformed construction fixes

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted source edits
        run: python3 .github/scripts/temp_remaining_transform_fixes.py
      - name: Verify project files
        run: python3 .github/scripts/verify_project_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Commit validated source edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformDoorwayCollision.java
          git commit -m "Batch Surface rendering and weld transformed seams" || exit 0
          git push origin HEAD:master
