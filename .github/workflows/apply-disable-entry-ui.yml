name: Apply disabled-entry Configuration Center UI

on:
  push:
    branches:
      - 'feature/disable-list-config-entries'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run disable entry UI patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Configuration Center list toggles
        run: python3 .github/scripts/apply_disable_entry_ui.py
      - name: Verify patch formatting
        run: git diff --check
      - name: Commit Configuration Center UI
        shell: bash
        run: |
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add src/main/java/net/mcreator/scpadditions/client/RoombaConfigCenterEnhancements.java \
                  src/main/java/net/mcreator/scpadditions/config/ui/ConfigCenterClient.java
          git commit -m "Add reversible list entry toggles to Config Center"
          git push origin HEAD
