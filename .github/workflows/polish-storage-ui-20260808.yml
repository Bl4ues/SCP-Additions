name: Polish SCP storage UI

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  polish:
    if: contains(github.event.head_commit.message, '[polish-storage-ui]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply storage UI polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          screen = Path('src/main/java/com/bl4ues/scpinventory/client/gui/ScpStorageContainerScreen.java')
          text = screen.read_text(encoding='utf-8')

          old = '''    private static final int PANEL_BACKGROUND = 0x8F545D5F;\n    private static final int PANEL_BORDER = 0x666A6C6C;\n'''
          new = '''    private static final int PANEL_BACKGROUND = 0xB3545D5F;\n    private static final int PANEL_BORDER = 0x806A6C6C;\n    private static final int HEADER_BACKGROUND = 0xC02B3133;\n    private static final int HEADER_BORDER = 0x996A6C6C;\n'''
          if old not in text:
              raise SystemExit('panel constants marker not found')
          text = text.replace(old, new, 1)

          old = '''    private void renderHeaders(GuiGraphics graphics) {\n        drawSectionTitle(graphics, leftPanelX, titleY,\n                \"://INVENTORY_\", \"BACKPACK\");\n        drawBackpackCount(graphics);\n\n        String containerPrefix = \"://CONTAINER_\";\n'''
          new = '''    private void renderHeaders(GuiGraphics graphics) {\n        drawHeaderPlate(graphics, leftPanelX);\n        drawHeaderPlate(graphics, rightPanelX);\n\n        drawSectionTitle(graphics, leftPanelX + 7, titleY,\n                \"://INVENTORY_\", \"BACKPACK\");\n        drawBackpackCount(graphics);\n\n        String containerPrefix = \"://CONTAINER_\";\n'''
          if old not in text:
              raise SystemExit('renderHeaders start marker not found')
          text = text.replace(old, new, 1)

          old = '''        drawSectionTitle(graphics, rightPanelX, titleY,\n                containerPrefix, containerSuffix);\n        drawContainerCount(graphics);\n    }\n\n    private int containerCountWidth() {\n'''
          new = '''        drawSectionTitle(graphics, rightPanelX + 7, titleY,\n                containerPrefix, containerSuffix);\n        drawContainerCount(graphics);\n    }\n\n    private void drawHeaderPlate(GuiGraphics graphics, int x) {\n        int top = titleY - 5;\n        int bottom = titleY + 14;\n        graphics.fill(x, top, x + panelWidth, bottom, HEADER_BACKGROUND);\n        graphics.fill(x, top, x + panelWidth, top + 1, HEADER_BORDER);\n        graphics.fill(x, bottom - 1, x + panelWidth, bottom, HEADER_BORDER);\n        graphics.fill(x, top, x + 1, bottom, HEADER_BORDER);\n        graphics.fill(x + panelWidth - 1, top, x + panelWidth, bottom,\n                HEADER_BORDER);\n    }\n\n    private int containerCountWidth() {\n'''
          if old not in text:
              raise SystemExit('renderHeaders end marker not found')
          text = text.replace(old, new, 1)

          # Counts now need the same inner padding as the framed headers.
          old = '''        int x = panelX + panelWidth - totalWidth;\n'''
          new = '''        int x = panelX + panelWidth - 7 - totalWidth;\n'''
          if old not in text:
              raise SystemExit('count alignment marker not found')
          text = text.replace(old, new, 1)

          old = '''        boolean quickTransfer = button == 1 && hasShiftDown();\n'''
          new = '''        boolean quickTransfer = button == 0 && hasShiftDown();\n'''
          if old not in text:
              raise SystemExit('quick transfer marker not found')
          text = text.replace(old, new, 1)

          old = '''        String hint = \"Double-click or Shift + Right Click to transfer\"\n                + \"   ·   Drag between panels\";\n'''
          new = '''        String hint = \"Double-click or Shift + Left Click to transfer\"\n                + \"   ·   Drag between panels\";\n'''
          if old not in text:
              raise SystemExit('footer full hint marker not found')
          text = text.replace(old, new, 1)

          old = '''            hint = \"Double-click / Shift+RMB / Drag to transfer\";\n'''
          new = '''            hint = \"Double-click / Shift+LMB / Drag to transfer\";\n'''
          if old not in text:
              raise SystemExit('footer compact hint marker not found')
          text = text.replace(old, new, 1)

          screen.write_text(text, encoding='utf-8')

          list_view = Path('src/main/java/com/bl4ues/scpinventory/client/gui/components/StorageListView.java')
          text = list_view.read_text(encoding='utf-8')

          old = '''            graphics.renderItem(stack, iconX + 4, iconY + 4);\n            graphics.renderItemDecorations(minecraft.font, stack,\n                    iconX + 4, iconY + 4);\n'''
          new = '''            graphics.renderItem(stack, iconX + 4, iconY + 4);\n            ItemStack decorationStack = stack;\n            if (stack.getCount() != 1) {\n                decorationStack = stack.copy();\n                decorationStack.setCount(1);\n            }\n            graphics.renderItemDecorations(minecraft.font, decorationStack,\n                    iconX + 4, iconY + 4);\n            renderStackCount(graphics, stack, iconX + 4, iconY + 4);\n'''
          if old not in text:
              raise SystemExit('item decorations marker not found')
          text = text.replace(old, new, 1)

          marker = '''    private String secondaryText(ItemStack stack) {\n'''
          method = '''    private void renderStackCount(GuiGraphics graphics, ItemStack stack,\n                                  int itemX, int itemY) {\n        if (stack == null || stack.isEmpty() || stack.getCount() == 1) {\n            return;\n        }\n\n        Component count = ScpFonts.roboto(Integer.toString(stack.getCount()));\n        int countX = itemX + 19 - 2 - minecraft.font.width(count);\n        int countY = itemY + 9;\n\n        graphics.pose().pushPose();\n        graphics.pose().translate(0.0F, 0.0F, 200.0F);\n        graphics.drawString(minecraft.font, count, countX, countY,\n                0xFFFFFFFF, true);\n        graphics.pose().popPose();\n    }\n\n'''
          if marker not in text:
              raise SystemExit('secondaryText marker not found')
          text = text.replace(marker, method + marker, 1)
          list_view.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          old = '''- Added an SCP Inventory-style interface for plain slot-only storage containers while the custom inventory is enabled, replacing supported chest, barrel, shulker, hopper, dispenser, and compatible modded storage screens with responsive Backpack/Keys/Codex and container lists, live slot counts, scrolling, double-click or Shift+Right Click transfer, and drag-and-drop while preserving native screens for crafting, processing, equipment, and other semantic menus;\n'''
          new = '''- Added an SCP Inventory-style interface for plain slot-only storage containers while the custom inventory is enabled, replacing supported chest, barrel, shulker, hopper, dispenser, and compatible modded storage screens with responsive Backpack/Keys/Codex and container lists, live slot counts, scrolling, double-click or Shift+Left Click transfer, drag-and-drop, framed high-contrast headers, and Roboto stack counts while preserving native screens for crafting, processing, equipment, and other semantic menus;\n'''
          if old not in text:
              raise SystemExit('storage changelog marker not found')
          changelog.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/polish-storage-ui-20260808.yml

      - name: Build final tree
        run: ./gradlew clean build

      - name: Commit polished storage UI
        shell: bash
        run: |
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Polish SCP storage container interface"
          git push origin HEAD:master
