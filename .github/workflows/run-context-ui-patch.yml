name: Run context interaction editor patch

on:
  push:
    branches:
      - 'feature/context-item-variants'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply editor and persistence patch
        shell: bash
        run: |
          cat .github/scripts/context_ui_patch.part0 \
              .github/scripts/context_ui_patch.part1 \
              .github/scripts/context_ui_patch.part2 \
              .github/scripts/context_ui_patch.part3 \
            | base64 -d | gzip -d > /tmp/context_ui_patch.py
          python3 /tmp/context_ui_patch.py
      - name: Commit source changes
        shell: bash
        run: |
          rm -f .github/workflows/run-context-ui-patch.yml
          rm -f .github/scripts/context_ui_patch.part0
          rm -f .github/scripts/context_ui_patch.part1
          rm -f .github/scripts/context_ui_patch.part2
          rm -f .github/scripts/context_ui_patch.part3
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git commit -m "Add contextual interaction variant editor"
          git push origin HEAD:feature/context-item-variants
