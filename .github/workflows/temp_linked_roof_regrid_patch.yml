name: Validate linked roof grid coverage correction
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply linked roof regrid correction and coverage checks
        run: python3 .github/scripts/temp_linked_roof_regrid_patch.py
      - name: Verify project integrity
        run: python3 .github/scripts/verify_project_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run available tests
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Commit validated correction to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/ConstructionSurface.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformSurfaceBridge.java
          git commit -m 'Preserve linked roof block coverage when geometry changes its grid'
          git pull --rebase origin master
          git push origin HEAD:master
