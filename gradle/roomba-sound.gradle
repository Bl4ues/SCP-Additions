// Keep the Roomba loop inside the main scp_additions sound namespace without
// hand-editing the generated/minified sounds.json source file.
gradle.afterProject { evaluatedProject, state ->
    if (state.failure != null) {
        return
    }

    def resourceTask = evaluatedProject.tasks.findByName('processResources')
    if (resourceTask == null) {
        return
    }

    resourceTask.doLast {
        File soundsFile = evaluatedProject.file(
                "${evaluatedProject.buildDir}/resources/main/assets/scp_additions/sounds.json")
        if (!soundsFile.isFile()) {
            throw new GradleException("Missing processed SCP Additions sounds.json")
        }

        def parser = new groovy.json.JsonSlurper()
        def sounds = parser.parse(soundsFile)
        sounds.roomba_loop = [
                subtitle: 'subtitles.scp_additions.roomba',
                sounds: [[
                        name: 'scp_additions:roomba',
                        stream: false,
                        volume: 1.0
                ]]
        ]

        soundsFile.setText(
                groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(sounds))
                        + System.lineSeparator(),
                'UTF-8')
    }
}
