name: Apply SCP-079 Facility Discovery

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths:
      - tools/hotfix/APPLY_SCP079_FACILITY_DISCOVERY
      - tools/hotfix/apply_scp079_facility_discovery.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply facility discovery system
        run: python3 tools/hotfix/apply_scp079_facility_discovery.py

      - name: Validate build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rework SCP-079 facility access discovery" -m "Replace redstone activation with a powered diagnostic terminal, add persistent hidden protocol discovery driven by facility activity, require a physical SCP-079 host, delay AP generation until access is learned, expose discovery in the debug HUD, and move the advancement to the first real interference."
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
