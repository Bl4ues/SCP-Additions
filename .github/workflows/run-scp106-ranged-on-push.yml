name: Run SCP-106 Ranged Fixes On Push

on:
  push:
    branches:
      - fix/scp106-ranged-audio-debug-order

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scp106-ranged-audio-debug-order
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Extract and run prepared patch
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/apply-scp106-ranged-test-fixes.yml').read_text())
          steps = workflow['jobs']['apply']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Apply fixes')
          Path('/tmp/apply-scp106-ranged.sh').write_text('set -e\n' + script)
          PY
          bash -e /tmp/apply-scp106-ranged.sh
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine SCP-106 ranged attack and emergence"
          git push origin HEAD:fix/scp106-ranged-audio-debug-order
