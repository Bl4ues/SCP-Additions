name: Build

on:
  push:
    branches:
      - master
      - integration/scp-additions-3.0
      - 'feature/**'
  pull_request:
    branches:
      - master
      - integration/scp-additions-3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format contextual interaction defaults
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/context-offscreen-prompts-v2'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('config/scpinventory/context_interactions.json'),
              Path('src/main/resources/defaults/scpinventory/context_interactions.json'),
          ]
          for path in paths:
              data = json.loads(path.read_text(encoding='utf-8'))
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          rm -f tools/hotfix/FORMAT_CONTEXT_OFFSCREEN_DEFAULTS

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Commit formatted contextual defaults
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/context-offscreen-prompts-v2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
          else
            git commit -m "Format contextual interaction defaults"
            git push origin HEAD:feature/context-offscreen-prompts-v2
          fi

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scp-additions-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
