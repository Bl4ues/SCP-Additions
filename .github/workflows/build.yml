name: Build

on:
  push:
    branches:
      - master
      - integration/scp-additions-3.0
      - 'feature/**'
  pull_request:
    branches:
      - master
      - integration/scp-additions-3.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/scp106-ranged-audio-debug-order
          fetch-depth: 0

      - name: Capture patch diagnostics
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/apply-scp106-ranged-test-fixes.yml').read_text())
          steps = workflow['jobs']['apply']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Apply fixes')
          Path('/tmp/apply-scp106-ranged.sh').write_text('set -e\n' + script)
          PY
          set +e
          bash -e /tmp/apply-scp106-ranged.sh > scp106-ranged-patch.log 2>&1
          echo $? > scp106-ranged-patch.status
          set -e
          cat scp106-ranged-patch.log

      - name: Upload patch diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: scp106-ranged-patch-diagnostics
          path: |
            scp106-ranged-patch.log
            scp106-ranged-patch.status
          if-no-files-found: error
