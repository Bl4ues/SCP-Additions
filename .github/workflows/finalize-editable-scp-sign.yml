name: Finalize Editable SCP Sign

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/editable-scp-sign-support
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize supplied assets from master
        run: |
          git fetch origin master
          git merge --no-edit origin/master
          if [ -f src/main/resources/assets/scp_additions/textures/screens/scpsign/invisible_objective.png ] && \
             [ ! -f src/main/resources/assets/scp_additions/textures/screens/scpsign/invisible_object.png ]; then
            git mv \
              src/main/resources/assets/scp_additions/textures/screens/scpsign/invisible_objective.png \
              src/main/resources/assets/scp_additions/textures/screens/scpsign/invisible_object.png
          fi

      - name: Render none.png in the editor preview
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/net/mcreator/scpadditions/client/gui/ScpSignEditorScreen.java')
          text = path.read_text(encoding='utf-8')
          old = "if (option.isNone() || !resourceExists(option.texture())) continue;\n            drawHazard(graphics, option.texture(), HAZARDS[slot]);"
          new = "ResourceLocation texture = option.texture();\n            if (!resourceExists(texture)) {\n                texture = ScpSignHazards.NONE.texture();\n            }\n            if (resourceExists(texture)) {\n                drawHazard(graphics, texture, HAZARDS[slot]);\n            }"
          if old not in text:
              raise SystemExit('Expected SCP sign preview lines were not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/finalize-editable-scp-sign.yml

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Commit finalized feature
        run: |
          git add -A
          git commit -m "Finalize editable SCP Sign Support [skip ci]"
          git push origin HEAD:feature/editable-scp-sign-support
