name: Apply facility and elevator polish
on:
  push:
    branches: [master]
    paths: [tools/hotfix/APPLY_FACILITY_ELEVATOR_POLISH]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply requested fixes
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('.')

          # ---------- Language names and tooltip text ----------
          name_map = {
              'block.scp_additions.tesla_bottom': 'Tesla Bottom Wall',
              'block.scp_additions.tesla_mid_1': 'Tesla Wall',
              'block.scp_additions.tesla_mid_2': 'Tesla Middle Wall',
              'block.scp_additions.tesla_bottom_alt': 'Tesla Alternative Bottom Wall',
              'block.scp_additions.tesla_top_alt': 'Tesla Alternative Top Wall',
              'block.scp_additions.archival_bottom': 'Entrance Bottom Wall',
              'block.scp_additions.archival_mid': 'Entrance Middle Wall',
              'block.scp_additions.archival_top': 'Entrance Top Wall',
              'block.scp_additions.archival_bot_1': 'Archival Bottom Wall',
              'block.scp_additions.archival_mid_2': 'Archival Wall',
              'block.scp_additions.office_bottom': 'Office Bottom Wall',
              'block.scp_additions.office_mid': 'Office Middle Wall',
              'block.scp_additions.office_top': 'Office Top Wall',
              'block.scp_additions.skyroom_bot_1': 'Skyroom Bottom Wall',
              'block.scp_additions.skyroom_bot_2': 'Skyroom Alternative Bottom Wall',
              'block.scp_additions.skyroom_mid': 'Skyroom Middle Wall',
              'block.scp_additions.skyroom_top_alt': 'Skyroom Top Wall',
              'block.scp_additions.skyroom_block': 'Skyroom Wall',
              'block.scp_additions.security_bot': 'Security Bottom Wall',
              'block.scp_additions.security_mid': 'Security Middle Wall',
              'block.scp_additions.security_top': 'Security Top Wall',
              'block.scp_additions.core_room_floor': 'Blue Grate Floor',
              'block.scp_additions.sl_1_floor_2': 'Blue Floor',
              'block.scp_additions.sl_1_floor_1': 'Metal Floor',
              'block.scp_additions.sl1_wall_bot': 'Metal Bottom Wall',
              'block.scp_additions.sl1_wall_mid': 'Metal Middle Wall',
              'block.scp_additions.sl_1_wall_top': 'Metal Wall Top',
              'block.scp_additions.sl1_ceiling': 'Ceiling Tile',
              'block.scp_additions.sl1_ceiling_alt': 'Dark Ceiling',
              'block.scp_additions.sl_2_floor': 'Concrete Floor',
              'block.scp_additions.sl_2_wall_bot': 'Concrete Bottom Wall',
              'block.scp_additions.sl_2_wall_mid': 'Concrete Middle Wall',
              'block.scp_additions.sl_2_wall_top': 'Concrete Top Wall',
              'item.scp_additions.scp_1176honey': 'Honey Bottle',
          }
          tooltip_text = {
              'tooltip.scp_additions.tesla_gate_room': 'Tesla Gate Room',
              'tooltip.scp_additions.archival_storage_sl1a': 'Archival Storage SL1-A',
              'tooltip.scp_additions.patron_offices': 'Patron Offices',
              'tooltip.scp_additions.skyroom_cafeteria_lounge': 'Skyroom Cafeteria/Lounge',
              'tooltip.scp_additions.security_office': 'Security Office',
              'tooltip.scp_additions.sl1_blue_floor_connection': 'Connects automatically with Metal Floor.',
              'tooltip.scp_additions.sl1_metal_floor_connection': 'Connects automatically with Blue Floor.',
          }
          for lang_path in [
              Path('src/main/resources/assets/scp_additions/lang/en_us.json'),
              Path('src/main/resources/assets/scp_additions/lang/en_us_3_0.json')
          ]:
              if not lang_path.exists():
                  continue
              data = json.loads(lang_path.read_text(encoding='utf-8'))
              data.update(name_map)
              data.update(tooltip_text)
              lang_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          # ---------- SCP-330 placement, collision, and model size ----------
          p = Path('src/main/java/net/mcreator/scpadditions/block/Scp330Block.java')
          text = p.read_text()
          text = re.sub(
              r'/\* Two model-matched layers:.*?private static final VoxelShape SHAPE = Shapes\.or\(\s*box\([^;]+?\);',
              '/* Compact collision kept inside the visibly enlarged bowl. */\n'
              '    private static final VoxelShape SHAPE = box(\n'
              '            5.75D, 0.0D, 5.0D, 10.25D, 1.5D, 11.0D);',
              text, flags=re.S)
          text = text.replace('context.getHorizontalDirection().getOpposite());',
                              'context.getHorizontalDirection());', 1)
          p.write_text(text)

          geo = Path('src/main/resources/assets/scp_additions/geo/block/scp330.geo.json')
          if geo.exists():
              doc = json.loads(geo.read_text())
              scale = 1.18
              def scale_vec(v, y_base=False):
                  if not isinstance(v, list) or len(v) < 3: return
                  v[0] *= scale
                  v[1] *= scale
                  v[2] *= scale
              for geom in doc.get('minecraft:geometry', []):
                  desc = geom.get('description', {})
                  if 'visible_bounds_width' in desc: desc['visible_bounds_width'] *= scale
                  if 'visible_bounds_height' in desc: desc['visible_bounds_height'] *= scale
                  if isinstance(desc.get('visible_bounds_offset'), list): scale_vec(desc['visible_bounds_offset'])
                  for bone in geom.get('bones', []):
                      if isinstance(bone.get('pivot'), list): scale_vec(bone['pivot'])
                      for cube in bone.get('cubes', []):
                          if isinstance(cube.get('origin'), list): scale_vec(cube['origin'])
                          if isinstance(cube.get('size'), list): scale_vec(cube['size'])
                      for locator in bone.get('locators', {}).values():
                          if isinstance(locator, list): scale_vec(locator)
              geo.write_text(json.dumps(doc, separators=(',', ':')))

          # ---------- Elevator model-aligned collision ----------
          p = Path('src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorGeometry.java')
          text = p.read_text()
          text = text.replace(
              'return cellShape(boxes, facing, localX, localY, localZ);',
              'return cellShape(boxes, facing, localX, localY, localZ, true);', 1)
          text = text.replace(
              'return cellShape(PULLEY_STATIC, facing, localX, localY, localZ);',
              'return cellShape(PULLEY_STATIC, facing, localX, localY, localZ, false);')
          text = text.replace(
              'return cellShape(BEAMS, facing, localX, localY, localZ);',
              'return cellShape(BEAMS, facing, localX, localY, localZ, false);')
          old = '''    private static VoxelShape cellShape(List<AABB> source, Direction facing,
            int localX, int localY, int localZ) {'''
          new = '''    private static VoxelShape cellShape(List<AABB> source, Direction facing,
            int localX, int localY, int localZ, boolean modelRootRotated) {'''
          text = text.replace(old, new)
          text = text.replace(
              '            AABB rotated = rotateAabb(original, facing, 0.5D, 0.5D);',
              '            AABB aligned = modelRootRotated\n'
              '                    ? rotateAabb(original, Direction.EAST, 0.5D, 0.5D)\n'
              '                    : original;\n'
              '            AABB rotated = rotateAabb(aligned, facing, 0.5D, 0.5D);')
          p.write_text(text)

          # Station button hitboxes and realistic selection shapes.
          p = Path('src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorModule.java')
          text = p.read_text()
          text = text.replace(
              '''            Vec3 upButton = new Vec3(14.64492D / 16.0D,
                    21.25D / 16.0D, -16.69749D / 16.0D);
            Vec3 downButton = new Vec3(14.64492D / 16.0D,
                    19.25D / 16.0D, -16.69749D / 16.0D);''',
              '''            Vec3 upButton = CoreRoomElevatorGeometry.rotateLocalVector(
                    Direction.EAST, 14.64492D / 16.0D,
                    21.25D / 16.0D, -16.69749D / 16.0D);
            Vec3 downButton = CoreRoomElevatorGeometry.rotateLocalVector(
                    Direction.EAST, 14.64492D / 16.0D,
                    19.25D / 16.0D, -16.69749D / 16.0D);''')
          text = text.replace(
              '            return CoreRoomElevatorGeometry.stationSelectionCellShape();',
              '''            boolean gateSolid = !(level.getBlockEntity(pos)
                    instanceof StationBlockEntity station)
                    || station.isGateCollisionSolid();
            return CoreRoomElevatorGeometry.stationCellShape(
                    state.getValue(FACING), 0, 0, 0, gateSolid);''')
          text = text.replace(
              '''        public VoxelShape getShape(BlockState state, BlockGetter level,
                BlockPos pos, CollisionContext context) {
            return Shapes.block();
        }

        @Override
        public VoxelShape getCollisionShape''',
              '''        public VoxelShape getShape(BlockState state, BlockGetter level,
                BlockPos pos, CollisionContext context) {
            return getCollisionShape(state, level, pos, context);
        }

        @Override
        public VoxelShape getCollisionShape''')
          p.write_text(text)

          # Prompt anchors use the same model-root alignment as collision and hit tests.
          p = Path('src/main/java/com/bl4ues/scpinventory/context/ContextInteractionRegistry.java')
          text = p.read_text()
          text = text.replace(
              '''            double x = 0.5D + 14.64492D / 16.0D;
            double z = 0.5D - 16.69749D / 16.0D;''',
              '''            Vec3 modelAligned = CoreRoomElevatorGeometry.rotateLocalVector(
                    Direction.EAST, 14.64492D / 16.0D, 0.0D,
                    -16.69749D / 16.0D);
            double x = 0.5D + modelAligned.x;
            double z = 0.5D + modelAligned.z;''')
          if 'import net.minecraft.core.Direction;' not in text:
              text = text.replace('import ', 'import net.minecraft.core.Direction;\nimport ', 1)
          if 'import net.minecraft.world.phys.Vec3;' not in text:
              marker = 'import net.minecraft.world.level.block.Block;'
              text = text.replace(marker, marker + '\nimport net.minecraft.world.phys.Vec3;')
          if 'import net.mcreator.scpadditions.facility.elevator.CoreRoomElevatorGeometry;' not in text:
              marker = 'import net.mcreator.scpadditions.facility.elevator.CoreRoomElevatorModule;'
              text = text.replace(marker, marker + '\nimport net.mcreator.scpadditions.facility.elevator.CoreRoomElevatorGeometry;')
          text = text.replace('"front", "hand", "hand", 0.55D));',
                              '"front", "hand", "hand", 0.38D));')
          p.write_text(text)

          # Darker, thicker procedural pulley cables.
          p = Path('src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorClient.java')
          text = p.read_text()
          text = text.replace(
              '''    private static final ResourceLocation CABLE_TEXTURE = new ResourceLocation(
            ScpAdditionsMod.MODID,
            "textures/block/core_room_elevator_beams.png");''',
              '''    private static final ResourceLocation CABLE_TEXTURE = new ResourceLocation(
            "scp_unity_extra_blocks", "textures/block/black_texture.png");''')
          text = text.replace('float radius = 0.028F;', 'float radius = 0.055F;')
          p.write_text(text)

          # ---------- Creative tab reorganization ----------
          p = Path('src/main/java/net/mcreator/scpadditions/facility/FacilityModule.java')
          text = p.read_text()
          moved = [
              'archival_bottom','archival_mid','archival_top','archival_bot_1','archival_mid_2',
              'office_bottom','office_mid','office_top',
              'skyroom_bot_1','skyroom_bot_2','skyroom_mid','skyroom_top_alt','skyroom_block',
              'security_bot','security_mid','security_top'
          ]
          for block_id in moved:
              text = text.replace(f'        addFacilityCreativeItem(general, "{block_id}");\n', '')
          insertion = ''.join(f'        addFacilityCreativeItem(sublevel1, "{i}");\n' for i in moved)
          text = text.replace('        sections.add(section("sl1tab", sublevel1));',
                              insertion + '        sections.add(section("sl1tab", sublevel1));')
          p.write_text(text)

          # Distinct connected-floor descriptions.
          p = Path('src/main/java/net/mcreator/scpadditions/facility/UBlocksModule.java')
          text = p.read_text()
          text = text.replace(
              '''            tooltip.add(Component.translatable("tooltip.scp_additions.sl1_connected_floors")
                    .withStyle(ChatFormatting.GRAY));''',
              '''            String connectionKey = "sl_1_floor_1".equals(path)
                    ? "tooltip.scp_additions.sl1_metal_floor_connection"
                    : "tooltip.scp_additions.sl1_blue_floor_connection";
            tooltip.add(Component.translatable(connectionKey)
                    .withStyle(ChatFormatting.GRAY));''')
          p.write_text(text)

          # Zone/room tooltips for FacilityModule blocks that previously used plain BlockItems.
          tooltip_event = Path('src/main/java/net/mcreator/scpadditions/facility/FacilityTooltipEvents.java')
          tooltip_event.write_text('''package net.mcreator.scpadditions.facility;

import net.minecraft.ChatFormatting;
import net.minecraft.network.chat.Component;
import net.minecraft.resources.ResourceLocation;
import net.minecraftforge.event.entity.player.ItemTooltipEvent;
import net.minecraftforge.eventbus.api.SubscribeEvent;
import net.minecraftforge.fml.common.Mod;
import net.minecraftforge.registries.ForgeRegistries;
import net.mcreator.scpadditions.ScpAdditionsMod;

import java.util.Map;
import java.util.Set;

@Mod.EventBusSubscriber(modid = ScpAdditionsMod.MODID)
public final class FacilityTooltipEvents {
    private static final Set<String> TESLA = Set.of(
            "tesla_bottom", "tesla_mid_1", "tesla_mid_2",
            "tesla_bottom_alt", "tesla_top_alt");
    private static final Map<String, String> SUBLEVEL_ONE_ROOMS = Map.ofEntries(
            Map.entry("archival_bottom", "tooltip.scp_additions.archival_storage_sl1a"),
            Map.entry("archival_mid", "tooltip.scp_additions.archival_storage_sl1a"),
            Map.entry("archival_top", "tooltip.scp_additions.archival_storage_sl1a"),
            Map.entry("archival_bot_1", "tooltip.scp_additions.archival_storage_sl1a"),
            Map.entry("archival_mid_2", "tooltip.scp_additions.archival_storage_sl1a"),
            Map.entry("office_bottom", "tooltip.scp_additions.patron_offices"),
            Map.entry("office_mid", "tooltip.scp_additions.patron_offices"),
            Map.entry("office_top", "tooltip.scp_additions.patron_offices"),
            Map.entry("skyroom_bot_1", "tooltip.scp_additions.skyroom_cafeteria_lounge"),
            Map.entry("skyroom_bot_2", "tooltip.scp_additions.skyroom_cafeteria_lounge"),
            Map.entry("skyroom_mid", "tooltip.scp_additions.skyroom_cafeteria_lounge"),
            Map.entry("skyroom_top_alt", "tooltip.scp_additions.skyroom_cafeteria_lounge"),
            Map.entry("skyroom_block", "tooltip.scp_additions.skyroom_cafeteria_lounge"),
            Map.entry("security_bot", "tooltip.scp_additions.security_office"),
            Map.entry("security_mid", "tooltip.scp_additions.security_office"),
            Map.entry("security_top", "tooltip.scp_additions.security_office"));

    private FacilityTooltipEvents() {}

    @SubscribeEvent
    public static void appendFacilityTooltips(ItemTooltipEvent event) {
        ResourceLocation id = ForgeRegistries.ITEMS.getKey(event.getItemStack().getItem());
        if (id == null || !ScpAdditionsMod.MODID.equals(id.getNamespace())) return;
        String path = id.getPath();
        if (TESLA.contains(path)) {
            event.getToolTip().add(Component.translatable(
                    "tooltip.scp_additions.tesla_gate_room")
                    .withStyle(ChatFormatting.GRAY));
            return;
        }
        String roomKey = SUBLEVEL_ONE_ROOMS.get(path);
        if (roomKey != null) {
            event.getToolTip().add(Component.translatable(
                    "tooltip.scp_additions.sublevel_1")
                    .withStyle(ChatFormatting.BLUE));
            event.getToolTip().add(Component.translatable(roomKey)
                    .withStyle(ChatFormatting.GRAY));
        }
    }
}
''')
          PY

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/main/resources
          git commit -m "Polish facility blocks and Core Room elevator interactions"
          git push origin HEAD:master

  cleanup:
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove temporary tooling and diagnostics
        shell: bash
        run: |
          git pull --ff-only origin master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-facility-elevator-polish.yml tools/hotfix/APPLY_FACILITY_ELEVATOR_POLISH .github/workflows/diagnose-elevator-tabs.yml tools/hotfix/DIAGNOSE_ELEVATOR_TABS tools/elevator-facility-diagnostic.txt
          git commit -m "Remove temporary facility polish tooling [skip ci]"
          git push origin HEAD:master
