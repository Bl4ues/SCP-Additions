name: Validate and publish linked ceiling server workflow
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply server, networking and map adjustments
        run: python3 .github/scripts/temp_bridge_server.py
      - name: Verify project integrity
        run: python3 .github/scripts/verify_project_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build complete mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Commit validated parts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformConstructionManager.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/network/TransformConstructionNetwork.java
          git diff --cached --check
          git commit -m 'Create and synchronize parent-anchored ceiling Surfaces server-side'
          git add src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java
          git diff --cached --check
          git commit -m 'Keep SCP-079 door strokes slim at every zoom'
          git pull --rebase origin master
          git push origin HEAD:master
