name: Apply play panel compile fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/_fix-main-menu-play-panel-build.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Fix Forge sound holder calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/net/mcreator/scpadditions/client/MainMenuPlayPanelsClient.java')
          text = path.read_text()
          old = 'SimpleSoundInstance.forUI(SoundEvents.UI_BUTTON_CLICK,'
          new = 'SimpleSoundInstance.forUI(SoundEvents.UI_BUTTON_CLICK.value(),'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 sound calls, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add src/main/java/net/mcreator/scpadditions/client/MainMenuPlayPanelsClient.java
          git diff --cached --check
          git commit -m "Fix play panel menu sounds"
          git push origin HEAD:master
