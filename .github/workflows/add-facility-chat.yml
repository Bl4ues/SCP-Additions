          marker = ('- Added a default-enabled client-side **Disable Text Drop Shadows** preference '
                    "that removes Minecraft's dark offset shadow pass from rendered text without changing font, color, or layout;\n")
          entry = ('- Added a default-enabled client-side **Facility Chat Interface** that keeps vanilla chat behavior and settings while moving the message flow to the upper-left, presenting history top-to-bottom in an SCP Unity / Configuration Center-inspired framed communications panel, relocating the input and command suggestions with it, and restoring the exact vanilla chat presentation when disabled;\n')
          if marker not in text:
              raise SystemExit('CHANGELOG text-shadow marker not found')
          if entry not in text:
              text = text.replace(marker, marker + entry, 1)
          changelog.write_text(text, encoding='utf-8')
          PY
          python3 /tmp/add_facility_chat.py
          rm -f .github/workflows/add-facility-chat.yml

