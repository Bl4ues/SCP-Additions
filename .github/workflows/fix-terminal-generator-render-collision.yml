name: Fix terminal and generator visuals

on:
  push:
    branches:
      - master
    paths:
      - scripts/temp_fix_terminal_generator.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply patch
        run: python3 scripts/temp_fix_terminal_generator.py
      - name: Remove temporary files
        run: rm -f scripts/temp_fix_terminal_generator.py .github/workflows/fix-terminal-generator-render-collision.yml
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine terminal and generator visuals"
          git push origin HEAD:master
