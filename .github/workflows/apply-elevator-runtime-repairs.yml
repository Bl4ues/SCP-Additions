name: Apply Core Room Elevator Runtime Repairs

on:
  push:
    branches: [ master ]
    paths:
      - '.github/elevator-runtime-repair-trigger.txt'

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply runtime repairs
        run: |
          python .github/scripts/elevator_repair_1_geometry.py
          python .github/scripts/elevator_repair_2_blocks.py
          python .github/scripts/elevator_repair_3_carriage.py
          python .github/scripts/elevator_repair_4_assets_audio.py

      - name: Verify repaired assets and contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          carriage = json.loads((root / 'src/main/resources/assets/scp_additions/geo/entity/core_room_elevator_carriage.geo.json').read_text())
          cabin = carriage['minecraft:geometry'][0]['bones'][0]
          assert cabin['rotation'] == [0, 0, 0]
          assert cabin['locators']['cable_attachment_front'] == [0, 53, -7]
          pulley = json.loads((root / 'src/main/resources/assets/scp_additions/geo/block/core_room_elevator_pulley.geo.json').read_text())
          origins = [cube['origin'] for cube in pulley['minecraft:geometry'][0]['bones'][0]['cubes']]
          assert [-15.5, 0, 13] in origins
          assert [13.25, 0, 13] in origins
          floor_state = json.loads((root / 'src/main/resources/assets/scp_additions/blockstates/core_room_floor.json').read_text())
          assert set(floor_state['variants']) == {'facing=north', 'facing=east', 'facing=south', 'facing=west'}
          module = (root / 'src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorModule.java').read_text()
          assert 'stationSelectionCellShape' in module
          assert 'extends HorizontalDirectionalBlock' in module
          carriage_java = (root / 'src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorCarriageEntity.java').read_text()
          assert 'resolveSweptHorizontalCollision' in carriage_java
          assert 'SoundType.STONE.getStepSound()' in carriage_java
          save = (root / 'src/main/java/net/mcreator/scpadditions/event/SaveGameSoundEvents.java').read_text()
          assert 'SpawnSnapshot' in save and 'PlayerTickEvent' in save
          PY

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Remove temporary repair tooling
        run: |
          rm -f .github/scripts/elevator_repair_1_geometry.py
          rm -f .github/scripts/elevator_repair_2_blocks.py
          rm -f .github/scripts/elevator_repair_3_carriage.py
          rm -f .github/scripts/elevator_repair_4_assets_audio.py
          rm -f .github/workflows/apply-elevator-runtime-repairs.yml
          rm -f .github/elevator-runtime-repair-trigger.txt

      - name: Commit repaired implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Core Room elevator runtime geometry and interactions'
          git push origin HEAD:master
