name: Validate occupied Surface pick-block raycast
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_pick_surface.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pick-block occupied Surface raycast
        run: python3 .github/scripts/temporary_pick_surface.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit patch to master
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformSurfaceRaycast.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformPickBlockClient.java
          git commit -m 'Make transformed pick-block ignore empty Surface guides'
          git pull --rebase origin master
          git push origin HEAD:master
