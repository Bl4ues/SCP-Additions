name: Validate transformed Alarm audio recovery
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_alarm_audio_recovery.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Alarm audio source lifecycle
        run: python3 .github/scripts/temporary_alarm_audio_recovery.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit verified audio patch to master
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformAlarmClientRenderer.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformAlarmAudioClient.java
          git commit -m 'Recover transformed Alarm sirens from stale sound instances'
          git pull --rebase origin master
          git push origin HEAD:master
