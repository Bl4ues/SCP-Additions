name: Integrate SCP Sign Typography And First Save

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'fix/scp-sign-typography-and-first-save'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/scp-sign-typography-and-first-save
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply targeted fixes
        run: |
          python3 scripts/apply_scp_sign_typography_and_first_save_fix.py
          rm scripts/apply_scp_sign_typography_and_first_save_fix.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Commit final branch state
        run: |
          git add -A
          git commit -m "Refine SCP sign typography and first save [skip ci]"
          git push origin HEAD:fix/scp-sign-typography-and-first-save
