name: Apply Emissive Z-Fighting Fix

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths:
      - tools/hotfix/APPLY_EMISSIVE_ZFIGHT_FIX
      - tools/hotfix/fix_emissive_zfighting.py

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply fix
        run: python3 tools/hotfix/fix_emissive_zfighting.py

      - name: Validate build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix shader emissive overlay z-fighting" -m "Disable the native coplanar block overlay while a shader pack is active, keep the eyes/spidereyes bloom pass as the sole emissive surface, and rebuild chunk meshes once when shader state changes."
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
