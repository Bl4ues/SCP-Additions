name: Validate linked Surface authoring and canonical seams
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply linked Surface client and seam changes
        run: python3 .github/scripts/temp_linked_surface_client.py
      - name: Verify project integrity
        run: python3 .github/scripts/verify_project_integrity.py
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Commit validated feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientControls.java
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git add src/main/java/com/bl4ues/scpclassifieddirective/client/BuilderToolGuideHud.java
          git add src/main/java/com/bl4ues/scpclassifieddirective/item/SurfaceConstructionToolItem.java
          git diff --cached --check
          git commit -m "Add parent-linked Surface ceiling authoring and canonical seams" || exit 0
          git push origin HEAD:master
