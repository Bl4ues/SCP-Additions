name: Validate exact transformed Surface outline mask
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact surface mask patch
        run: python3 .github/scripts/temp_surface_outline_exact.py
      - name: Check repository integrity
        run: python3 .github/scripts/verify_project_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build entire mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Commit validated code to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git add src/main/java/com/bl4ues/scpclassifieddirective/inventory/client/PickupOutlineRenderer.java
          git commit -m 'Render curved Surface context outline from exact visible payload mesh'
          git push origin HEAD:master
