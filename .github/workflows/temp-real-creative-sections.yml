name: Diagnose Real Creative Tab Build

on:
  pull_request:
    branches:
      - master

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply and compile
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch agent/creative-tab-real-sections https://github.com/Bl4ues/SCP-Additions.git source
          cd source
          sed -i 's/ dividers (until I add more sectors);/ dividers;/' CHANGELOG.md
          python3 scripts/apply_real_creative_sections.py
          chmod +x gradlew
          if ! ./gradlew compileJava --no-daemon --stacktrace > creative-tab-build.log 2>&1; then
            tail -n 50 creative-tab-build.log
            exit 1
          fi
          tail -n 10 creative-tab-build.log
