name: Validate Surface seam and SCP-079 map markers
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped changes
        run: python3 .github/scripts/temp_surface_map_final.py
      - name: Verify project integrity
        run: python3 .github/scripts/verify_project_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build complete mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Publish verified changes in separate commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Weld mirrored curved Surface borders and refine seam edges'
          git add src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java
          git commit -m 'Render thicker clickable SCP-079 door bars and finite antialiased room contours'
          git pull --rebase origin master
          git push origin HEAD:master
