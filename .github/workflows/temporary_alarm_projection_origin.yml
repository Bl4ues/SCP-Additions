name: Validate vanilla-style radial projected Alarm cone
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_alarm_projection_origin.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply lamp-anchored Alarm projection
        run: python3 .github/scripts/temporary_alarm_projection_origin.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit verified projection patch to master
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformAlarmPhysicalProjection.java
          git commit -m 'Project transformed Alarm cone radially from lamp tip'
          git pull --rebase origin master
          git push origin HEAD:master
