name: Validate Surface handle snapping and Alarm audio
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_surface_handle_snap.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Surface snap and single Alarm audio source
        run: python3 .github/scripts/temporary_surface_handle_snap.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate complete build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit validated changes
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientControls.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformAlarmClientRenderer.java
          git commit -m 'Snap Surface handles to nearby geometry and consolidate Alarm audio'
          git pull --rebase origin master
          git push origin HEAD:master
