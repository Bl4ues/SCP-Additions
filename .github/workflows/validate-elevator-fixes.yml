name: Apply Core Room Elevator Corrections

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  apply-and-build:
    if: >-
      github.event.comment.user.login == 'Bl4ues' &&
      github.event.comment.body == '/apply-core-room-elevator-fixes'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reassemble and verify patch
        run: |
          cat .github/scripts/elevator_fix_parts/part*.b64 | tr -d '\n\r ' | base64 --decode > .github/scripts/apply_core_room_elevator_fixes.py
          echo '8685b0f33a508300ef18784728bddc3a613d573e62e0d8a9c2ab4cdf246b40a9  .github/scripts/apply_core_room_elevator_fixes.py' | sha256sum --check
          python -m py_compile .github/scripts/apply_core_room_elevator_fixes.py

      - name: Apply elevator corrections
        run: python .github/scripts/apply_core_room_elevator_fixes.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Remove temporary integration files
        run: |
          rm -rf .github/scripts/elevator_fix_parts
          rm -f .github/scripts/apply_core_room_elevator_fixes.py
          rm -f .github/workflows/validate-elevator-fixes.yml

      - name: Commit directly to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Core Room elevator placement, collision and audio'
          git push origin HEAD:master
