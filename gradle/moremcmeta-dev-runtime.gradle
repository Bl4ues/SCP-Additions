// MoreMcmeta's development runtime is assembled under build/ during project
// evaluation. A combined `clean runClient` used to delete those local JARs
// before ForgeGradle resolved runtimeClasspathCopy. Keep a persistent mirror
// under the ignored .gradle directory and restore it around clean builds.
def runtimeRelativePath = 'moremcmeta-dev-runtime'
def cacheRelativePath = '.gradle/moremcmeta-dev-runtime'

gradle.beforeProject { evaluatedProject ->
    if (evaluatedProject != evaluatedProject.rootProject) {
        return
    }

    File generatedRuntime = evaluatedProject.layout.buildDirectory
            .dir(runtimeRelativePath).get().asFile
    File persistentRuntime = new File(evaluatedProject.rootDir,
            cacheRelativePath)

    if (!generatedRuntime.exists() && persistentRuntime.isDirectory()) {
        evaluatedProject.copy {
            from persistentRuntime
            into generatedRuntime
        }
    }
}

gradle.afterProject { evaluatedProject, state ->
    if (state.failure != null
            || evaluatedProject != evaluatedProject.rootProject) {
        return
    }

    File generatedRuntime = evaluatedProject.layout.buildDirectory
            .dir(runtimeRelativePath).get().asFile
    File persistentRuntime = new File(evaluatedProject.rootDir,
            cacheRelativePath)

    if (generatedRuntime.isDirectory()) {
        evaluatedProject.sync {
            from generatedRuntime
            into persistentRuntime
        }
    }

    // `clean` removes build/ after project evaluation. Restore the already
    // prepared local repository before runClient resolves its runtime classpath.
    evaluatedProject.tasks.named('clean').configure {
        doLast {
            if (persistentRuntime.isDirectory()) {
                evaluatedProject.copy {
                    from persistentRuntime
                    into generatedRuntime
                }
            }
        }
    }

    // CI uses this task after clean so a green build also proves that the
    // development runtime can actually be resolved by ForgeGradle. The
    // run-specific copy is created lazily, so ordinary CI falls back to the
    // standard runtime classpath containing the same fg.deobf dependencies.
    evaluatedProject.tasks.register('verifyMoreMcmetaDevRuntime') {
        group = 'verification'
        description = 'Resolves the runClient dependencies after clean.'
        mustRunAfter evaluatedProject.tasks.named('clean')

        doLast {
            def runtimeConfiguration = evaluatedProject.configurations
                    .findByName('runtimeClasspathCopy')
            if (runtimeConfiguration == null) {
                runtimeConfiguration = evaluatedProject.configurations
                        .getByName('runtimeClasspath')
            }

            runtimeConfiguration.resolve()
        }
    }
}
