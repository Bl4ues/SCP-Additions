name: Polish SCP-079 Facility Discovery

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths:
      - tools/hotfix/POLISH_SCP079_FACILITY_DISCOVERY
      - tools/hotfix/polish_scp079_facility_discovery.py

permissions:
  contents: write

jobs:
  polish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply reviewed behavior corrections
        run: python3 tools/hotfix/polish_scp079_facility_discovery.py
      - name: Validate build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace
      - name: Commit reviewed implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish SCP-079 discovery behavior" -m "Count actual door openings once, make initial scan exposure non-repeatable, reset stale host discovery, report active uncontained roamer classes, and award the hidden advancement for all implemented player-targeted SCP-079 interference paths."
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
