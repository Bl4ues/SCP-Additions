          rm -f .github/workflows/apply-context-center-catalog.yml
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git commit -m "Show integrated contextual interactions in Config Center"
          git push origin HEAD:fix/config-center-integrated-context
