name: Document disabled configuration entries

on:
  push:
    branches:
      - 'feature/disable-list-config-entries'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run disable entry changelog patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update changelog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Interface and presentation\n\n'
          bullet = ('- Added reversible **Enable/Disable** controls for compatible multi-entry Configuration Center lists; disabled entries remain visible but dimmed and can be restored without recreating them, including integrated and custom Roomba spawn floors, SCP-173 targets, hidden status effects, item rules, Codex documents, contextual interactions, SCP-294 drinks, and SCP-914 recipes;\n')
          if bullet not in text:
              if marker not in text:
                  raise SystemExit('Interface and presentation changelog section not found')
              text = text.replace(marker, marker + bullet, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit changelog
        shell: bash
        run: |
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add CHANGELOG.md
          git commit -m "Document reversible configuration entry toggles"
          git push origin HEAD
