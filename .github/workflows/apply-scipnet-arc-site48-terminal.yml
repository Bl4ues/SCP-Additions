name: Apply SCiPNET ARC-Site-48 Terminal

on:
  push:
    branches:
      - feature/scipnet-arc-site-48-terminal
    paths:
      - tools/hotfix/APPLY_SCIPNET_ARC_SITE48_TERMINAL

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/scipnet-arc-site-48-terminal
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply ARC-Site-48 SCiPNET terminal
        run: python3 tools/hotfix/apply_scipnet_arc_site48_terminal.py

      - name: Remove temporary integration files
        run: |
          rm -f .github/workflows/apply-scipnet-arc-site48-terminal.yml
          rm -f tools/hotfix/apply_scipnet_arc_site48_terminal.py
          rm -f tools/hotfix/APPLY_SCIPNET_ARC_SITE48_TERMINAL

      - name: Validate build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Restyle SCiPNET terminal for ARC-Site 48"
          git push origin HEAD:feature/scipnet-arc-site-48-terminal
