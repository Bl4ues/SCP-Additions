name: Build

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply source and model repairs
        run: python .github/scripts/apply_elevator_runtime_final.py

      - name: Convert elevator audio to positional mono
        run: |
          for name in elevator_door_close station_close elevator_moving elevator_cabin_loop; do
            file="src/main/resources/assets/scp_additions/sounds/${name}.ogg"
            test -f "$file"
            channels=$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=nw=1:nk=1 "$file")
            if [ "$channels" != "1" ]; then
              ffmpeg -y -v error -i "$file" -ac 1 -c:a libvorbis -q:a 6 "${file}.mono.ogg"
              mv "${file}.mono.ogg" "$file"
            fi
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=nw=1:nk=1 "$file")" = "1"
          done

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build repaired mod
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Commit validated repairs to branch
        run: |
          git checkout origin/master -- .github/workflows/build.yml
          rm -f .github/scripts/apply_elevator_runtime_final.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Core Room elevator runtime repairs'
          git push origin HEAD:${{ github.head_ref }}
