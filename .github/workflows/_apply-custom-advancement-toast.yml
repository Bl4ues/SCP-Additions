name: Custom Advancement Toast Integration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/_apply-custom-advancement-toast.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Add custom advancement toast system
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64, json, zlib

          files = json.loads(zlib.decompress(base64.b64decode('' )).decode('utf-8'))
          for path, content in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          prefs_path = Path('src/main/java/net/mcreator/scpadditions/client/ClientModulePreferences.java')
          prefs = prefs_path.read_text(encoding='utf-8')
          replacements = [
              (
                  '            "ui.custom_loading_screen",\n',
                  '            "ui.custom_loading_screen",\n            "ui.custom_advancement_toasts",\n'
              ),
              (
                  '        next.ui.customLoadingScreen = bool(ui, "custom_loading_screen",\n                next.ui.customLoadingScreen);\n',
                  '        next.ui.customLoadingScreen = bool(ui, "custom_loading_screen",\n                next.ui.customLoadingScreen);\n        next.ui.customAdvancementToasts = bool(ui, "custom_advancement_toasts",\n                next.ui.customAdvancementToasts);\n'
              ),
              (
                  '        ui.addProperty("custom_loading_screen", value.ui.customLoadingScreen);\n',
                  '        ui.addProperty("custom_loading_screen", value.ui.customLoadingScreen);\n        ui.addProperty("custom_advancement_toasts",\n                value.ui.customAdvancementToasts);\n'
              ),
              (
                  '    public static boolean customLoadingScreenEnabled() {\n        return current.ui.customLoadingScreen;\n    }\n',
                  '    public static boolean customLoadingScreenEnabled() {\n        return current.ui.customLoadingScreen;\n    }\n\n    public static boolean customAdvancementToastsEnabled() {\n        return current.ui.customAdvancementToasts;\n    }\n'
              ),
              (
                  '        private boolean customLoadingScreen = true;\n',
                  '        private boolean customLoadingScreen = true;\n        private boolean customAdvancementToasts = true;\n'
              ),
          ]
          for old, new in replacements:
              if old not in prefs:
                  raise RuntimeError('ClientModulePreferences anchor not found: ' + old[:80])
              prefs = prefs.replace(old, new, 1)
          prefs_path.write_text(prefs, encoding='utf-8')

          ui_path = Path('src/main/java/net/mcreator/scpadditions/config/ui/CustomLoadingScreenModulesUi.java')
          ui = ui_path.read_text(encoding='utf-8')
          replacements = [
              (
                  '    private static final String LOADING_LABEL = "Custom Loading Screen";\n',
                  '    private static final String LOADING_LABEL = "Custom Loading Screen";\n    private static final String ADVANCEMENT_LABEL = "Custom Advancement Toasts";\n'
              ),
              (
                  '            boolean needsLoading = !containsLabel(rows, LOADING_LABEL);\n            if (!needsMainMenu && !needsPauseMenu && !needsLoading) return;\n',
                  '            boolean needsLoading = !containsLabel(rows, LOADING_LABEL);\n            boolean needsAdvancement = !containsLabel(rows, ADVANCEMENT_LABEL);\n            if (!needsMainMenu && !needsPauseMenu && !needsLoading\n                    && !needsAdvancement) return;\n'
              ),
              (
                  '            List<Object> expanded = new ArrayList<>(rows.size() + 3);\n',
                  '            List<Object> expanded = new ArrayList<>(rows.size() + 4);\n'
              ),
              (
                  '            if (needsLoading) {\n                expanded.add(insertion, constructor.newInstance(\n                        "ui", "custom_loading_screen", LOADING_LABEL,\n                        "Replaces Minecraft\'s spawn-region loading display with the SCP Additions presentation.",\n                        true));\n            }\n',
                  '            if (needsLoading) {\n                expanded.add(insertion++, constructor.newInstance(\n                        "ui", "custom_loading_screen", LOADING_LABEL,\n                        "Replaces Minecraft\'s spawn-region loading display with the SCP Additions presentation.",\n                        true));\n            }\n            if (needsAdvancement) {\n                expanded.add(insertion, constructor.newInstance(\n                        "ui", "custom_advancement_toasts", ADVANCEMENT_LABEL,\n                        "Replaces advancement popups and their vanilla sounds with the animated SCP Additions presentation.",\n                        true));\n            }\n'
              ),
          ]
          for old, new in replacements:
              if old not in ui:
                  raise RuntimeError('CustomLoadingScreenModulesUi anchor not found: ' + old[:80])
              ui = ui.replace(old, new, 1)
          ui_path.write_text(ui, encoding='utf-8')

          mod_path = Path('src/main/java/net/mcreator/scpadditions/ScpAdditionsMod.java')
          mod = mod_path.read_text(encoding='utf-8')
          old = 'import net.mcreator.scpadditions.sound.GameplaySounds;\n'
          new = old + 'import net.mcreator.scpadditions.sound.AchievementSounds;\n'
          if old not in mod:
              raise RuntimeError('ScpAdditionsMod import anchor not found')
          mod = mod.replace(old, new, 1)
          old = '        GameplaySounds.REGISTRY.register(bus);\n'
          new = old + '        AchievementSounds.REGISTRY.register(bus);\n'
          if old not in mod:
              raise RuntimeError('ScpAdditionsMod register anchor not found')
          mod = mod.replace(old, new, 1)
          mod_path.write_text(mod, encoding='utf-8')

          mixins_path = Path('src/main/resources/scp_additions.mixins.json')
          mixins = json.loads(mixins_path.read_text(encoding='utf-8'))
          client = mixins.setdefault('client', [])
          for entry in ['client.AdvancementToastMixin', 'client.ToastVisibilityMixin']:
              if entry not in client:
                  client.append(entry)
          mixins_path.write_text(json.dumps(mixins, indent=2) + '\n', encoding='utf-8')

          sounds_path = Path('src/main/resources/assets/scp_additions/sounds.json')
          sounds = sounds_path.read_text(encoding='utf-8')
          if '"achievement":' not in sounds:
              entry = '''  "achievement": {
    "subtitle": "subtitles.scp_additions.achievement",
    "sounds": [
      {
        "name": "scp_additions:achievement",
        "stream": false,
        "volume": 1.0
      }
    ]
  },
'''
              if not sounds.startswith('{\n'):
                  raise RuntimeError('sounds.json opening anchor not found')
              sounds = '{\n' + entry + sounds[2:]
          sounds_path.write_text(sounds, encoding='utf-8')

          lang_path = Path('src/main/resources/assets/scp_additions/lang/en_us.json')
          lang = lang_path.read_text(encoding='utf-8')
          if '"subtitles.scp_additions.achievement"' not in lang:
              anchor = '  "block.scp_additions.archivists_chair": "Archivist\'s Chair",\n'
              if anchor not in lang:
                  raise RuntimeError('en_us.json anchor not found')
              lang = lang.replace(anchor, anchor
                  + '  "subtitles.scp_additions.achievement": "Advancement unlocked",\n', 1)
          lang_path.write_text(lang, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          bullet = '- Added a default-enabled **Custom Advancement Toasts** client preference that replaces vanilla advancement popups with animated SCP Additions cards, advancement icons, frame-based rarity indicators, the paired loading-logo animation, and the dedicated `achievement.ogg` cue while preserving vanilla toasts when disabled;\n'
          if bullet not in changelog:
              anchor = '- Added a default-enabled client-side **Disable Text Drop Shadows** preference'
              idx = changelog.find(anchor)
              if idx < 0:
                  raise RuntimeError('CHANGELOG presentation anchor not found')
              changelog = changelog[:idx] + bullet + changelog[idx:]
          changelog_path.write_text(changelog, encoding='utf-8')
          PY
      - name: Compile
        run: ./gradlew compileJava processResources --no-daemon
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD --staged --worktree .github/workflows/_apply-custom-advancement-toast.yml
          git add src/main/java/net/mcreator/scpadditions/client/ClientModulePreferences.java
          git add src/main/java/net/mcreator/scpadditions/client/CustomAdvancementToastClient.java
          git add src/main/java/net/mcreator/scpadditions/config/ui/CustomLoadingScreenModulesUi.java
          git add src/main/java/net/mcreator/scpadditions/mixin/client/AdvancementToastMixin.java
          git add src/main/java/net/mcreator/scpadditions/mixin/client/ToastVisibilityMixin.java
          git add src/main/java/net/mcreator/scpadditions/sound/AchievementSounds.java
          git add src/main/java/net/mcreator/scpadditions/ScpAdditionsMod.java
          git add src/main/resources/scp_additions.mixins.json
          git add src/main/resources/assets/scp_additions/sounds.json
          git add src/main/resources/assets/scp_additions/lang/en_us.json
          git add CHANGELOG.md
          git commit -m "Add custom advancement toast presentation"
          git push origin HEAD:master
