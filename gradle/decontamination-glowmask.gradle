// Generates the Decontamination GeckoLib glowmask from the authoritative
// authored mask footprint before the common emissive-material pipeline runs.
// Do not infer emissive pixels from material colour: the floor vent texture
// contains warm/yellow grille paint that must never become emissive.
gradle.afterProject { evaluatedProject, state ->
    if (state.failure != null) {
        return
    }

    def resourceTask = evaluatedProject.tasks.findByName('processResources')
    if (resourceTask == null) {
        return
    }

    resourceTask.doLast {
        File textureDir = evaluatedProject.file(
                "${evaluatedProject.buildDir}/resources/main/assets/scp_classified_directive/textures/block")
        File baseFile = new File(textureDir, 'decontamination.png')
        if (!baseFile.isFile()) {
            return
        }

        def baseImage = javax.imageio.ImageIO.read(baseFile)
        if (baseImage == null) {
            throw new GradleException("Unable to read Decontamination base texture: ${baseFile}")
        }
        if (baseImage.width < 1024 || baseImage.height < 1024) {
            throw new GradleException(
                    "Decontamination texture is too small for authored glowmask coordinates: ${baseImage.width}x${baseImage.height}")
        }

        // Exact non-transparent footprint from the original authored
        // decontamination_glowmask.png. The model atlas is 512x512 while the
        // material is authored at 1024x1024, so these are final texture pixels.
        // Keeping this explicit prevents yellow grille/frame artwork from ever
        // being promoted to emission just because it happens to be warm-coloured.
        def authoredRuns = [
                337: [[668, 670], [673, 678], [681, 683]],
                338: [[668, 670], [673, 678], [681, 683]],
                339: [[668, 670], [673, 678], [681, 683]],
                341: [[668, 670], [673, 678], [681, 683]],
                342: [[668, 670], [673, 678], [681, 683]],
                343: [[668, 670], [673, 678], [681, 683]],
                345: [[668, 670], [673, 678], [681, 683]],
                346: [[659, 661], [663, 665], [667, 670], [673, 676], [678, 680], [682, 684]],
                347: [[659, 661], [663, 665], [667, 670], [673, 676], [678, 680], [682, 684]],
                348: [[659, 661], [663, 665], [667, 670], [673, 676], [678, 680], [682, 684]],
                351: [[659, 661], [663, 665], [667, 670], [673, 676], [678, 680], [682, 684]],
                352: [[659, 661], [663, 665], [667, 670], [673, 676], [678, 680], [682, 684]],
                353: [[659, 661], [663, 665], [667, 670], [673, 676], [678, 680], [682, 684]],
                568: [[634, 640], [643, 656], [659, 665]],
                569: [[634, 640], [643, 656], [659, 665]],
                570: [[634, 640], [643, 649], [652, 658], [661, 667]],
                571: [[634, 640], [643, 649], [652, 658], [661, 667]]
        ]

        def mask = new java.awt.image.BufferedImage(
                baseImage.width,
                baseImage.height,
                java.awt.image.BufferedImage.TYPE_INT_ARGB)

        // Preserve the authored footprint but raise luminance so the pixels
        // reliably cross bloom thresholds used by BSL/Hysteria-class shaders.
        // The normal base pass still provides the dark-red material colour.
        final int emissivePixel = (0xFF000000 as int)
                | (255 << 16)
                | (170 << 8)
                | 110

        int copiedPixels = 0
        authoredRuns.each { y, runs ->
            runs.each { run ->
                for (int x = run[0]; x <= run[1]; x++) {
                    mask.setRGB(x, y, emissivePixel)
                    copiedPixels++
                }
            }
        }

        if (copiedPixels != 316) {
            throw new GradleException(
                    "Decontamination authored glowmask must contain exactly 316 pixels, generated ${copiedPixels}")
        }

        File glowmaskFile = new File(textureDir, 'decontamination_glowmask.png')
        File emissiveFile = new File(textureDir, 'decontamination_e.png')
        glowmaskFile.parentFile.mkdirs()
        if (!javax.imageio.ImageIO.write(mask, 'png', glowmaskFile)
                || !javax.imageio.ImageIO.write(mask, 'png', emissiveFile)) {
            throw new GradleException('Unable to encode Decontamination emissive textures')
        }
    }
}
