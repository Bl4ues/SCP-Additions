name: Finalize Hide Effect Indicators

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/hide-active-effect-indicators'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/hide-active-effect-indicators
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply implementation
        run: python3 scripts/apply_hide_effect_indicators.py

      - name: Remove temporary files
        run: |
          rm scripts/apply_hide_effect_indicators.py
          rm .github/workflows/finalize-hide-effect-indicators.yml

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Commit finalized feature
        run: |
          git add -A
          git commit -m "Add active effect indicator HUD module [skip ci]"
          git push origin HEAD:feature/hide-active-effect-indicators
