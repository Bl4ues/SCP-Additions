name: Apply SCiPNET terminal audio

on:
  push:
    branches:
      - fix/scipnet-terminal-audio
    paths:
      - .github/workflows/apply-scipnet-terminal-audio.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: fix/scipnet-terminal-audio
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply terminal and generator audio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f"Missing anchor: {label}")
              return text.replace(old, new, 1)

          # SCiPNET terminal ambient loop.
          path = Path('src/main/java/net/mcreator/scpadditions/block/SCP079SystemControlBlock.java')
          text = path.read_text()
          text = replace_once(text,
              'package net.mcreator.scpadditions.block;\n\n',
              'package net.mcreator.scpadditions.block;\n\nimport net.minecraftforge.registries.ForgeRegistries;\n\n',
              'system control Forge import')
          text = replace_once(text,
              'import net.minecraft.network.chat.Component;\n',
              'import net.minecraft.network.chat.Component;\nimport net.minecraft.resources.ResourceLocation;\n',
              'system control resource import')
          text = replace_once(text,
              'import net.minecraft.server.level.ServerPlayer;\n',
              'import net.minecraft.server.level.ServerPlayer;\nimport net.minecraft.sounds.SoundEvent;\nimport net.minecraft.sounds.SoundSource;\nimport net.minecraft.util.RandomSource;\n',
              'system control sound imports')
          text = replace_once(text,
              'import java.util.Collections;\nimport java.util.List;\n',
              'import java.util.Collections;\nimport java.util.HashMap;\nimport java.util.List;\nimport java.util.Map;\n',
              'system control util imports')
          text = replace_once(text,
              '    public static final BooleanProperty WATERLOGGED =\n            BlockStateProperties.WATERLOGGED;\n',
              '    public static final BooleanProperty WATERLOGGED =\n            BlockStateProperties.WATERLOGGED;\n    private static final Map<Long, Long> TERMINAL_LOOP_NEXT_TICK =\n            new HashMap<>();\n',
              'system control loop map')
          text = replace_once(text,
              '    @Override\n    public InteractionResult use(BlockState state, Level level, BlockPos pos,\n',
              '''    @Override
    public void animateTick(BlockState state, Level level, BlockPos pos,
            RandomSource random) {
        super.animateTick(state, level, pos, random);
        long key = pos.asLong();
        long gameTime = level.getGameTime();
        long nextLoop = TERMINAL_LOOP_NEXT_TICK.getOrDefault(key, 0L);
        if (gameTime < nextLoop) return;

        SoundEvent sound = ForgeRegistries.SOUND_EVENTS.getValue(
                new ResourceLocation("scp_additions", "terminalloop"));
        if (sound != null) {
            level.playLocalSound(pos.getX() + 0.5D, pos.getY() + 0.5D,
                    pos.getZ() + 0.5D, sound, SoundSource.BLOCKS,
                    0.4F, 1.0F, false);
        }
        TERMINAL_LOOP_NEXT_TICK.put(key, gameTime + 160L);
        if (TERMINAL_LOOP_NEXT_TICK.size() > 512) {
            TERMINAL_LOOP_NEXT_TICK.clear();
        }
    }

    @Override
    public InteractionResult use(BlockState state, Level level, BlockPos pos,
''',
              'system control animateTick')
          path.write_text(text)

          # Auxiliary generator loop, only while powered.
          path = Path('src/main/java/net/mcreator/scpadditions/block/Scp079AuxiliaryPowerBlock.java')
          text = path.read_text()
          text = replace_once(text,
              'package net.mcreator.scpadditions.block;\n\n',
              'package net.mcreator.scpadditions.block;\n\nimport net.minecraftforge.registries.ForgeRegistries;\n\n',
              'aux Forge import')
          text = replace_once(text,
              'import net.minecraft.network.chat.Component;\n',
              'import net.minecraft.network.chat.Component;\nimport net.minecraft.resources.ResourceLocation;\n',
              'aux resource import')
          text = replace_once(text,
              'import net.minecraft.server.level.ServerPlayer;\n',
              'import net.minecraft.server.level.ServerPlayer;\nimport net.minecraft.sounds.SoundEvent;\nimport net.minecraft.sounds.SoundSource;\nimport net.minecraft.util.RandomSource;\n',
              'aux sound imports')
          text = replace_once(text,
              'import java.util.Collections;\nimport java.util.List;\n',
              'import java.util.Collections;\nimport java.util.HashMap;\nimport java.util.List;\nimport java.util.Map;\n',
              'aux util imports')
          text = replace_once(text,
              '    public static final BooleanProperty WATERLOGGED = BlockStateProperties.WATERLOGGED;\n',
              '    public static final BooleanProperty WATERLOGGED = BlockStateProperties.WATERLOGGED;\n    private static final Map<Long, Long> AUXILIARY_LOOP_NEXT_TICK =\n            new HashMap<>();\n',
              'aux loop map')
          text = replace_once(text,
              '    @Override\n    public InteractionResult use(BlockState state, Level level, BlockPos pos,\n',
              '''    @Override
    public void animateTick(BlockState state, Level level, BlockPos pos,
            RandomSource random) {
        super.animateTick(state, level, pos, random);
        long key = pos.asLong();
        if (!state.getValue(POWERED)) {
            AUXILIARY_LOOP_NEXT_TICK.remove(key);
            return;
        }

        long gameTime = level.getGameTime();
        long nextLoop = AUXILIARY_LOOP_NEXT_TICK.getOrDefault(key, 0L);
        if (gameTime < nextLoop) return;

        SoundEvent sound = ForgeRegistries.SOUND_EVENTS.getValue(
                new ResourceLocation("scp_additions", "auxgen"));
        if (sound != null) {
            level.playLocalSound(pos.getX() + 0.5D, pos.getY() + 0.5D,
                    pos.getZ() + 0.5D, sound, SoundSource.BLOCKS,
                    0.22F, 1.0F, false);
        }
        AUXILIARY_LOOP_NEXT_TICK.put(key, gameTime + 200L);
        if (AUXILIARY_LOOP_NEXT_TICK.size() > 512) {
            AUXILIARY_LOOP_NEXT_TICK.clear();
        }
    }

    @Override
    public InteractionResult use(BlockState state, Level level, BlockPos pos,
''',
              'aux animateTick')
          path.write_text(text)

          # Match Tesla terminal click/select feedback in the diagnostic screen.
          path = Path('src/main/java/net/mcreator/scpadditions/client/FacilityDiagnosticsScreen.java')
          text = path.read_text()
          text = replace_once(text,
              'package net.mcreator.scpadditions.client;\n\n',
              'package net.mcreator.scpadditions.client;\n\nimport net.minecraftforge.registries.ForgeRegistries;\n\n',
              'screen Forge import')
          text = replace_once(text,
              'import net.minecraft.resources.ResourceLocation;\n',
              'import net.minecraft.resources.ResourceLocation;\nimport net.minecraft.sounds.SoundEvent;\nimport net.minecraft.sounds.SoundSource;\nimport net.minecraft.world.level.Level;\n',
              'screen sound imports')
          text = replace_once(text,
              '    private boolean resetRequested;\n',
              '    private boolean resetRequested;\n    private boolean clickVariant;\n',
              'screen click variant')
          old_click = '''    @Override
    public boolean mouseClicked(double mouseX, double mouseY, int button) {
        if (button == 0 && data.auxiliaryPowerOnline() && !resetRequested
                && cooldownRemainingTicks() <= 0
                && inside(mouseX, mouseY, resetX, resetY,
                resetWidth, RESET_HEIGHT)) {
            resetRequested = true;
            ScpAdditionsMod.PACKET_HANDLER.sendToServer(
                    new FacilityDiagnosticsResetPacket(data.terminalPos()));
            return true;
        }
        return super.mouseClicked(mouseX, mouseY, button);
    }
'''
          new_click = '''    @Override
    public boolean mouseClicked(double mouseX, double mouseY, int button) {
        if (button == 0 && data.auxiliaryPowerOnline()) {
            playRandomClick();
        }
        if (button == 0 && data.auxiliaryPowerOnline() && !resetRequested
                && cooldownRemainingTicks() <= 0
                && inside(mouseX, mouseY, resetX, resetY,
                resetWidth, RESET_HEIGHT)) {
            resetRequested = true;
            playSelect();
            ScpAdditionsMod.PACKET_HANDLER.sendToServer(
                    new FacilityDiagnosticsResetPacket(data.terminalPos()));
            return true;
        }
        return super.mouseClicked(mouseX, mouseY, button);
    }

    private void playRandomClick() {
        clickVariant = !clickVariant;
        String id = clickVariant ? "click_1" : "click_2";
        float pitch = 0.90F + (float) (Math.random() * 0.20D);
        playBlockSound(id, pitch, 0.2F);
    }

    private void playSelect() {
        playBlockSound("select", 1.0F, 1.0F);
    }

    private void playBlockSound(String soundId, float pitch, float volume) {
        Level level = Minecraft.getInstance().level;
        if (level == null) return;
        SoundEvent sound = ForgeRegistries.SOUND_EVENTS.getValue(
                new ResourceLocation("scp_additions", soundId));
        if (sound == null) return;
        BlockPos pos = data.terminalPos();
        level.playLocalSound(pos.getX() + 0.5D, pos.getY() + 0.5D,
                pos.getZ() + 0.5D, sound, SoundSource.BLOCKS,
                volume, pitch, false);
    }
'''
          text = replace_once(text, old_click, new_click, 'screen mouse click')
          path.write_text(text)

          # Register the generator sound event.
          path = Path('src/main/java/net/mcreator/scpadditions/init/ScpAdditionsModSounds.java')
          text = path.read_text()
          anchor = '\tpublic static final RegistryObject<SoundEvent> TERMINALLOOP = REGISTRY.register("terminalloop", () -> SoundEvent.createVariableRangeEvent(new ResourceLocation("scp_additions", "terminalloop")));\n'
          text = replace_once(text, anchor,
              anchor + '\tpublic static final RegistryObject<SoundEvent> AUXGEN = REGISTRY.register("auxgen", () -> SoundEvent.createVariableRangeEvent(new ResourceLocation("scp_additions", "auxgen")));\n',
              'auxgen sound registry')
          path.write_text(text)

          # Register auxgen.ogg in sounds.json.
          path = Path('src/main/resources/assets/scp_additions/sounds.json')
          sounds = json.loads(path.read_text())
          sounds['auxgen'] = {
              'sounds': [{
                  'name': 'scp_additions:auxgen',
                  'stream': False,
                  'volume': 1.0
              }]
          }
          path.write_text(json.dumps(sounds, ensure_ascii=False,
                                     separators=(',', ':')))

          # Document the audio pass.
          path = Path('CHANGELOG.md')
          text = path.read_text()
          anchor = '- Expanded the SCP-079 developer HUD with a discovery-progress bar and moved the hidden **Not Your Decision** advancement to the first facility decision that actually affects a player;\n'
          addition = anchor + '- Matched the SCiPNET terminal ambient loop and UI feedback to the Tesla Gate Terminal, and added a positional powered `auxgen` loop to the Auxiliary Power Unit at a conservative initial volume;\n'
          text = replace_once(text, anchor, addition, 'changelog audio bullet')
          path.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-scipnet-terminal-audio.yml

      - name: Validate build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Commit validated implementation
        run: |
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git commit -m "Add SCiPNET and auxiliary generator audio"
          git push origin HEAD:fix/scipnet-terminal-audio
