name: SCP-914 Geometry Unpack

on:
  push:
    branches: [ master ]
    paths:
      - 'src/main/resources/assets/scp_classified_directive/geo/block/scp914.geo.json.gz.b64'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Restore GeckoLib geometry
        shell: bash
        run: |
          base64 -d src/main/resources/assets/scp_classified_directive/geo/block/scp914.geo.json.gz.b64 | gzip -d > src/main/resources/assets/scp_classified_directive/geo/block/scp914.geo.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/scp_classified_directive/geo/block/scp914.geo.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore full SCP-914 GeckoLib geometry"
          git push origin HEAD:master
