name: Validate more seamless cached curved pipe mesh
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_curved_pipe_tessellation.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply curved pipe tessellation change
        run: python3 .github/scripts/temporary_curved_pipe_tessellation.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit verified pipe patch to master
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Refine curved pipe mesh tessellation without full-wall rebakes'
          git pull --rebase origin master
          git push origin HEAD:master
