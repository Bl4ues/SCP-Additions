name: Validate pipe seams on curved Surfaces
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_pipe_seam_stitch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove coincident internal pipe caps
        run: python3 .github/scripts/temporary_pipe_seam_stitch.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit verified pipe seams
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Stitch curved pipe segments without coincident end caps'
          git pull --rebase origin master
          git push origin HEAD:master
