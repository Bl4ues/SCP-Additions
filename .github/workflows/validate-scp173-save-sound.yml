name: Validate SCP-173 and Save Sound

on:
  push:
    branches: [ scp173-save-sound-validation ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: scp173-save-sound-validation

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply audio integration
        run: |
          if [ -f .github/scripts/apply_scp173_save_sound.py ]; then
            python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_scp173_save_sound.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "'        @SerializedName(\"enter_sound_enabled\")\\n'": "'\\t\\t@SerializedName(\"enter_sound_enabled\")\\n'",
              "'        public boolean enterSoundEnabled = true;\\n'": "'\\t\\tpublic boolean enterSoundEnabled = true;\\n'",
              "'        @SerializedName(\"save_game_sound_enabled\")\\n'": "'\\t\\t@SerializedName(\"save_game_sound_enabled\")\\n'",
              "'        public boolean saveGameSoundEnabled = true;\\n'": "'\\t\\tpublic boolean saveGameSoundEnabled = true;\\n'",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
            python .github/scripts/apply_scp173_save_sound.py
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Remove temporary validation tooling
        run: |
          rm -f .github/scripts/apply_scp173_save_sound.py
          rm -f .github/workflows/validate-scp173-save-sound.yml

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Rework SCP-173 movement audio and add save sound module"
            git push origin HEAD:scp173-save-sound-validation
          fi
