name: Apply map clarity corrections
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_map_review.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply map changes
        run: python3 .github/scripts/temporary_map_review.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit validated map changes
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapNetworkOverlay.java
          git commit -m 'Keep SCP-079 clearance badges zoom-dependent and recolor activity pings'
          git pull --rebase origin master
          git push origin HEAD:master
