name: Validate Elevator Placement and Collision Fixes

on:
  push:
    branches: [ elevator-fixes-validation ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: elevator-fixes-validation

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply elevator corrections
        run: python .github/scripts/apply_elevator_fixes.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Remove temporary tooling
        run: |
          rm -f .github/scripts/apply_elevator_fixes.py
          rm -f .github/workflows/validate-elevator-fixes.yml

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Core Room elevator rendering orientation and collision"
          git push origin HEAD:elevator-fixes-validation

# Triggered after the workflow became available on the validation branch.
