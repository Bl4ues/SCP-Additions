name: Finalize requested facility fixes

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.number == 136 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply requested fixes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def must_replace(text, old, new, label, count=1):
              if new in text:
                  return text
              if old not in text:
                  raise RuntimeError(f"Missing expected source fragment: {label}")
              return text.replace(old, new, count)

          # Language names and tooltips.
          names = {
              'block.scp_additions.tesla_bottom': 'Tesla Bottom Wall',
              'block.scp_additions.tesla_mid_1': 'Tesla Wall',
              'block.scp_additions.tesla_mid_2': 'Tesla Middle Wall',
              'block.scp_additions.tesla_bottom_alt': 'Tesla Alternative Bottom Wall',
              'block.scp_additions.tesla_top_alt': 'Tesla Alternative Top Wall',
              'block.scp_additions.archival_bottom': 'Entrance Bottom Wall',
              'block.scp_additions.archival_mid': 'Entrance Middle Wall',
              'block.scp_additions.archival_top': 'Entrance Top Wall',
              'block.scp_additions.archival_bot_1': 'Archival Bottom Wall',
              'block.scp_additions.archival_mid_2': 'Archival Wall',
              'block.scp_additions.office_bottom': 'Office Bottom Wall',
              'block.scp_additions.office_mid': 'Office Middle Wall',
              'block.scp_additions.office_top': 'Office Top Wall',
              'block.scp_additions.skyroom_bot_1': 'Skyroom Bottom Wall',
              'block.scp_additions.skyroom_bot_2': 'Skyroom Alternative Bottom Wall',
              'block.scp_additions.skyroom_mid': 'Skyroom Middle Wall',
              'block.scp_additions.skyroom_top_alt': 'Skyroom Top Wall',
              'block.scp_additions.skyroom_block': 'Skyroom Wall',
              'block.scp_additions.security_bot': 'Security Bottom Wall',
              'block.scp_additions.security_mid': 'Security Middle Wall',
              'block.scp_additions.security_top': 'Security Top Wall',
              'block.scp_additions.core_room_floor': 'Blue Grate Floor',
              'block.scp_additions.sl_1_floor_2': 'Blue Floor',
              'block.scp_additions.sl_1_floor_1': 'Metal Floor',
              'block.scp_additions.sl1_wall_bot': 'Metal Bottom Wall',
              'block.scp_additions.sl1_wall_mid': 'Metal Middle Wall',
              'block.scp_additions.sl_1_wall_top': 'Metal Wall Top',
              'block.scp_additions.sl1_ceiling': 'Ceiling Tile',
              'block.scp_additions.sl1_ceiling_alt': 'Dark Ceiling',
              'block.scp_additions.sl_2_floor': 'Concrete Floor',
              'block.scp_additions.sl_2_wall_bot': 'Concrete Bottom Wall',
              'block.scp_additions.sl_2_wall_mid': 'Concrete Middle Wall',
              'block.scp_additions.sl_2_wall_top': 'Concrete Top Wall',
              'item.scp_additions.scp_1176honey': 'Honey Bottle',
          }
          tooltips = {
              'tooltip.scp_additions.tesla_gate_room': 'Tesla Gate Room',
              'tooltip.scp_additions.archival_storage_sl1a': 'Archival Storage SL1-A',
              'tooltip.scp_additions.patron_offices': 'Patron Offices',
              'tooltip.scp_additions.skyroom_cafeteria_lounge': 'Skyroom Cafeteria/Lounge',
              'tooltip.scp_additions.security_office': 'Security Office',
              'tooltip.scp_additions.sl1_blue_floor_connection': 'Connects automatically with Metal Floor.',
              'tooltip.scp_additions.sl1_metal_floor_connection': 'Connects automatically with Blue Floor.',
          }
          for path in (
              Path('src/main/resources/assets/scp_additions/lang/en_us.json'),
              Path('src/main/resources/assets/scp_additions/lang/en_us_3_0.json'),
          ):
              if path.exists():
                  data = json.loads(path.read_text(encoding='utf-8'))
                  data.update(names)
                  data.update(tooltips)
                  path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          # SCP-330: compact collision, face the placer, and enlarge around a fixed floor plane.
          path = Path('src/main/java/net/mcreator/scpadditions/block/Scp330Block.java')
          text = path.read_text(encoding='utf-8')
          text, changed = re.subn(
              r'/\* Two model-matched layers:.*?private static final VoxelShape SHAPE = Shapes\.or\(\s*box\([^;]+?\);',
              '/* Compact collision matching the visible bowl and plate. */\n'
              '    private static final VoxelShape SHAPE = box(\n'
              '            5.75D, 0.0D, 5.75D, 10.25D, 1.75D, 10.25D);',
              text, count=1, flags=re.S)
          if changed != 1 and 'Compact collision matching the visible bowl and plate.' not in text:
              raise RuntimeError('Could not replace SCP-330 collision')
          text = must_replace(text,
              'context.getHorizontalDirection().getOpposite());',
              'context.getHorizontalDirection());',
              'SCP-330 placement facing')
          path.write_text(text, encoding='utf-8')

          geo_path = Path('src/main/resources/assets/scp_additions/geo/block/scp330.geo.json')
          geo = json.loads(geo_path.read_text(encoding='utf-8'))
          scale = 1.12
          cubes = [cube for geometry in geo.get('minecraft:geometry', [])
                   for bone in geometry.get('bones', [])
                   for cube in bone.get('cubes', [])]
          min_y = min(cube['origin'][1] for cube in cubes if isinstance(cube.get('origin'), list))

          def scale_point(value):
              if not isinstance(value, list) or len(value) < 3:
                  return
              value[0] = round(value[0] * scale, 6)
              value[1] = round(min_y + (value[1] - min_y) * scale, 6)
              value[2] = round(value[2] * scale, 6)

          for geometry in geo.get('minecraft:geometry', []):
              description = geometry.get('description', {})
              if 'visible_bounds_width' in description:
                  description['visible_bounds_width'] = round(description['visible_bounds_width'] * scale, 6)
              if 'visible_bounds_height' in description:
                  description['visible_bounds_height'] = round(description['visible_bounds_height'] * scale, 6)
              if isinstance(description.get('visible_bounds_offset'), list):
                  scale_point(description['visible_bounds_offset'])
              for bone in geometry.get('bones', []):
                  scale_point(bone.get('pivot'))
                  for cube in bone.get('cubes', []):
                      scale_point(cube.get('origin'))
                      scale_point(cube.get('pivot'))
                      if isinstance(cube.get('size'), list):
                          cube['size'] = [round(component * scale, 6) for component in cube['size']]
                  for locator in bone.get('locators', {}).values():
                      scale_point(locator)
          geo_path.write_text(json.dumps(geo, separators=(',', ':')), encoding='utf-8')

          # Elevator station collision: apply the authored root rotation before world facing.
          path = Path('src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorGeometry.java')
          text = path.read_text(encoding='utf-8')
          text = must_replace(text,
              'return cellShape(boxes, facing, localX, localY, localZ);',
              'return cellShape(boxes, facing, localX, localY, localZ, true);',
              'station collision call')
          text = must_replace(text,
              'return cellShape(PULLEY_STATIC, facing, localX, localY, localZ);',
              'return cellShape(PULLEY_STATIC, facing, localX, localY, localZ, false);',
              'pulley collision call')
          text = must_replace(text,
              'return cellShape(BEAMS, facing, localX, localY, localZ);',
              'return cellShape(BEAMS, facing, localX, localY, localZ, false);',
              'beam collision call')
          text = must_replace(text,
              '    private static VoxelShape cellShape(List<AABB> source, Direction facing,\n            int localX, int localY, int localZ) {',
              '    private static VoxelShape cellShape(List<AABB> source, Direction facing,\n            int localX, int localY, int localZ, boolean modelRootRotated) {',
              'collision helper signature')
          text = must_replace(text,
              '            AABB rotated = rotateAabb(original, facing, 0.5D, 0.5D);',
              '            AABB aligned = modelRootRotated\n'
              '                    ? rotateAabb(original, Direction.EAST, 0.5D, 0.5D)\n'
              '                    : original;\n'
              '            AABB rotated = rotateAabb(aligned, facing, 0.5D, 0.5D);',
              'model-root collision alignment')
          path.write_text(text, encoding='utf-8')

          # Station hit testing and selection shapes.
          path = Path('src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorModule.java')
          text = path.read_text(encoding='utf-8')
          text = must_replace(text,
              '            Vec3 upButton = new Vec3(14.64492D / 16.0D,\n'
              '                    21.25D / 16.0D, -16.69749D / 16.0D);\n'
              '            Vec3 downButton = new Vec3(14.64492D / 16.0D,\n'
              '                    19.25D / 16.0D, -16.69749D / 16.0D);',
              '            Vec3 upButton = CoreRoomElevatorGeometry.rotateLocalVector(\n'
              '                    Direction.EAST, 14.64492D / 16.0D,\n'
              '                    21.25D / 16.0D, -16.69749D / 16.0D);\n'
              '            Vec3 downButton = CoreRoomElevatorGeometry.rotateLocalVector(\n'
              '                    Direction.EAST, 14.64492D / 16.0D,\n'
              '                    19.25D / 16.0D, -16.69749D / 16.0D);',
              'station button hit positions')
          text = must_replace(text,
              '            return CoreRoomElevatorGeometry.stationSelectionCellShape();',
              '            boolean gateSolid = !(level.getBlockEntity(pos)\n'
              '                    instanceof StationBlockEntity station)\n'
              '                    || station.isGateCollisionSolid();\n'
              '            return CoreRoomElevatorGeometry.stationCellShape(\n'
              '                    state.getValue(FACING), 0, 0, 0, gateSolid);',
              'station selection shape')
          text = must_replace(text,
              '        public VoxelShape getShape(BlockState state, BlockGetter level,\n'
              '                BlockPos pos, CollisionContext context) {\n'
              '            return Shapes.block();\n'
              '        }\n\n'
              '        @Override\n'
              '        public VoxelShape getCollisionShape',
              '        public VoxelShape getShape(BlockState state, BlockGetter level,\n'
              '                BlockPos pos, CollisionContext context) {\n'
              '            return getCollisionShape(state, level, pos, context);\n'
              '        }\n\n'
              '        @Override\n'
              '        public VoxelShape getCollisionShape',
              'multiblock selection shape')
          path.write_text(text, encoding='utf-8')

          # Prompt anchors match the same root transform and use pickup-like scale.
          path = Path('src/main/java/com/bl4ues/scpinventory/context/ContextInteractionRegistry.java')
          text = path.read_text(encoding='utf-8')
          if 'CoreRoomElevatorGeometry' not in text:
              text = text.replace(
                  'import net.mcreator.scpadditions.facility.elevator.CoreRoomElevatorCarriageEntity;\n',
                  'import net.mcreator.scpadditions.facility.elevator.CoreRoomElevatorCarriageEntity;\n'
                  'import net.mcreator.scpadditions.facility.elevator.CoreRoomElevatorGeometry;\n')
          text = must_replace(text,
              '            double x = 0.5D + 14.64492D / 16.0D;\n'
              '            double z = 0.5D - 16.69749D / 16.0D;',
              '            Vec3 modelAligned = CoreRoomElevatorGeometry.rotateLocalVector(\n'
              '                    Direction.EAST, 14.64492D / 16.0D, 0.0D,\n'
              '                    -16.69749D / 16.0D);\n'
              '            double x = 0.5D + modelAligned.x;\n'
              '            double z = 0.5D + modelAligned.z;',
              'station prompt anchor')
          text = text.replace('"front", "hand", "hand", 0.55D));',
                              '"front", "hand", "hand", 0.38D));')
          path.write_text(text, encoding='utf-8')

          # Carriage floor catch and shell collision.
          path = Path('src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorCarriageEntity.java')
          text = path.read_text(encoding='utf-8')
          text = must_replace(text,
              '        if (!horizontalOverlap || previous.y < floor.maxY - 0.12D\n'
              '                || box.minY >= floor.maxY) return;',
              '        boolean crossedFloor = previous.y >= floor.maxY - 0.18D\n'
              '                && box.minY < floor.maxY;\n'
              '        boolean recoverBelowFloor = box.minY < floor.maxY\n'
              '                && box.minY > floor.minY - 0.85D;\n'
              '        if (!horizontalOverlap || (!crossedFloor && !recoverBelowFloor)) return;',
              'carriage floor catch')
          text = text.replace('private static final double FLOOR_TOP = 0.25D / 16.0D;',
                              'private static final double FLOOR_TOP = 0.0D;')
          path.write_text(text, encoding='utf-8')

          # Thick black pulley cables using a guaranteed vanilla texture.
          path = Path('src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorClient.java')
          text = path.read_text(encoding='utf-8')
          text = must_replace(text,
              '    private static final ResourceLocation CABLE_TEXTURE = new ResourceLocation(\n'
              '            ScpAdditionsMod.MODID,\n'
              '            "textures/block/core_room_elevator_beams.png");',
              '    private static final ResourceLocation CABLE_TEXTURE = new ResourceLocation(\n'
              '            "minecraft", "textures/block/black_concrete.png");',
              'cable texture')
          text = text.replace('float radius = 0.028F;', 'float radius = 0.0625F;')
          path.write_text(text, encoding='utf-8')

          # Move room-specific construction blocks from General to Sublevel 1.
          path = Path('src/main/java/net/mcreator/scpadditions/facility/FacilityModule.java')
          text = path.read_text(encoding='utf-8')
          moved = [
              'archival_bottom', 'archival_mid', 'archival_top', 'archival_bot_1', 'archival_mid_2',
              'office_bottom', 'office_mid', 'office_top',
              'skyroom_bot_1', 'skyroom_bot_2', 'skyroom_mid', 'skyroom_top_alt', 'skyroom_block',
              'security_bot', 'security_mid', 'security_top',
          ]
          for block_id in moved:
              text = text.replace(f'        addFacilityCreativeItem(general, "{block_id}");\n', '')
          insertion = ''.join(f'        addFacilityCreativeItem(sublevel1, "{block_id}");\n' for block_id in moved)
          marker = '        sections.add(section("sl1tab", sublevel1));'
          if insertion not in text:
              if marker not in text:
                  raise RuntimeError('Could not find Sublevel 1 section marker')
              text = text.replace(marker, insertion + marker, 1)
          path.write_text(text, encoding='utf-8')

          # Distinct connected-floor descriptions.
          path = Path('src/main/java/net/mcreator/scpadditions/facility/UBlocksModule.java')
          text = path.read_text(encoding='utf-8')
          text = must_replace(text,
              '            tooltip.add(Component.translatable("tooltip.scp_additions.sl1_connected_floors")\n'
              '                    .withStyle(ChatFormatting.GRAY));',
              '            String connectionKey = "sl_1_floor_1".equals(path)\n'
              '                    ? "tooltip.scp_additions.sl1_metal_floor_connection"\n'
              '                    : "tooltip.scp_additions.sl1_blue_floor_connection";\n'
              '            tooltip.add(Component.translatable(connectionKey)\n'
              '                    .withStyle(ChatFormatting.GRAY));',
              'connected floor tooltip')
          path.write_text(text, encoding='utf-8')

          # Zone and room tooltips for plain FacilityModule BlockItems.
          Path('src/main/java/net/mcreator/scpadditions/facility/FacilityTooltipEvents.java').write_text('''package net.mcreator.scpadditions.facility;

          import net.minecraft.ChatFormatting;
          import net.minecraft.network.chat.Component;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraftforge.event.entity.player.ItemTooltipEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.mcreator.scpadditions.ScpAdditionsMod;

          import java.util.Map;
          import java.util.Set;

          @Mod.EventBusSubscriber(modid = ScpAdditionsMod.MODID)
          public final class FacilityTooltipEvents {
              private static final Set<String> TESLA = Set.of(
                      "tesla_bottom", "tesla_mid_1", "tesla_mid_2",
                      "tesla_bottom_alt", "tesla_top_alt");
              private static final Map<String, String> SUBLEVEL_ONE_ROOMS = Map.ofEntries(
                      Map.entry("archival_bottom", "tooltip.scp_additions.archival_storage_sl1a"),
                      Map.entry("archival_mid", "tooltip.scp_additions.archival_storage_sl1a"),
                      Map.entry("archival_top", "tooltip.scp_additions.archival_storage_sl1a"),
                      Map.entry("archival_bot_1", "tooltip.scp_additions.archival_storage_sl1a"),
                      Map.entry("archival_mid_2", "tooltip.scp_additions.archival_storage_sl1a"),
                      Map.entry("office_bottom", "tooltip.scp_additions.patron_offices"),
                      Map.entry("office_mid", "tooltip.scp_additions.patron_offices"),
                      Map.entry("office_top", "tooltip.scp_additions.patron_offices"),
                      Map.entry("skyroom_bot_1", "tooltip.scp_additions.skyroom_cafeteria_lounge"),
                      Map.entry("skyroom_bot_2", "tooltip.scp_additions.skyroom_cafeteria_lounge"),
                      Map.entry("skyroom_mid", "tooltip.scp_additions.skyroom_cafeteria_lounge"),
                      Map.entry("skyroom_top_alt", "tooltip.scp_additions.skyroom_cafeteria_lounge"),
                      Map.entry("skyroom_block", "tooltip.scp_additions.skyroom_cafeteria_lounge"),
                      Map.entry("security_bot", "tooltip.scp_additions.security_office"),
                      Map.entry("security_mid", "tooltip.scp_additions.security_office"),
                      Map.entry("security_top", "tooltip.scp_additions.security_office"));

              private FacilityTooltipEvents() {}

              @SubscribeEvent
              public static void appendFacilityTooltips(ItemTooltipEvent event) {
                  ResourceLocation id = ForgeRegistries.ITEMS.getKey(event.getItemStack().getItem());
                  if (id == null || !ScpAdditionsMod.MODID.equals(id.getNamespace())) return;
                  String path = id.getPath();
                  if (TESLA.contains(path)) {
                      event.getToolTip().add(Component.translatable(
                              "tooltip.scp_additions.tesla_gate_room")
                              .withStyle(ChatFormatting.GRAY));
                      return;
                  }
                  String roomKey = SUBLEVEL_ONE_ROOMS.get(path);
                  if (roomKey != null) {
                      event.getToolTip().add(Component.translatable(
                              "tooltip.scp_additions.sublevel_1")
                              .withStyle(ChatFormatting.BLUE));
                      event.getToolTip().add(Component.translatable(roomKey)
                              .withStyle(ChatFormatting.GRAY));
                  }
              }
          }
          ''', encoding='utf-8')

          # Final source assertions.
          checks = {
              'Honey Bottle': Path('src/main/resources/assets/scp_additions/lang/en_us.json'),
              'Blue Grate Floor': Path('src/main/resources/assets/scp_additions/lang/en_us_3_0.json'),
              'minecraft", "textures/block/black_concrete.png': Path('src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorClient.java'),
              'FacilityTooltipEvents': Path('src/main/java/net/mcreator/scpadditions/facility/FacilityTooltipEvents.java'),
          }
          for needle, source in checks.items():
              if needle not in source.read_text(encoding='utf-8'):
                  raise RuntimeError(f'Validation failed for {needle} in {source}')
          PY

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Remove temporary tooling
        shell: bash
        run: |
          rm -f \
            .github/workflows/finalize-requested-facility-fixes.yml \
            .github/workflows/apply-facility-elevator-polish.yml \
            .github/workflows/apply-facility-polish-fast.yml \
            .github/workflows/run-facility-polish-logged.yml \
            .github/workflows/diagnose-elevator-tabs.yml \
            tools/hotfix/APPLY_FACILITY_ELEVATOR_POLISH \
            tools/hotfix/APPLY_FACILITY_POLISH_FAST \
            tools/hotfix/RUN_FACILITY_POLISH_LOGGED \
            tools/hotfix/RUN_FACILITY_POLISH \
            tools/hotfix/DIAGNOSE_ELEVATOR_TABS \
            tools/elevator-facility-diagnostic.txt

      - name: Commit validated result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix facility naming, SCP-330, and Core Room elevator collision"
          git push origin HEAD:master
