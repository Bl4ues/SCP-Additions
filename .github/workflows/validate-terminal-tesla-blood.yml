name: Validate Terminal Tesla Blood Fixes

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply fixes
        run: python3 scripts/apply_terminal_tesla_blood_fixes.py

      - name: Validate source structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'src/main/java/net/mcreator/scpadditions/block/TeslaGateBlock.java': [
                  'SENSOR_INTERVAL_TICKS = 1',
                  'boolean activationQueued',
              ],
              'src/main/java/net/mcreator/scpadditions/procedures/TeslaGateVolume.java': [
                  'intersectsOrCrossed',
                  'centerPathTarget.clip',
              ],
              'src/main/java/net/mcreator/scpadditions/procedures/BloodType1Procedure.java': [
                  'onPlayerLoggedIn',
                  'nextInt(8)',
              ],
              'src/main/java/net/mcreator/scpadditions/world/inventory/TeslaTerminalMenu.java': [
                  'initialHasSecurityCredentials',
              ],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{needle!r} missing from {path}')
          PY
          git diff --check

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md src/main scripts/apply_terminal_tesla_blood_fixes.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix terminal credentials, Tesla timing, and blood initialization"
          git push origin HEAD:${{ github.head_ref }}
