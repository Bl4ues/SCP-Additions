name: Validate linked roof G1 loft and parent mesh
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch linked roof geometry and parent tessellation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/temp_surface_g1_loft_patch.py')
          content = path.read_text()
          old = '                link.reverseSecond(), firstProfile, secondProfile,\n                firstCells, secondCells'
          new = '                        link.reverseSecond(), firstProfile, secondProfile,\n                        firstCells, secondCells'
          assert content.count(old) == 2, 'Unexpected bridge patch shape'
          path.write_text(content.replace(old, new))
          PY
          python3 .github/scripts/temp_surface_g1_loft_patch.py
      - name: Verify project integrity
        run: python3 .github/scripts/verify_project_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run available tests
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Commit only validated Java changes on master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/ConstructionSurface.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformSurfaceBridge.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformConstructionSavedData.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Build a tangent-matched linked ceiling and prevent mother-wall T-junctions'
          git pull --rebase origin master
          git push origin HEAD:master
