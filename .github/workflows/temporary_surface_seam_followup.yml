name: Validate curved ceiling-wall seam geometry
on:
  push:
    paths:
      - .github/workflows/temporary_surface_seam_followup.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Reconcile structural boundary meshes
        run: python3 .github/scripts/temporary_surface_seam_followup.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build complete mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit only validated seam correction
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Weld compatible partial curved wall and ceiling edges with local tessellation'
          git pull --rebase origin master
          git push origin HEAD:master
