name: Validate editor preview and clearance placement
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_remaining_editor.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated editor and map updates
        run: python3 .github/scripts/temporary_remaining_editor.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit verified editor and clearance fix
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformEditorRenderTypes.java
          git commit -m 'Center keycard badge ink and render responsive see-through construction gizmos'
          git pull --rebase origin master
          git push origin HEAD:master
