name: Apply custom item interaction sounds

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  implement:
    if: contains(github.event.head_commit.message, '[item-sounds]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize patch helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_apply_custom_item_sounds.py')
          text = path.read_text(encoding='utf-8')
          old_write = '''def write(path, text):
              Path(path).write_text(text, encoding="utf-8")
          '''
          new_write = '''def write(path, text):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8")
          '''
          if old_write not in text:
              raise SystemExit('write helper marker not found')
          text = text.replace(old_write, new_write, 1)
          old_lang = '''lang_text = read(lang)
          if '\"subtitles.scp_additions.inventory_pickup\"' not in lang_text:
              if not lang_text.startswith('{\\n'):
                  raise SystemExit("Unexpected en_us.json format")
              lang_text = lang_text.replace('{\\n',
                  '{\\n  \"subtitles.scp_additions.inventory_pickup\": \"Item picked up\",\\n'
                  '  \"subtitles.scp_additions.inventory_eat\": \"Eating\",\\n'
                  '  \"subtitles.scp_additions.inventory_drink\": \"Drinking\",\\n', 1)
              write(lang, lang_text)
          '''
          new_lang = '''lang_text = read(lang)
          if '\"subtitles.scp_additions.inventory_pickup\"' not in lang_text:
              if not lang_text.startswith('{'):
                  raise SystemExit("Unexpected en_us.json format")
              prefix = ('{\"subtitles.scp_additions.inventory_pickup\":\"Item picked up\",'
                        '\"subtitles.scp_additions.inventory_eat\":\"Eating\",'
                        '\"subtitles.scp_additions.inventory_drink\":\"Drinking\",')
              lang_text = prefix + lang_text[1:]
              write(lang, lang_text)
          '''
          if old_lang not in text:
              raise SystemExit('Language helper marker not found')
          path.write_text(text.replace(old_lang, new_lang, 1), encoding='utf-8')
          PY

      - name: Apply implementation
        run: |
          set +e
          output=$(python3 scripts/_apply_custom_item_sounds.py 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output" > scripts/_item_sounds_failure.txt
            git config user.name "Deyvid Campos"
            git config user.email "deyvid04campos@gmail.com"
            git add scripts/_item_sounds_failure.txt
            git commit -m "Record custom item sound patch failure"
            git push origin HEAD:master
            exit "$status"
          fi

          set +e
          output=$(python3 - <<'PY' 2>&1
          from pathlib import Path
          import json
          import re

          client = Path('src/main/java/net/mcreator/scpadditions/config/ui/ClientPreferenceModulesUi.java')
          text = client.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?P<indent>\s*)Boolean personal = scopeForLabel\(scopes,\s*\n'
              r'\s*stripState\(label\.getString\(\)\)\);')
          replacement = (
              '\\g<indent>String base = stripState(label.getString());\n'
              '\\g<indent>Boolean personal = scopeForLabel(scopes, base);')
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Client dependency gate marker not found')
          client.write_text(text, encoding='utf-8')

          lang = Path('src/main/resources/assets/scp_additions/lang/en_us.json')
          data = json.loads(lang.read_text(encoding='utf-8'))
          lang.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          )
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output" > scripts/_item_sounds_failure.txt
            git config user.name "Deyvid Campos"
            git config user.email "deyvid04campos@gmail.com"
            git add scripts/_item_sounds_failure.txt
            git commit -m "Record custom item sound post-processing failure"
            git push origin HEAD:master
            exit "$status"
          fi

          git diff --check

      - name: Build
        run: |
          chmod +x gradlew
          set +e
          output=$(./gradlew clean build 2>&1)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output" > scripts/_item_sounds_build_failure.txt
            git config user.name "Deyvid Campos"
            git config user.email "deyvid04campos@gmail.com"
            git add scripts/_item_sounds_build_failure.txt
            git commit -m "Record custom item sound build failure"
            git push origin HEAD:master
            exit "$status"
          fi
          printf '%s\n' "$output"

      - name: Commit implementation
        run: |
          rm -f scripts/_apply_custom_item_sounds.py
          rm -f scripts/_item_sounds_failure.txt
          rm -f scripts/_item_sounds_build_failure.txt
          rm -f .github/workflows/apply-custom-item-sounds.yml
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Add custom SCP Inventory interaction sounds"
          git push origin HEAD:master
