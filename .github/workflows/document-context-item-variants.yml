name: Document contextual item variants

on:
  push:
    branches:
      - 'feature/context-item-variants'

permissions:
  contents: write

jobs:
  document:
    if: contains(github.event.head_commit.message, '[context-docs]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update changelog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Contextual interactions\n\n'
          addition = '''## Contextual interactions\n\n- Added item-specific contextual interactions and inherited alternate variants, allowing one block or entity to expose different actions according to the item held without duplicating its complete configuration;\n- Rebuilt the in-world **K** interaction editor with responsive **Prompt** and **Anchor** pages, default and variant navigation, duplication and removal controls, held-item selection, independent icons, item requirements, and per-variant anchors;\n- Added the `config.png` contextual icon and native Screwdriver prompts for keycard readers, Tesla Gate Terminals, Core Room elevator floor stations, editable facility signs, SCP-131-A/B, and Roombas;\n- Added Configuration Center badges that identify interactions with alternate variants and item-specific actions.\n'''
          if marker not in text:
              raise SystemExit('Contextual interactions changelog section not found')
          path.write_text(text.replace(marker, addition, 1), encoding='utf-8')
          PY
      - name: Commit documentation
        shell: bash
        run: |
          rm -f .github/workflows/document-context-item-variants.yml
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git commit -m "Document contextual interaction variants"
          git push origin HEAD:feature/context-item-variants
