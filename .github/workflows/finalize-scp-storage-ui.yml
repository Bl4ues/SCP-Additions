name: Finalize SCP storage UI

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize-storage-ui]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Polish responsive storage UI and changelog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          screen = Path('src/main/java/com/bl4ues/scpinventory/client/gui/ScpStorageContainerScreen.java')
          text = screen.read_text(encoding='utf-8')

          old = '''    private void renderHeaders(GuiGraphics graphics) {\n        drawSectionTitle(graphics, leftPanelX, titleY,\n                \"://INVENTORY_\", \"BACKPACK\");\n        drawBackpackCount(graphics);\n\n        drawSectionTitle(graphics, rightPanelX, titleY,\n                \"://CONTAINER_\", stylizedContainerName());\n        drawContainerCount(graphics);\n    }\n'''
          new = '''    private void renderHeaders(GuiGraphics graphics) {\n        drawSectionTitle(graphics, leftPanelX, titleY,\n                \"://INVENTORY_\", \"BACKPACK\");\n        drawBackpackCount(graphics);\n\n        String containerPrefix = \"://CONTAINER_\";\n        int titleBudget = Math.max(48, panelWidth\n                - containerCountWidth() - 12);\n        String containerSuffix = trimSectionSuffix(containerPrefix,\n                stylizedContainerName(), titleBudget);\n        drawSectionTitle(graphics, rightPanelX, titleY,\n                containerPrefix, containerSuffix);\n        drawContainerCount(graphics);\n    }\n\n    private int containerCountWidth() {\n        int occupied = containerList == null\n                ? countNonEmpty(containerItems)\n                : containerList.nonEmptyCount();\n        String primary = Integer.toString(occupied);\n        String suffix = \" of \" + storageSlotIds.size() + \" slots\";\n        return minecraft.font.width(ScpFonts.roboto(primary))\n                + minecraft.font.width(ScpFonts.roboto(suffix));\n    }\n\n    private String trimSectionSuffix(String prefix, String suffix,\n                                     int totalBudget) {\n        int available = totalBudget\n                - minecraft.font.width(ScpFonts.roboto(prefix));\n        if (available <= 0) {\n            return \"\";\n        }\n        if (minecraft.font.width(ScpFonts.roboto(suffix)) <= available) {\n            return suffix;\n        }\n        String ellipsis = \"...\";\n        int ellipsisWidth = minecraft.font.width(ScpFonts.roboto(ellipsis));\n        if (available <= ellipsisWidth) {\n            return ellipsis;\n        }\n        return minecraft.font.plainSubstrByWidth(\n                suffix, available - ellipsisWidth).trim() + ellipsis;\n    }\n'''
          if old not in text:
              raise SystemExit('renderHeaders marker not found')
          text = text.replace(old, new, 1)

          old_footer = '''    private void renderFooter(GuiGraphics graphics) {\n        String hint = \"Double-click or Shift + Right Click to transfer\"\n                + \"   ·   Drag between panels\";\n        drawCentered(graphics, hint, width / 2, footerY, TEXT_GRAY);\n    }\n'''
          new_footer = '''    private void renderFooter(GuiGraphics graphics) {\n        String hint = \"Double-click or Shift + Right Click to transfer\"\n                + \"   ·   Drag between panels\";\n        int budget = Math.max(120, width - 24);\n        if (minecraft.font.width(ScpFonts.roboto(hint)) > budget) {\n            hint = \"Double-click / Shift+RMB / Drag to transfer\";\n        }\n        if (minecraft.font.width(ScpFonts.roboto(hint)) > budget) {\n            hint = \"Transfer: double-click or drag\";\n        }\n        drawCentered(graphics, hint, width / 2, footerY, TEXT_GRAY);\n    }\n'''
          if old_footer not in text:
              raise SystemExit('renderFooter marker not found')
          text = text.replace(old_footer, new_footer, 1)
          screen.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          entry = ('- Added an SCP Inventory-style interface for plain slot-only storage containers while the custom inventory is enabled, replacing supported chest, barrel, shulker, hopper, dispenser, and compatible modded storage screens with responsive Backpack/Keys/Codex and container lists, live slot counts, scrolling, double-click or Shift+Right Click transfer, and drag-and-drop while preserving native screens for crafting, processing, equipment, and other semantic menus;\n')
          marker = '## Interface and presentation\n\n'
          if entry not in changelog_text:
              if marker not in changelog_text:
                  raise SystemExit('Interface changelog section not found')
              changelog_text = changelog_text.replace(marker, marker + entry, 1)
              changelog.write_text(changelog_text, encoding='utf-8')
          PY
      - name: Commit final storage UI
        shell: bash
        run: |
          rm -f .github/workflows/finalize-scp-storage-ui.yml
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git commit -m "Polish and document SCP storage containers"
          git push origin HEAD:master
