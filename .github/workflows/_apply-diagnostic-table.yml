name: Repair Archivist Table UVs

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/_apply-diagnostic-table.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore canonical Blockbench UV mapping
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          import copy
          import json
          import zlib

          # Exact user-provided "right" Blockbench model, compressed only to keep
          # this one-shot repair workflow small. Its geometry is the unshifted
          # reference; only its per-face UV mappings are copied into the live model.
          RIGHT_ZLIB_B64 = ''''''

          right = json.loads(zlib.decompress(base64.b64decode(RIGHT_ZLIB_B64)).decode('utf-8'))
          path = Path('src/main/resources/assets/scp_additions/models/block/archivists_table.json')
          current = json.loads(path.read_text(encoding='utf-8'))

          if len(right.get('elements', [])) != 35 or len(current.get('elements', [])) != 35:
              raise RuntimeError('Archivist table must contain exactly 35 elements in both models')

          def geom_key(element, current_shifted=False):
              def vector(values):
                  result = []
                  for i, value in enumerate(values):
                      number = float(value)
                      if current_shifted and i == 2:
                          number += 0.16
                      result.append(round(number, 5))
                  return tuple(result)
              rotation = element.get('rotation', {})
              return (
                  vector(element['from']),
                  vector(element['to']),
                  rotation.get('angle'),
                  rotation.get('axis'),
                  vector(rotation['origin']) if 'origin' in rotation else None,
              )

          canonical = {}
          for element in right['elements']:
              key = geom_key(element)
              if key in canonical:
                  raise RuntimeError('Duplicate geometry in canonical right model')
              canonical[key] = copy.deepcopy(element['faces'])

          matched = 0
          changed = 0
          seen = set()
          for element in current['elements']:
              key = geom_key(element, current_shifted=True)
              faces = canonical.get(key)
              if faces is None:
                  raise RuntimeError(f'No canonical UV match for geometry: {key}')
              if key in seen:
                  raise RuntimeError(f'Duplicate current geometry: {key}')
              seen.add(key)
              matched += 1
              if element.get('faces') != faces:
                  changed += 1
              element['faces'] = faces

          if matched != 35 or len(seen) != 35:
              raise RuntimeError(f'Expected 35 one-to-one UV matches, got {matched}')

          # Keep the released resource identity, not the Blockbench-local texture path.
          current['textures'] = {
              '0': 'scp_additions:block/archivists_table',
              'particle': 'scp_additions:block/archivists_table',
          }

          path.write_text(json.dumps(current, indent=2) + '\n', encoding='utf-8')
          json.loads(path.read_text(encoding='utf-8'))
          print(f'Restored canonical UVs for {matched} elements; {changed} elements changed.')
          PY

      - name: Commit repaired model
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/scp_additions/models/block/archivists_table.json
          if git diff --cached --quiet; then
            echo "No model changes needed."
            exit 0
          fi
          git commit -m "Restore Archivist's Table UV mapping"
          git push origin HEAD:master
