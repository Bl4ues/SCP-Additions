name: Classified Directive Rebrand

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/rebrand_classified_directive.py'
      - 'scripts/rebrand_classified_directive_hotfix.py'
      - 'scripts/rebrand_classified_directive_compat.py'
      - '.github/workflows/rebrand-classified-directive.yml'

permissions:
  contents: write

concurrency:
  group: classified-directive-rebrand
  cancel-in-progress: true

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to current master
        run: |
          git fetch origin master
          git reset --hard origin/master
          rm -f .github/rebrand-failure.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run migration
        run: |
          python3 scripts/rebrand_classified_directive_hotfix.py
          python3 scripts/rebrand_classified_directive.py
          python3 scripts/rebrand_classified_directive_compat.py

      - name: Remove one-shot migration files
        run: |
          rm scripts/rebrand_classified_directive.py
          rm scripts/rebrand_classified_directive_hotfix.py
          rm scripts/rebrand_classified_directive_compat.py
          rm .github/workflows/rebrand-classified-directive.yml
          rm -f .github/rebrand-failure.txt

      - name: Validate migrated build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Commit migrated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand as SCP: Classified Directive"

      - name: Merge migrated tree into current master
        env:
          GH_TOKEN: ${{ github.token }}
          TEMP_BRANCH: classified-directive-rebrand-tmp
        run: |
          set -euo pipefail
          cleanup() {
            curl -sS -L -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${TEMP_BRANCH}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in 1 2 3 4 5; do
            echo "Atomic merge attempt ${attempt}/5"
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "Rebase conflict against current master"
              exit 1
            fi

            ./gradlew clean build --stacktrace
            git push --force origin HEAD:refs/heads/${TEMP_BRANCH}

            body=$(printf '{"base":"master","head":"%s","commit_message":"Rebrand as SCP: Classified Directive"}' "${TEMP_BRANCH}")
            response=$(curl -sS -w '\n%{http_code}' -L -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/merges" \
              -d "${body}")
            status=$(printf '%s' "${response}" | tail -n1)
            payload=$(printf '%s' "${response}" | sed '$d')

            if [ "${status}" = "201" ] || [ "${status}" = "204" ]; then
              echo "Migration merged into master"
              exit 0
            fi

            echo "Merge API returned HTTP ${status}: ${payload}"
            if [ "${status}" != "409" ]; then
              exit 1
            fi
          done

          echo "Could not atomically merge after five attempts"
          exit 1

      - name: Record failed run
        if: failure()
        run: |
          git rebase --abort 2>/dev/null || true
          for attempt in 1 2 3; do
            echo "Failure-marker push attempt ${attempt}/3"
            git fetch origin master
            git reset --hard origin/master
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            printf 'run_id=%s\nrun_url=%s/actions/runs/%s\n' "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > .github/rebrand-failure.txt
            git add .github/rebrand-failure.txt
            git commit -m "Record failed Classified Directive migration [skip ci]" || true
            if git push origin HEAD:master; then
              exit 0
            fi
          done
          echo "Could not record the failed migration after three attempts"
          exit 1
