name: Apply SCiPNET alignment fix

on:
  push:
    branches:
      - fix/scipnet-baseline-purge-position
    paths:
      - tools/hotfix/APPLY_SCIPNET_ALIGNMENT

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/scipnet-baseline-purge-position
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply alignment fix
        run: python3 tools/hotfix/fix_scipnet_alignment.py

      - name: Remove temporary integration files
        run: |
          rm -f tools/hotfix/fix_scipnet_alignment.py
          rm -f tools/hotfix/APPLY_SCIPNET_ALIGNMENT
          rm -f .github/workflows/apply-scipnet-alignment.yml

      - name: Build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct SCiPNET text alignment" || exit 0
          git push origin HEAD:fix/scipnet-baseline-purge-position
