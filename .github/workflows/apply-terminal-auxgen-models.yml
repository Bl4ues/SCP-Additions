name: Apply terminal and auxiliary generator models

on:
  push:
    branches:
      - feature/scipnet-terminal-auxgen-models
    paths:
      - tools/hotfix/APPLY_TERMINAL_AUXGEN_MODELS

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/scipnet-terminal-auxgen-models
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply implementation
        run: python tools/hotfix/apply_terminal_auxgen_models.py

      - name: Remove temporary integration files
        run: |
          rm -f .github/workflows/apply-terminal-auxgen-models.yml
          rm -f tools/hotfix/apply_terminal_auxgen_models.py
          rm -f tools/hotfix/APPLY_TERMINAL_AUXGEN_MODELS

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Commit implementation
        run: |
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git commit -m "Add SCiPNET terminal and powered auxiliary generators"
          git push origin HEAD:feature/scipnet-terminal-auxgen-models
