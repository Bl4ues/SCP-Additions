name: Temporary Facility Tab Corrections

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply corrections
        run: python3 scripts/temp_fix_facility_tab_docs.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Commit validated source
        run: |
          git config user.name "Bl4ues"
          git config user.email "28213049+Bl4ues@users.noreply.github.com"
          git add CHANGELOG.md src/main/java/net/mcreator/scpadditions/facility/FacilityModule.java
          git commit -m "Correct facility tab organization and changelog"
          git push origin HEAD:agent/fix-facility-tab-docs
