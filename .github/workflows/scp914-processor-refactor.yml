name: SCP-914 Dial Server State

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/scp914-processor-refactor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Add authoritative dial detents and sound feedback
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/main/java/com/bl4ues/scpclassifieddirective/block/entity/Scp914BlockEntity.java')
          text = path.read_text()

          field_marker = '    private Setting setting = Setting.ONE_TO_ONE;\n'
          field = field_marker + '    private long lastGearSoundGameTime = Long.MIN_VALUE;\n'
          if 'lastGearSoundGameTime' not in text:
              if field_marker not in text:
                  raise SystemExit('SCP-914 dial state marker not found')
              text = text.replace(field_marker, field, 1)

          method_marker = '    public void setDialAngle(float angle, boolean commitSetting) {\n'
          method = '''    public void applyDialNetworkUpdate(float requestedAngle, boolean commit) {
              if (!(level instanceof ServerLevel serverLevel) || refining) return;
              float clamped = Math.max(ROUGH_ANGLE,
                      Math.min(VERY_FINE_ANGLE, requestedAngle));
              float targetAngle;
              if (commit) {
                  Setting target = Setting.nearest(clamped);
                  setting = target;
                  targetAngle = target.angle();
              } else {
                  targetAngle = Math.round(clamped / 7.5F) * 7.5F;
                  targetAngle = Math.max(ROUGH_ANGLE,
                          Math.min(VERY_FINE_ANGLE, targetAngle));
              }

              boolean changed = Math.abs(targetAngle - dialAngle) > 0.001F;
              dialAngle = targetAngle;
              long now = serverLevel.getGameTime();
              if ((changed && now != lastGearSoundGameTime) || commit) {
                  lastGearSoundGameTime = now;
                  Direction front = Scp914Structure.facing(getBlockState());
                  playAt(serverLevel,
                          Scp914Structure.dialAnchor(worldPosition, front),
                          Scp914Module.gearSound(serverLevel.random.nextInt(9) + 1),
                          commit ? 1.0F : 0.55F);
              }
              if (changed || commit) sync();
          }

'''
          if 'applyDialNetworkUpdate' not in text:
              if method_marker not in text:
                  raise SystemExit('SCP-914 dial method marker not found')
              text = text.replace(method_marker, method + method_marker, 1)

          path.write_text(text)
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/bl4ues/scpclassifieddirective/block/entity/Scp914BlockEntity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add authoritative SCP-914 dial detents"
          git push origin HEAD:master
