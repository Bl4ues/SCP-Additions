name: Validate Surface editor fixes
on:
  push:
    paths:
      - .github/workflows/temporary_surface_followup_20260920.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply focused renderer changes
        run: python3 .github/scripts/temporary_surface_followup_20260920.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit validated changes to master
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Restore missing Surface faces and render editing gizmos above world layers'
          git push origin HEAD:master
