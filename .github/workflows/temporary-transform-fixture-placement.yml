name: Apply shifted-fixture placement correction
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary-transform-fixture-placement.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch shared fixture placement address
        run: python3 .github/scripts/temporary_transform_fixture_placement.py
      - name: Commit group placement consistency
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformGroupPlacementClient.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformConstructionManager.java
          git commit -m 'Place next to visible off-grid fixtures using local cell addresses'
          git push origin HEAD:master
