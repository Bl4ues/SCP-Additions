name: Apply Real Creative Tab Sections

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply creative tab redesign
        run: python3 scripts/apply_real_creative_sections.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Commit validated source
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "Bl4ues"
          git config user.email "28213049+Bl4ues@users.noreply.github.com"
          git add -A
          git commit -m "Implement real creative tab section headers"
          git push origin HEAD:agent/creative-tab-real-sections
