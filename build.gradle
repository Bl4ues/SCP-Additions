plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '4.0.0'
group = 'com.bl4ues.scpclassifieddirective'
archivesBaseName = 'scp_classified_directive'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.layout.buildDirectory.get().asFile}/createSrgToMcp/output.srg"

            mods {
                scp_classified_directive {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.layout.buildDirectory.get().asFile}/createSrgToMcp/output.srg"

            mods {
                scp_classified_directive {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'scp_classified_directive.refmap.json'
    config 'scp_classified_directive.mixins.json'
}

repositories {
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }

    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }

    maven {
        name = 'SimpleVoiceChat'
        url = 'https://maven.maxhenkel.de/repository/public'
    }

    // Client-side test dependencies are resolved from Modrinth without being
    // compiled into or bundled with the public SCP: Classified Directive artifact.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // API-only compile dependency for the optional Simple Voice Chat bridge.
    // The API is not shaded into SCP: Classified Directive; users still install the mod
    // normally on both client and server when they want voice integration.
    implementation 'de.maxhenkel.voicechat:voicechat-api:2.6.20'

    // Optional client runtime used by runClient to validate shader compatibility
    // and custom player/entity rendering. These are not transitive requirements
    // for users of SCP: Classified Directive.
    runtimeOnly fg.deobf('maven.modrinth:oaG6aa1j:u7GegV7U') // Kleider's Custom Renderer 7.4.1
    runtimeOnly fg.deobf('maven.modrinth:sk9rgfiA:UTbfe5d1') // Embeddium 0.3.31
    runtimeOnly fg.deobf('maven.modrinth:GchcoXML:iQ1SwGc3') // Oculus 1.8.0
    runtimeOnly fg.deobf('maven.modrinth:simple-voice-chat:forge-1.20.1-2.6.22')
}

processResources {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/mods.toml') {
        expand mod_version: project.version
    }

    exclude 'assets/scp_classified_directive/lang/en_us_3_0.json'

    // The standalone Inventory replaced Minecraft's global font with Roboto.
    // The integrated mod must use Roboto only through explicitly styled UI text.
    exclude 'assets/minecraft/font/default.json'

    // All left/right and level-specific reader recipes are legacy. The only
    // public recipe now creates the single level-1-by-default reader item.
    exclude 'data/scp_classified_directive/recipes/lv_*_kr_right.json'
    exclude 'data/scp_classified_directive/recipes/lv_*_lto_r.json'
    exclude 'data/scp_classified_directive/recipes/lv_*_rto_l.json'
    exclude 'data/scp_classified_directive/recipes/lv_2_kr_left.json'
    exclude 'data/scp_classified_directive/recipes/lv_3_kr_left.json'
    exclude 'data/scp_classified_directive/recipes/lv_4_kr_left.json'
    exclude 'data/scp_classified_directive/recipes/lv_5_kr_left.json'
    exclude 'data/scp_classified_directive/recipes/lv_6_kr_left.json'

    // Legacy left/right button recipes remain only for hidden registry compatibility.
    // The Unity door button is the sole public recipe.
    exclude 'data/scp_classified_directive/recipes/button_left_swap.json'
    exclude 'data/scp_classified_directive/recipes/button_right_swap.json'

    from('config') {
        into 'config'
    }

    doLast {
        def parser = new groovy.json.JsonSlurper()
        def writeJson = { File target, Object data ->
            target.parentFile.mkdirs()
            target.setText(
                    groovy.json.JsonOutput.prettyPrint(
                            groovy.json.JsonOutput.toJson(data)) + System.lineSeparator(),
                    'UTF-8')
        }

        def scpConfigDir = file("$buildDir/resources/main/config/scp_classified_directive")
        if (scpConfigDir.exists()) {
            fileTree(scpConfigDir).matching {
                include '*.json'
            }.each { jsonFile ->
                def raw = jsonFile.getText('UTF-8')
                jsonFile.setText(groovy.json.JsonOutput.prettyPrint(raw) + System.lineSeparator(), 'UTF-8')
            }
        }

        def directiveAssets = file("$buildDir/resources/main/assets/scp_classified_directive")
        if (directiveAssets.exists()) {
            // The original Unity button has geometry only for one lateral
            // offset. Generate reflected geometry for the opposite half while
            // keeping the texture UVs readable rather than mirroring the text.
            ['button_locked', 'button_closed', 'button_opening',
             'button_open', 'button_closing'].each { buttonName ->
                File sourceCustom = new File(directiveAssets,
                        "models/custom/${buttonName}.json")
                File mirroredCustom = new File(directiveAssets,
                        "models/custom/${buttonName}_mirrored.json")

                if (sourceCustom.exists()) {
                    def model = parser.parse(sourceCustom)
                    model.elements?.each { element ->
                        if (element.from instanceof List && element.to instanceof List
                                && element.from.size() >= 3 && element.to.size() >= 3) {
                            def oldFromX = element.from[0] as BigDecimal
                            def oldToX = element.to[0] as BigDecimal
                            element.from[0] = 16.0G - oldToX
                            element.to[0] = 16.0G - oldFromX
                        }

                        if (element.rotation instanceof Map
                                && element.rotation.origin instanceof List
                                && element.rotation.origin.size() >= 3) {
                            element.rotation.origin[0] = 16.0G
                                    - (element.rotation.origin[0] as BigDecimal)
                            String axis = element.rotation.axis?.toString()
                            if ((axis == 'y' || axis == 'z')
                                    && element.rotation.angle != null) {
                                element.rotation.angle = -(element.rotation.angle as BigDecimal)
                            }
                        }

                        if (element.faces instanceof Map) {
                            def east = element.faces.get('east')
                            def west = element.faces.get('west')
                            if (west == null) element.faces.remove('east')
                            else element.faces.put('east', west)
                            if (east == null) element.faces.remove('west')
                            else element.faces.put('west', east)
                        }
                    }
                    writeJson(mirroredCustom, model)
                }

                File sourceBlockModel = new File(directiveAssets,
                        "models/block/${buttonName}.json")
                if (sourceBlockModel.exists()) {
                    def blockModel = parser.parse(sourceBlockModel)
                    String sourceParent = blockModel.parent?.toString()
                    if (sourceParent?.startsWith('scp_classified_directive:custom/')) {
                        blockModel.parent = "${sourceParent}_mirrored"
                    } else {
                        blockModel.parent = "scp_classified_directive:custom/${buttonName}_mirrored"
                    }
                    writeJson(new File(directiveAssets,
                            "models/block/${buttonName}_mirrored.json"), blockModel)
                }

                def blockState = [variants: [
                        'facing=north': [model: "scp_classified_directive:block/${buttonName}_mirrored"],
                        'facing=east' : [model: "scp_classified_directive:block/${buttonName}_mirrored", y: 90],
                        'facing=south': [model: "scp_classified_directive:block/${buttonName}_mirrored", y: 180],
                        'facing=west' : [model: "scp_classified_directive:block/${buttonName}_mirrored", y: 270]
                ]]
                writeJson(new File(directiveAssets,
                        "blockstates/${buttonName}_mirrored.json"), blockState)
            }
        }

        // Merge the isolated 3.0 translation patch into the locale Minecraft loads.
        def langDir = file("$buildDir/resources/main/assets/scp_classified_directive/lang")
        def baseLangFile = new File(langDir, 'en_us.json')
        def langPatchFile = file('src/main/resources/assets/scp_classified_directive/lang/en_us_3_0.json')
        if (baseLangFile.exists() && langPatchFile.exists()) {
            def baseLang = parser.parse(baseLangFile)
            def langPatch = parser.parse(langPatchFile)
            langPatch.each { key, value -> baseLang[key] = value }
            writeJson(baseLangFile, baseLang)
        }

        // teslagate.png contains the faulty inactive alpha atlas. The active
        // model uses the corrected teslagate2.png atlas, but also contains a
        // separate electrical "shock" element. Generate the inactive model
        // from that corrected base and remove only the electrical element.
        def modelDir = file("$buildDir/resources/main/assets/scp_classified_directive/models/custom")
        def activeTeslaModel = new File(modelDir, 'teslagateactive1.json')
        def inactiveTeslaModel = new File(modelDir, 'teslagateinactive.json')
        if (activeTeslaModel.exists()) {
            def model = parser.parse(activeTeslaModel)
            model.elements = model.elements.findAll { element -> element.name != 'shock' }
            writeJson(inactiveTeslaModel, model)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
