name: Finalize Music Default

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/disable-vanilla-music-module'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disable-vanilla-music-module
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/fix_music_default.py
          rm scripts/fix_music_default.py
          rm .github/workflows/finalize-music-default.yml
          chmod +x gradlew
          ./gradlew build --no-daemon
          git add -A
          git commit -m "Complete vanilla music module fallback [skip ci]"
          git push origin HEAD:feature/disable-vanilla-music-module
