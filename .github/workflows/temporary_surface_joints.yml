name: Validate shared Surface plane seams
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_surface_joints.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Miter compatible shared Surface endpoints
        run: |
          python3 .github/scripts/temporary_surface_joints.py
          python3 .github/scripts/temporary_surface_joint_flipped_edge.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit verified independent Surface seam joints
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Miter compatible adjoining curved Surface end edges'
          git pull --rebase origin master
          git push origin HEAD:master
