name: Build

on:
  push:
    branches:
      - master
      - integration/scp-additions-3.0
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - master
      - integration/scp-additions-3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply elevator smooth transport fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/elevator-smooth-transport-tooltips'
        run: |
          python .github/scripts/apply_elevator_smooth_transport_tooltips.py
          rm .github/scripts/apply_elevator_smooth_transport_tooltips.py

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Commit validated fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/elevator-smooth-transport-tooltips'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes left to commit."
          else
            git commit -m "Fix elevator access, smooth transport, and Core Room tooltips"
            git push origin HEAD:fix/elevator-smooth-transport-tooltips
          fi

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scp-additions-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
