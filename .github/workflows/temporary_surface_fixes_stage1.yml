name: Validate stage-one construction and SCP-079 fixes
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_surface_fixes_stage1.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply stage-one fixes
        run: python3 .github/scripts/temporary_surface_fixes_stage1.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and validate
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit verified changes
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/FacilityPipeModule.java src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java src/main/resources/assets/scp_classified_directive/textures/item/surface_construct.png src/main/resources/assets/scp_classified_directive/textures/item/offgrid_construct.png
          git commit -m 'Keep clearance badges at fixed size and stage construction tool textures'
          git pull --rebase origin master
          git push origin HEAD:master
