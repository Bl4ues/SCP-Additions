name: Apply Tesla Auxiliary Lockout

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths:
      - tools/hotfix/APPLY_TESLA_AUXILIARY_LOCKOUT
      - tools/hotfix/apply_tesla_auxiliary_lockout.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply Tesla terminal auxiliary lockout
        run: python3 tools/hotfix/apply_tesla_auxiliary_lockout.py
      - name: Validate build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace
      - name: Commit lockout implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Block Tesla terminal without auxiliary power" -m "Synchronize auxiliary-bus state through the Tesla terminal menu, render screens/12.png as a frontmost lockout overlay, suppress all terminal interaction while isolated, and clear authentication and pending operations when power changes."
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
