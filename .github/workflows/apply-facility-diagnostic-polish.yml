name: Apply Facility Diagnostic Polish

on:
  push:
    branches:
      - fix/facility-diagnostic-terminal-polish
    paths:
      - tools/hotfix/APPLY_FACILITY_DIAGNOSTIC_POLISH

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: fix/facility-diagnostic-terminal-polish
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply diagnostic terminal corrections
        run: python3 tools/hotfix/apply_facility_diagnostic_polish.py

      - name: Validate build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish facility diagnostic terminal" -m "Remove report timestamps, count individual uncontained roamers, report inactive Tesla override state, preserve an explicit auxiliary-offline terminal view, and add a server-authoritative remote-session cache reset that clears SCP-079 discovery, access, AP, and tactical history without shutting down auxiliary power."
          git push origin "HEAD:fix/facility-diagnostic-terminal-polish"
