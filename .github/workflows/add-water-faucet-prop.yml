name: Add Water Faucet Prop

on:
  push:
    branches:
      - feature/water-faucet-prop

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/water-faucet-prop
          fetch-depth: 0

      - name: Apply integration
        run: python scripts/add_water_faucet_prop.py

      - name: Commit integration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Non-potable Water Faucet facility prop [skip ci]"
          git push origin HEAD:feature/water-faucet-prop
