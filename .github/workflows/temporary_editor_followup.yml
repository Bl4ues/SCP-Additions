name: Validate off-grid and surface followup
on:
  push:
    paths:
      - .github/workflows/temporary_editor_followup.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply targeted construction changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/temporary_editor_followup.py')
          text = p.read_text()
          original = "if count != 1:\n        raise AssertionError"
          replacement = "if count != 1 and not (context == 'surface place sound' and count == 2):\n        raise AssertionError"
          assert text.count(original) == 1
          p.write_text(text.replace(original, replacement, 1))
          PY
          python3 .github/scripts/temporary_editor_followup.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build complete mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit independently validated changes
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore .github/scripts/temporary_editor_followup.py
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformDoorwayCollision.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientState.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformConstructionManager.java
          git commit -m 'Refresh diagonal door collision correctly and play off-grid block sounds'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Keep surface edit gizmos in world space and invalidate only changed meshes'
          git add src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java
          git commit -m 'Center SCP-079 keycard clearance glyph slightly lower'
          git pull --rebase origin master
          git push origin HEAD:master
