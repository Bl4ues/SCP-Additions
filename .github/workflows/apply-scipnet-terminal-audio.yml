name: Apply SCiPNET terminal audio

on:
  push:
    branches:
      - fix/scipnet-terminal-audio
    paths:
      - .github/workflows/apply-scipnet-terminal-audio.yml
      - tools/hotfix/apply_scipnet_terminal_audio.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: fix/scipnet-terminal-audio
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply terminal and generator audio
        run: python3 tools/hotfix/apply_scipnet_terminal_audio.py

      - name: Remove temporary integration files
        run: rm .github/workflows/apply-scipnet-terminal-audio.yml tools/hotfix/apply_scipnet_terminal_audio.py

      - name: Validate build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Commit validated implementation
        run: |
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git commit -m "Add SCiPNET and auxiliary generator audio"
          git push origin HEAD:fix/scipnet-terminal-audio
