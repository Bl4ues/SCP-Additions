name: Apply non-lethal achievement adjustments

on:
  push:
    paths:
      - '.github/workflows/_apply_nonlethal_achievements.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply achievement changes
        run: python3 .github/_temp_nonlethal_achievements.py

      - name: Build modified source
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Commit to master
        shell: bash
        run: |
          rm -f .github/_temp_nonlethal_achievements.py
          rm -f .github/workflows/_apply_nonlethal_achievements.yml
          git config user.name 'Deyvid Campos'
          git config user.email 'deyvid04campos@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Make lethal achievements Hardcore-friendly'
          git push origin HEAD:master
