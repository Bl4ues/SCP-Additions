name: Refine Core Room Elevator

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip elevator refinement]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply elevator runtime refinements
        run: python .github/scripts/refine_core_room_elevator.py

      - name: Normalize generated imports
        run: |
          file=src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorModule.java
          if ! grep -q 'import net.minecraft.util.Mth;' "$file"; then
            sed -i '/import net.minecraft.util.StringRepresentable;/a import net.minecraft.util.Mth;' "$file"
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Remove temporary elevator tooling
        if: ${{ github.event_name == 'push' }}
        run: |
          rm -f .github/scripts/complete_core_room_elevator.py
          rm -f .github/scripts/run_complete_core_room_elevator.py
          rm -f .github/scripts/refine_core_room_elevator.py
          rm -f .github/scripts/elevator_payload_suffix_*.txt
          rm -f .github/elevator-*.txt
          rm -f .github/workflows/complete-core-room-elevator.yml

      - name: Commit validated implementation
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Core Room elevator implementation [skip elevator refinement]"
            git push
          fi
