name: Apply and Build SCP-330 Rebuild

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-build-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply SCP-330 rebuild
        run: |
          cat .github/scp330_payload.part00 \
              .github/scp330_payload.part01 \
              .github/scp330_payload.part02 > /tmp/apply_scp330.py
          python -m py_compile /tmp/apply_scp330.py
          python /tmp/apply_scp330.py

      - name: Verify SCP-330 contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          required = [
              'src/main/java/net/mcreator/scpadditions/block/entity/Scp330BlockEntity.java',
              'src/main/java/net/mcreator/scpadditions/client/Scp330Client.java',
              'src/main/java/net/mcreator/scpadditions/effect/Scp330HandLossEffect.java',
              'src/main/java/net/mcreator/scpadditions/item/Scp330CandyItem.java',
              'src/main/java/net/mcreator/scpadditions/scp330/Scp330Hands.java',
              'src/main/java/net/mcreator/scpadditions/scp330/Scp330HandsEvents.java',
              'src/main/resources/assets/scp_additions/geo/block/scp330.geo.json',
              'src/main/resources/assets/scp_additions/animations/block/scp330.animation.json',
              'src/main/resources/assets/scp_additions/models/item/scp_330_blue_candy.json',
              'src/main/resources/assets/scp_additions/models/item/scp_330_pink_candy.json',
              'src/main/resources/assets/scp_additions/models/item/scp_330_yellow_candy.json',
          ]
          for path in required:
              assert (root / path).is_file(), path

          obsolete = [
              'src/main/java/net/mcreator/scpadditions/item/Scp330RedCandyItem.java',
              'src/main/java/net/mcreator/scpadditions/item/Scp330GreenCandyItem.java',
              'src/main/java/net/mcreator/scpadditions/item/Scp330BlueCandyItem.java',
              'src/main/java/net/mcreator/scpadditions/item/Scp330YellowCandyItem.java',
              'src/main/java/net/mcreator/scpadditions/procedures/RedCandyProcedure.java',
              'src/main/java/net/mcreator/scpadditions/procedures/GreenCandyProcedure.java',
              'src/main/java/net/mcreator/scpadditions/procedures/BlueCandyProcedure.java',
              'src/main/java/net/mcreator/scpadditions/procedures/YellowCandyProcedure.java',
              'src/main/java/net/mcreator/scpadditions/procedures/Scp330CandyGiveProcedure.java',
              'src/main/java/net/mcreator/scpadditions/procedures/Scp330CandyClearProcedure.java',
              'src/main/resources/assets/scp_additions/models/custom/scp330.json',
          ]
          for path in obsolete:
              assert not (root / path).exists(), path

          geometry = json.loads((root / 'src/main/resources/assets/scp_additions/geo/block/scp330.geo.json').read_text(encoding='utf-8'))
          definition = geometry['minecraft:geometry'][0]
          assert definition['description']['identifier'] == 'geometry.scp330'
          assert definition['bones'][0]['name'] == 'scp330'

          combined = '\n'.join(
              path.read_text(encoding='utf-8', errors='ignore')
              for base in ('src/main/java', 'src/main/resources')
              for path in (root / base).rglob('*')
              if path.is_file() and path.suffix in {'.java', '.json', '.mcmeta'}
          )
          assert 'scp_330_red_candy' not in combined
          assert 'scp_330_green_candy' not in combined
          assert 'Scp330Hands.isDisabled(player)' in (root / 'src/main/java/com/bl4ues/scpinventory/client/ContextPromptClient.java').read_text(encoding='utf-8')
          assert 'Scp330Hands.isDisabled(player)' in (root / 'src/main/java/com/bl4ues/scpinventory/network/ContextInteractPacket.java').read_text(encoding='utf-8')
          assert '## SCP-330' in (root / 'CHANGELOG.md').read_text(encoding='utf-8')
          PY

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Remove non-workflow temporary tooling
        run: |
          rm -f .github/scp330_payload.part00
          rm -f .github/scp330_payload.part01
          rm -f .github/scp330_payload.part02
          rm -f .github/scripts/apply_elevator_scp330_final.py
          rm -f .github/elevator-scp330-final-trigger.txt
          rm -f .github/elevator-final-status.txt
          rm -f .github/assistant_probe.tmp
          rm -f .github/archive-download.md
          rm -f .github/source-snapshot-request.md

      - name: Commit validated rebuild to pull request branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild SCP-330 with three candies and persistent hand loss'
          git push origin HEAD:${{ github.head_ref }}
