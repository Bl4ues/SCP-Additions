name: Apply custom item interaction sounds

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  implement:
    if: contains(github.event.head_commit.message, '[item-sounds]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply implementation
        run: |
          python3 scripts/_apply_custom_item_sounds.py
          git diff --check

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Commit implementation
        run: |
          rm -f scripts/_apply_custom_item_sounds.py
          rm -f .github/workflows/apply-custom-item-sounds.yml
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Add custom SCP Inventory interaction sounds"
          git push origin HEAD:master
