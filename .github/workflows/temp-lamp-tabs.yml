name: Validate Lamp Audio and Facility Tabs

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply lamp and tab changes
        run: python3 scripts/apply_lamp_audio_and_tabs.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Commit validated source
        shell: bash
        run: |
          git config user.name "Bl4ues"
          git config user.email "28213049+Bl4ues@users.noreply.github.com"
          git add CHANGELOG.md \
            src/main/java/net/mcreator/scpadditions/client/CeilingLampAudioClient.java \
            src/main/java/net/mcreator/scpadditions/client/CeilingLampLoopSound.java \
            src/main/java/net/mcreator/scpadditions/client/CreativeTabPresentation.java \
            src/main/java/net/mcreator/scpadditions/facility/FacilityModule.java \
            src/main/java/net/mcreator/scpadditions/facility/UBlocksModule.java \
            src/main/resources/assets/scp_additions/sounds.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Stabilize SL1 lamp audio and complete facility tabs"
          git push origin HEAD:agent/lamp-audio-and-complete-facility-tabs
