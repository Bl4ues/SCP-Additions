name: Run elevator repair v3

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/elevator-collision-prompts-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/elevator-collision-prompts-v3
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extract and execute prepared repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-elevator-fix-v3.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines)
                       if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines))
                     if lines[i].strip() == 'PY')
          body = lines[start:end]
          indent = min(len(line) - len(line.lstrip())
                       for line in body if line.strip())
          script = '\n'.join(
              line[indent:] if line.startswith(' ' * indent) else line
              for line in body) + '\n'
          Path('/tmp/apply_elevator_fix_v3.py').write_text(script,
                                                           encoding='utf-8')
          PY
          python /tmp/apply_elevator_fix_v3.py

      - name: Remove temporary branch files
        run: |
          rm -f tools/hotfix/APPLY_ELEVATOR_FIX_V3
          rm -f .github/workflows/apply-elevator-fix-v3.yml

      - name: Build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix elevator collision, prompts, rendering, and SCP-330 scale"
          git push origin HEAD:fix/elevator-collision-prompts-v3
