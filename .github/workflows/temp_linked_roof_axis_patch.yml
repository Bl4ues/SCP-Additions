name: Validate linked roof zipper correction
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply linked roof mesh correction
        run: python3 .github/scripts/temp_linked_roof_axis_patch.py
      - name: Verify project integrity
        run: python3 .github/scripts/verify_project_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build project
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Commit validated correction to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Honor both baked face axis orders and independently stitch linked roof boundaries'
          git pull --rebase origin master
          git push origin HEAD:master
