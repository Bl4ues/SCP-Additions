name: Validate map badge and Alarm tooltip corrections
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_map_alarm_polish.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply map and tooltip corrections
        run: python3 .github/scripts/temporary_map_alarm_polish.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit patch to master
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java src/main/java/com/bl4ues/scpclassifieddirective/facility/alarm/AlarmModule.java
          git commit -m 'Scale clearance indicators with map and simplify Alarm tooltip'
          git pull --rebase origin master
          git push origin HEAD:master
