name: Asset Audit

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/scp106-ranged-emergence-final'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/scp106-ranged-emergence-final
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply SCP-106 refinements
        run: python3 scripts/apply_scp106_ranged_refinement.py

      - name: Capture build diagnostics
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew clean build --stacktrace > scp106-refinement-build.log 2>&1
          status=$?
          echo "$status" > scp106-refinement-build.status
          tail -n 300 scp106-refinement-build.log
          exit 0

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: scp106-refinement-build-diagnostics
          path: |
            scp106-refinement-build.log
            scp106-refinement-build.status
          if-no-files-found: error

      - name: Restore standard workflow and commit implementation
        shell: bash
        run: |
          if [ "$(cat scp106-refinement-build.status)" != "0" ]; then
            exit 0
          fi
          rm -f scp106-refinement-build.log scp106-refinement-build.status
          git checkout origin/master -- .github/workflows/asset-audit.yml
          rm -f scripts/apply_scp106_ranged_refinement.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine SCP-106 ranged attack and emergence"
          git push origin HEAD:fix/scp106-ranged-emergence-final

      - name: Upload compiled JAR
        if: success() && hashFiles('build/libs/*.jar') != ''
        uses: actions/upload-artifact@v4
        with:
          name: scp106-ranged-refinement-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
