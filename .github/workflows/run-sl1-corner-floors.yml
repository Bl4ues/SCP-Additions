name: Run SL1 corner floor integration

on:
  push:
    branches: [master]
    paths:
      - tools/hotfix/RUN_SL1_CORNER_FLOORS

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Execute integration payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-sl1-corner-floors.yml').read_text(encoding='utf-8')
          payload = source.split("          python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(payload), '<sl1-corner-floors>', 'exec'))
          PY

      - name: Build and commit integration
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace > tools/sl1-corner-floors-build.log 2>&1
          code=$?
          cat tools/sl1-corner-floors-build.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$code" -eq 0 ]; then
            rm -f tools/sl1-corner-floors-build.log
            rm -f tools/hotfix/RUN_SL1_CORNER_FLOORS
            rm -f .github/workflows/apply-sl1-corner-floors.yml
            rm -f .github/workflows/run-sl1-corner-floors.yml
            git add -A
            git commit -m "Add SL1 corner floor transitions" -m "Register the Metal Alternative Bottom Wall, Resting Corner Floor, and Kitchen Corner Floor; reuse the existing fixed-orientation transition system with the requested Metal and Blue relationships; add complete models, blockstates, tooltips, creative ordering, and changelog documentation."
          else
            git add -f tools/sl1-corner-floors-build.log
            git commit -m "Record SL1 corner floor build failure"
          fi

          git push origin HEAD:master
          exit "$code"
