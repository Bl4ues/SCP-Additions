name: Classified Directive Rebrand

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/rebrand_classified_directive.py'
      - 'scripts/rebrand_classified_directive_hotfix.py'
      - 'scripts/rebrand_classified_directive_compat.py'
      - 'scripts/rebrand_transition_label.py'
      - '.github/workflows/rebrand-classified-directive.yml'

permissions:
  contents: write

concurrency:
  group: classified-directive-rebrand
  cancel-in-progress: true

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Migrate, validate and land on master
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Migration landing attempt ${attempt}/3"
            git fetch origin master
            git reset --hard origin/master
            rm -f .github/rebrand-failure.txt

            python3 scripts/rebrand_classified_directive_hotfix.py
            python3 scripts/rebrand_classified_directive.py
            python3 scripts/rebrand_classified_directive_compat.py
            python3 scripts/rebrand_transition_label.py

            chmod +x gradlew
            ./gradlew clean build --stacktrace

            git add -A
            git commit -m "Rebrand as SCP: Classified Directive"

            if git push origin HEAD:master; then
              echo "SCP: Classified Directive migration landed on master"
              exit 0
            fi

            echo "Master moved during validation; rebuilding migration from the new head"
          done

          echo "Unable to land validated migration after three attempts"
          exit 1

      - name: Record failed run
        if: failure()
        run: |
          set -euo pipefail
          git rebase --abort 2>/dev/null || true
          git fetch origin master
          git reset --hard origin/master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'run_id=%s\nrun_url=%s/actions/runs/%s\n' "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > .github/rebrand-failure.txt
          git add .github/rebrand-failure.txt
          git commit -m "Record failed Classified Directive migration [skip ci]" || true
          git push origin HEAD:master || true
