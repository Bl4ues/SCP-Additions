name: Validate surface GPU cache budget
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 .github/scripts/temp_surface_gpu_budget.py
      - run: |
          python3 .github/scripts/verify_project_integrity.py
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Bound curved surface GPU cache warmup and visible residency'
          git pull --rebase origin master
          git push origin HEAD:master
      - run: |
          git rm .github/scripts/temp_surface_gpu_budget.py .github/workflows/temp_surface_gpu_budget.yml
          git commit -m 'Remove temporary GPU cache budget validation files'
          git pull --rebase origin master
          git push origin HEAD:master
