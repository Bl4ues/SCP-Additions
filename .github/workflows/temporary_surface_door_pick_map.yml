name: Validate map clearance and transformed pick-block
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_surface_door_pick_map.yml']
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch and build consistent keycard clearance markers
        run: |
          python3 .github/scripts/temporary_surface_door_pick_map.py map
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit map clearance fix
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java
          git commit -m 'Keep SCP-079 clearance glyph and badge together in map space'
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Patch and build middle-click pick-block for transformed geometry
        run: |
          python3 .github/scripts/temporary_surface_door_pick_map.py pick
          ./gradlew build --no-daemon
      - name: Commit pick-block fix
        run: |
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformPickBlockClient.java
          git commit -m 'Pick transformed blocks on physical middle click even on vanilla misses'
          git pull --rebase origin master
          git push origin HEAD:master
