name: Apply advancement browser and encounter achievements

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/_apply-advancement-browser-encounters.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply requested changes
        run: python3 .github/_temp_apply_advancement_browser.py

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build modified source
        run: ./gradlew clean build --stacktrace

      - name: Commit to master
        run: |
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Expand achievements and polish custom UI"
          git push origin HEAD:master
