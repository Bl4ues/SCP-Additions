name: Build

on:
  push:
    branches:
      - master
      - integration/scp-additions-3.0
      - 'feature/**'
  pull_request:
    branches:
      - master
      - integration/scp-additions-3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply arrival display visual refinement
        id: apply
        if: github.ref_name == 'feature/refine-arrival-display-visuals' && hashFiles('tools/hotfix/apply_arrival_visual_refinement.py') != ''
        run: |
          python tools/hotfix/apply_arrival_visual_refinement.py
          rm tools/hotfix/apply_arrival_visual_refinement.py
          git show origin/master:.github/workflows/build.yml > .github/workflows/build.yml
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Commit validated visual refinement
        if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine elevator arrival display proportions and masking"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scp-additions-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
