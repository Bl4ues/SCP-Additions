name: Apply SCP-914 Physical Fixes

on:
  push:
    paths:
      - '.github/workflows/scp914-fix-physical.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply SCP-914 fixes
        run: python .github/scripts/scp914_fix_physical.py
      - name: Build project
        run: ./gradlew build --no-daemon
      - name: Commit fixes and remove temporary tooling
        run: |
          rm -f .github/scripts/scp914_fix_physical.py
          rm -f .github/workflows/scp914-fix-physical.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix SCP-914 physical integration"
          git push origin HEAD:master
