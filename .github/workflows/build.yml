name: Build

on:
  push:
    branches:
      - master
      - integration/scp-additions-3.0
      - 'feature/**'
  pull_request:
    branches:
      - master
      - integration/scp-additions-3.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/scp106-ranged-audio-debug-order
          fetch-depth: 0

      - name: Capture raw patch failure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          raw = Path('.github/workflows/apply-scp106-ranged-test-fixes.yml').read_text()
          start_marker = '        run: |\n'
          start = raw.index(start_marker, raw.index('      - name: Apply fixes')) + len(start_marker)
          end = raw.index('\n      - name: Build', start)
          lines = []
          for line in raw[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-scp106-ranged.sh').write_text('set -e\n' + '\n'.join(lines) + '\n')
          PY
          set +e
          bash -e /tmp/apply-scp106-ranged.sh > scp106-ranged-raw.log 2>&1
          status=$?
          echo "$status" > scp106-ranged-raw.status
          cat scp106-ranged-raw.log
          exit 0

      - name: Upload raw patch failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scp106-ranged-raw-diagnostics
          path: |
            scp106-ranged-raw.log
            scp106-ranged-raw.status
          if-no-files-found: error
