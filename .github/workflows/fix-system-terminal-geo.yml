name: Fix System Terminal Geometry

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-system-terminal-geo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fix GeckoLib geometry version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/resources/assets/scp_additions/geo/block/system_terminal.geo.json')
          text = path.read_text(encoding='utf-8')
          old = '"format_version": "1.21.110"'
          new = '"format_version": "1.12.0"'
          if old not in text:
              raise SystemExit(f'Expected geometry version not found in {path}')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one geometry version occurrence in {path}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/fix-system-terminal-geo.yml

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/scp_additions/geo/block/system_terminal.geo.json .github/workflows/fix-system-terminal-geo.yml
          git commit -m "Fix system terminal GeckoLib geometry version"
          git push origin HEAD:master
