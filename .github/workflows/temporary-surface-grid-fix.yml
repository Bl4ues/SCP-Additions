name: Apply SCP-079 map credential correction

on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary-surface-grid-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Align SCP-079 keycard markers with door segments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java')
          text = p.read_text(encoding='utf-8')
          substitutions = [
              ('''                    renderClosedKeycardBadge(graphics, marker, transform,
                                      locked);'''.replace('                                      ', '                            '),
               '''                    renderClosedKeycardBadge(graphics, marker, transform,
                                      locked, color);'''.replace('                                      ', '                            ')),
              ('''            MapDoorMarker marker, MapTransform transform, boolean locked) {''',
               '''            MapDoorMarker marker, MapTransform transform,
                      boolean locked, int color) {'''.replace('                      ', '            ')),
              ('''        int half = 7;
                  int badge = locked ? 0xFF77868B : 0xFFF1FAFD;'''.replace('                  ', '        '),
               '''        int half = 8;
                  int badge = color;'''.replace('                  ', '        ')),
              ('''        drawFixedCenteredMapLabel(graphics, value, x, y,
                  locked ? 0xFF172126 : 0xFF071116);'''.replace('                  ', '                '),
               '''        drawCenteredMapLabel(graphics, value, x, y, 1.30F,
                  locked ? 0xFF172126 : 0xFF071116);'''.replace('                  ', '                ')),
              ('''        drawFixedCenteredMapLabel(graphics,
                  Integer.toString(marker.requiredLevel()),
                  x, y, 0xFFF1FAFD);'''.replace('                  ', '                '),
               '''        drawCenteredMapLabel(graphics,
                  Integer.toString(marker.requiredLevel()),
                  x, y, 1.30F, 0xFFFFFFFF);'''.replace('                  ', '                ')),
          ]
          for old, new in substitutions:
              if text.count(old) != 1:
                  raise RuntimeError('Expected one exact map fragment, got %d: %r' % (text.count(old), old[:80]))
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java
          git commit -m 'Align SCP-079 keycard labels and door marker colors'
          git push origin HEAD:master
