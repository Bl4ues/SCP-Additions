name: Validate curved Alarm projection receivers
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_alarm_projection_surface.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix curved receiver tessellation
        run: python3 .github/scripts/temporary_alarm_projection_surface.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit validated projection fix
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformAlarmPhysicalProjection.java
          git commit -m 'Align transformed Alarm projection mesh with curved receiver surfaces'
          git pull --rebase origin master
          git push origin HEAD:master
