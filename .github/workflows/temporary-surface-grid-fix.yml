name: Apply Surface render-guide consistency correction

on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary-surface-grid-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Match Surface hover to nearest placement target and avoid per-frame payload scans
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java')
          t = path.read_text(encoding='utf-8')
          start = t.index('    private static TransformSurfaceRaycast.Target aimedSurfaceTarget(')
          end = t.index('    private static void renderLogicalSurfaceSlot(', start)
          method = '''    private static TransformSurfaceRaycast.Target aimedSurfaceTarget(
                  LocalPlayer player) {
              if (player == null) return null;
              Minecraft minecraft = Minecraft.getInstance();
              if (minecraft.level == null) return null;
              // Selected editor surfaces do not override the closest logical hit.
              return TransformSurfaceRaycast.target(player,
                      TransformConstructionClientState.surfaces(
                              minecraft.level.dimension().location()));
          }

          '''
          t = t[:start] + method + t[end:]
          start = t.index('        boolean positivePayload = surface.overlays().keySet().stream()')
          end = t.index('        for (int column = 0; column <= columns; column++)', start)
          t = t[:start] + t[end:]
          old = 'camera, positivePayload, negativePayload)'
          if t.count(old) != 4: raise RuntimeError('Unexpected Surface guide calls: %d' % t.count(old))
          t = t.replace(old, 'camera)')
          old = '''            ConstructionSurface surface, double u, double v, Vec3 camera,
                      boolean positivePayload, boolean negativePayload) {'''
          if t.count(old) != 1: raise RuntimeError('Unexpected Surface guide signature: %d' % t.count(old))
          t = t.replace(old, '            ConstructionSurface surface, double u, double v, Vec3 camera) {', 1)
          old = '''        } else if (cached.surface() != surface
              && !TransformConstructionClientControls.previewingSurface(
                      surface.id())) {'''
          new = '''        } else if (cached.surface() != surface
                  && !TransformConstructionClientControls.previewingSurface(
                          surface.id())) {'''
          if t.count(old) != 1: raise RuntimeError('Unexpected deferred rebake guard: %d' % t.count(old))
          t = t.replace(old, new, 1)
          path.write_text(t, encoding='utf-8')
          path = Path('src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientControls.java')
          t = path.read_text(encoding='utf-8')
          start = t.index('    /** Live handle movement only changes the authoring preview; collision,')
          end = t.index('    @SubscribeEvent(priority = EventPriority.HIGHEST)', start)
          clean = '''    /** Live handle movement only changes the authoring preview; collision,
              * lighting and expensive payload meshes are finalized on release. */
             static boolean previewingSurface(UUID id) {
                 return id != null && drag != null && drag.remembered()
                         && drag.selection().type() == SelectionType.SURFACE
                         && id.equals(drag.selection().id());
             }

          '''
          t = t[:start] + clean + t[end:]
          path.write_text(t, encoding='utf-8')
          PY
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientControls.java
          git commit -m 'Unify Surface hovered target and skip redundant grid payload scans'
          git push origin HEAD:master
