name: Apply SCiPNET CRT Cache Lockout

on:
  push:
    branches:
      - fix/scipnet-crt-cache-lockout
    paths:
      - tools/hotfix/APPLY_SCIPNET_CRT_CACHE_LOCKOUT

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: fix/scipnet-crt-cache-lockout
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply SCiPNET corrections
        run: python3 tools/hotfix/apply_scipnet_crt_cache_lockout.py

      - name: Remove temporary integration files
        run: |
          rm -f .github/workflows/apply-scipnet-crt-cache-lockout.yml
          rm -f tools/hotfix/apply_scipnet_crt_cache_lockout.py
          rm -f tools/hotfix/APPLY_SCIPNET_CRT_CACHE_LOCKOUT

      - name: Validate build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Commit validated implementation
        run: |
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git commit -m "Polish SCiPNET CRT and cache purge" || exit 0
          git push origin HEAD:fix/scipnet-crt-cache-lockout
