name: Validate dynamic wall pipe connections
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_pipe_connection.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch transformed construction and pipe blockstates
        run: python3 .github/scripts/temporary_pipe_connection.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build pipe variants
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit transformed pipe integration
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformConstructionManager.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformPickBlockClient.java src/main/resources/assets/scp_classified_directive/blockstates/wall_pipe_*.json
          git commit -m 'Connect mixed pipe finishes across vanilla and transformed wall layers'
          git pull --rebase origin master
          git push origin HEAD:master
