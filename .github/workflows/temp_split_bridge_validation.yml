name: Validate linked roof parent-grid alignment

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply independently sampled mother grids
        run: python3 .github/scripts/temp_split_bridge_profiles.py
      - name: Apply parent-aligned roof tessellation
        run: python3 .github/scripts/temp_split_bridge_mesh.py
      - name: Verify project integrity
        run: python3 .github/scripts/verify_project_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and build complete mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Publish validated changes in coherent commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/ConstructionSurface.java
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformSurfaceBridge.java
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformConstructionSavedData.java
          git commit -m 'Sample linked roof boundaries on independent parent grids' || exit 1
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Align linked roof mesh cuts to both parents and crown' || exit 1
          git add src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java
          git commit -m 'Slightly increase SCP-079 door bar width without changing length' || exit 1
          git push origin HEAD:master
