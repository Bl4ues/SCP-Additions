name: Apply Blue Kitchen floor pairing fix

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths:
      - tools/hotfix/RUN_BLUE_KITCHEN_FIX
      - tools/hotfix/apply_blue_kitchen_fix.py

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check integration marker
        id: marker
        shell: bash
        run: |
          if [ -f tools/hotfix/RUN_BLUE_KITCHEN_FIX ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        if: steps.marker.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply corrected transition ownership
        if: steps.marker.outputs.run == 'true'
        run: python3 tools/hotfix/apply_blue_kitchen_fix.py

      - name: Validate implementation
        if: steps.marker.outputs.run == 'true'
        run: ./gradlew clean verifyMoreMcmetaDevRuntime build --no-daemon --stacktrace

      - name: Commit corrected implementation
        if: steps.marker.outputs.run == 'true'
        shell: bash
        run: |
          rm -f tools/hotfix/RUN_BLUE_KITCHEN_FIX
          rm -f tools/hotfix/apply_blue_kitchen_fix.py
          rm -f .github/workflows/apply-blue-kitchen-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Blue and Kitchen floor transition ownership"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
