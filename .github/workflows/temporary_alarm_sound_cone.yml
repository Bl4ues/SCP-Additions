name: Validate transformed Alarm cone and positional audio
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_alarm_sound_cone.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate full cone wash and physical siren
        run: python3 .github/scripts/temporary_alarm_sound_cone.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build transformed Alarm
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit Alarm improvements
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformAlarmClientRenderer.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformAlarmPhysicalProjection.java
          git commit -m 'Render full transformed Alarm cone and play its loop at logical source'
          git pull --rebase origin master
          git push origin HEAD:master
