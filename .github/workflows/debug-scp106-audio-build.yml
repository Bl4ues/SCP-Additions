name: Diagnose SCP-106 Audio Build

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/scp106-audio-and-hunt-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scp106-audio-and-hunt-polish
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply prepared implementation
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/apply-scp106-audio.yml').read_text())
          steps = workflow['jobs']['apply']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Apply implementation')
          Path('/tmp/apply-scp106-audio.sh').write_text(script)
          PY
          bash /tmp/apply-scp106-audio.sh
      - name: Capture build
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --stacktrace > scp106-audio-build.log 2>&1
          status=$?
          echo "$status" > scp106-audio-build.status
          tail -n 250 scp106-audio-build.log
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: scp106-audio-build-diagnostics
          path: |
            scp106-audio-build.log
            scp106-audio-build.status
      - name: Commit when successful
        shell: bash
        run: |
          if [ "$(cat scp106-audio-build.status)" != "0" ]; then
            exit 0
          fi
          rm -f scp106-audio-build.log scp106-audio-build.status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add SCP-106 audio and world entry cue"
          git push origin HEAD:feature/scp106-audio-and-hunt-polish
