name: Run Corrected SCP-106 Audio Implementation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/scp106-audio-and-hunt-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scp106-audio-and-hunt-polish
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply corrected implementation
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/apply-scp106-audio.yml').read_text())
          steps = workflow['jobs']['apply']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Apply implementation')
          old = "              path = Path('src/main/resources/assets/scp_additions/lang') / lang\n              data = json.loads(path.read_text(encoding='utf-8'))"
          new = "              path = Path('src/main/resources/assets/scp_additions/lang') / lang\n              if not path.exists():\n                  continue\n              data = json.loads(path.read_text(encoding='utf-8'))"
          if old not in script:
              raise SystemExit('Could not patch optional language handling')
          script = 'set -e\n' + script.replace(old, new, 1)
          Path('/tmp/apply-scp106-audio.sh').write_text(script)
          PY
          bash -e /tmp/apply-scp106-audio.sh
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add SCP-106 audio and world entry cue"
          git push origin HEAD:feature/scp106-audio-and-hunt-polish
