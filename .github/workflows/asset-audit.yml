name: Apply Facility Creative Tab Reorganization

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply reorganization
        run: python3 scripts/apply_facility_tab_reorganization.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Restore workflow and commit final source
        shell: bash
        run: |
          cat > .github/workflows/asset-audit.yml <<'EOF'
          name: Asset Audit

          on:
            pull_request:
              branches:
                - master
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            audit:
              runs-on: ubuntu-latest

              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}

                - name: Set up Java 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Set up Gradle
                  uses: gradle/actions/setup-gradle@v4

                - name: Make Gradle wrapper executable
                  run: chmod +x gradlew

                - name: Build
                  run: ./gradlew clean build --stacktrace

                - name: Audit repository and compiled JAR
                  run: |
                    python3 scripts/audit_unused_assets.py
                    git rev-parse HEAD > build/reports/asset-audit/head-sha.txt
                    git rev-parse 'HEAD^{tree}' > build/reports/asset-audit/tree-sha.txt
                    git archive --format=zip --output=build/reports/asset-audit/source-snapshot.zip HEAD
                    cp build/libs/*.jar build/reports/asset-audit/

                - name: Upload audit report
                  uses: actions/upload-artifact@v4
                  with:
                    name: asset-audit-${{ github.sha }}
                    path: build/reports/asset-audit
                    if-no-files-found: error
          EOF
          rm scripts/apply_facility_tab_reorganization.py
          git config user.name "Bl4ues"
          git config user.email "28213049+Bl4ues@users.noreply.github.com"
          git add -A
          git commit -m "Promote 3.1.0 and organize facility creative tabs"
          git push origin HEAD:agent/3.1-facility-tabs
