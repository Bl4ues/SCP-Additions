name: Align curved controls and transformed pipes
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_transform_alignment.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align model/raycast and placement frames
        run: python3 .github/scripts/temporary_transform_alignment.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build before committing
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit aligned fixtures
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformSurfaceRaycast.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformPlacementStateRuntime.java
          git commit -m 'Use one rigid geometry for curved controls and correct transformed pipe facing'
          git pull --rebase origin master
          git push origin HEAD:master
