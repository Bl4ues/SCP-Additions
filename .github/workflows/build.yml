name: Build

on:
  push:
    branches:
      - master
      - integration/scp-additions-3.0
      - 'feature/**'
  pull_request:
    branches:
      - master
      - integration/scp-additions-3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply contextual off-screen prompt feature
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/context-offscreen-prompts'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_context_offscreen_prompts.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              return text.replace(old, new, 1)
          '''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if label == "save packet entity dispatch" and count == 2:
                  return text.replace(old, new)
              if label == "save packet block dispatch" and count == 0:
                  return text
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              return text.replace(old, new, 1)
          '''
          if old not in text:
              raise SystemExit('Could not patch replace_once helper')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/scripts/apply_context_offscreen_prompts.py
          rm .github/scripts/apply_context_offscreen_prompts.py
          rm -f tools/hotfix/TRIGGER_CONTEXT_OFFSCREEN
          git show origin/master:.github/workflows/build.yml > .github/workflows/build.yml

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Commit validated contextual prompt feature
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/context-offscreen-prompts'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add configurable off-screen context prompts"
            git push origin HEAD:feature/context-offscreen-prompts
          fi

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scp-additions-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
