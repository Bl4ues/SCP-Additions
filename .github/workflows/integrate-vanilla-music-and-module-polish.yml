name: Integrate Vanilla Music And Module Polish

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feature/vanilla-music-and-module-polish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/vanilla-music-and-module-polish
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply feature patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_vanilla_music_and_module_polish.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("'''\\\"audio", "r'''\\\"audio")
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/apply_vanilla_music_and_module_polish.py
          rm scripts/apply_vanilla_music_and_module_polish.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Commit final branch state
        run: |
          git add -A
          git commit -m "Add vanilla music control and module polish [skip ci]"
          git push origin HEAD:feature/vanilla-music-and-module-polish
