name: Refine Core Room Elevator

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip elevator refinement]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply elevator runtime refinements
        run: python .github/scripts/refine_core_room_elevator.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Commit validated refinements
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Refine Core Room elevator runtime behavior [skip elevator refinement]"
            git push
          fi
