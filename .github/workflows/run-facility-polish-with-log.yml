name: Run facility polish with build log
on:
  push:
    branches: [master]
    paths: [tools/hotfix/RUN_FACILITY_POLISH_LOGGED]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Execute implementation payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/apply-facility-elevator-polish.yml').read_text()
          payload = source.split("          python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(payload), '<facility-polish>', 'exec'))
          PY
      - name: Build and preserve result
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace > tools/facility-polish-build.log 2>&1
          code=$?
          cat tools/facility-polish-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$code" -eq 0 ]; then
            rm -f tools/facility-polish-build.log
            git add src/main/java src/main/resources
            git commit -m "Polish facility blocks and Core Room elevator interactions"
          else
            git add -f tools/facility-polish-build.log
            git commit -m "Record facility polish build failure"
          fi
          git push origin HEAD:master
          exit "$code"
