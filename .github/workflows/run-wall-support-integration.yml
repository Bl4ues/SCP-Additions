name: Run Wall Support Integration

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'fix/wall-mounted-support-and-sign-font'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/wall-mounted-support-and-sign-font
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply deterministic integration
        run: |
          python3 scripts/finalize_wall_mounted_support.py
          rm scripts/finalize_wall_mounted_support.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Commit final branch state
        run: |
          git add -A
          git commit -m "Fix wall-mounted support and SCP sign font [skip ci]"
          git push origin HEAD:fix/wall-mounted-support-and-sign-font
