name: Facility chat implementation repair

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  implement:
    if: contains(github.event.head_commit.message, '[facility-chat-repair]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Recover and apply implementation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/add-facility-chat.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "cat > /tmp/add_facility_chat.py <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          lines = []
          in_triple = False
          for raw in source[start:end]:
              line = raw if in_triple else (raw[10:] if raw.startswith('          ') else raw)
              lines.append(line)
              if line.count("'''") % 2 == 1:
                  in_triple = not in_triple
          Path('/tmp/add_facility_chat.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 -m py_compile /tmp/add_facility_chat.py
          python3 /tmp/add_facility_chat.py
          rm -f .github/workflows/add-facility-chat.yml
          rm -f .github/workflows/facility-chat-repair.yml
          git diff --check

      - name: Build final tree
        run: ./gradlew clean build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Add top-down facility chat interface"
          git push origin HEAD:master
