name: Apply Blue Kitchen floor pairing fix

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-blue-kitchen-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Correct floor transition ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          java_path = Path('src/main/java/net/mcreator/scpadditions/facility/UBlocksModule.java')
          text = java_path.read_text(encoding='utf-8')

          replacements = {
              '"sl_1_floor_2", () -> new TransitionConnectedFloorBlock(ConnectionTarget.METAL), false);':
                  '"sl_1_floor_2", BlueConnectedFloorBlock::new, false);',
              '"sl_1_kitchen_floor", () -> new TransitionConnectedFloorBlock(ConnectionTarget.BLUE), false);':
                  '"sl_1_kitchen_floor", GrayConnectedFloorBlock::new, false);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected registration snippet not found: {old}')
              text = text.replace(old, new, 1)

          class_start = text.index('    private static final class TransitionConnectedFloorBlock')
          class_end = text.index('\n    private static void refreshTransitionFloors', class_start)
          replacement_class = '''    private static class TransitionConnectedFloorBlock extends ConnectedFloorBlock {
              private static final EnumProperty<FloorTransition> TRANSITION =
                      EnumProperty.create("transition", FloorTransition.class);
              private final ConnectionTarget connectionTarget;

              private TransitionConnectedFloorBlock(ConnectionTarget connectionTarget) {
                  super();
                  this.connectionTarget = connectionTarget;
                  registerDefaultState(stateDefinition.any().setValue(TRANSITION, FloorTransition.NONE));
              }

              @Override
              protected void createBlockStateDefinition(StateDefinition.Builder<Block, BlockState> builder) {
                  builder.add(TRANSITION);
              }

              protected FloorTransition resolveAt(BlockGetter level, BlockPos pos,
                      BlockPos overriddenPos, BlockState overriddenState) {
                  return resolveTransition(level, pos, overriddenPos, overriddenState,
                          connectionTarget);
              }

              @Override
              public BlockState getStateForPlacement(BlockPlaceContext context) {
                  return defaultBlockState().setValue(TRANSITION,
                          resolveAt(context.getLevel(), context.getClickedPos(), null, null));
              }

              @Override
              public BlockState updateShape(BlockState state, Direction direction,
                      BlockState neighborState, LevelAccessor level, BlockPos currentPos,
                      BlockPos neighborPos) {
                  FloorTransition transition = resolveAt(level, currentPos,
                          neighborPos, neighborState);
                  return state.getValue(TRANSITION) == transition
                          ? state
                          : state.setValue(TRANSITION, transition);
              }
          }

          private static final class BlueConnectedFloorBlock
                  extends TransitionConnectedFloorBlock {
              private BlueConnectedFloorBlock() {
                  super(ConnectionTarget.METAL);
              }

              @Override
              protected FloorTransition resolveAt(BlockGetter level, BlockPos pos,
                      BlockPos overriddenPos, BlockState overriddenState) {
                  FloorTransition kitchenTransition = resolveTransition(level, pos,
                          overriddenPos, overriddenState, ConnectionTarget.KITCHEN);
                  return kitchenTransition == FloorTransition.NONE
                          ? super.resolveAt(level, pos, overriddenPos, overriddenState)
                          : kitchenTransition.asKitchen();
              }
          }
'''
          text = text[:class_start] + replacement_class + text[class_end:]

          old_refresh = '''                FloorTransition transition = resolveTransition(level, target,
                          changedPos, replacementState, floor.connectionTarget);'''
          new_refresh = '''                FloorTransition transition = floor.resolveAt(level, target,
                          changedPos, replacementState);'''
          if old_refresh not in text:
              raise SystemExit('Expected refreshTransitionFloors snippet not found')
          text = text.replace(old_refresh, new_refresh, 1)

          target_start = text.index('    private enum ConnectionTarget {')
          target_end = text.index('\n    private static int count', target_start)
          replacement_target = '''    private enum ConnectionTarget {
              METAL {
                  @Override
                  boolean matches(BlockState state) {
                      return state.is(SL_1_FLOOR_1.get());
                  }
              },
              KITCHEN {
                  @Override
                  boolean matches(BlockState state) {
                      return state.is(SL_1_KITCHEN_FLOOR.get());
                  }
              };

              abstract boolean matches(BlockState state);
          }
'''
          text = text[:target_start] + replacement_target + text[target_end:]

          transition_start = text.index('    private enum FloorTransition implements StringRepresentable {')
          transition_end = text.index('\n    private static final class AdaptiveWallDetailBlock', transition_start)
          replacement_transition = '''    private enum FloorTransition implements StringRepresentable {
              NONE("none"),
              CORNER_SW("corner_sw"),
              CORNER_NW("corner_nw"),
              CORNER_NE("corner_ne"),
              CORNER_SE("corner_se"),
              EDGE_W("edge_w"),
              EDGE_N("edge_n"),
              EDGE_E("edge_e"),
              EDGE_S("edge_s"),
              INNER_NW("inner_nw"),
              INNER_NE("inner_ne"),
              INNER_SE("inner_se"),
              INNER_SW("inner_sw"),
              FULL("full"),
              KITCHEN_CORNER_SW("kitchen_corner_sw"),
              KITCHEN_CORNER_NW("kitchen_corner_nw"),
              KITCHEN_CORNER_NE("kitchen_corner_ne"),
              KITCHEN_CORNER_SE("kitchen_corner_se"),
              KITCHEN_EDGE_W("kitchen_edge_w"),
              KITCHEN_EDGE_N("kitchen_edge_n"),
              KITCHEN_EDGE_E("kitchen_edge_e"),
              KITCHEN_EDGE_S("kitchen_edge_s"),
              KITCHEN_INNER_NW("kitchen_inner_nw"),
              KITCHEN_INNER_NE("kitchen_inner_ne"),
              KITCHEN_INNER_SE("kitchen_inner_se"),
              KITCHEN_INNER_SW("kitchen_inner_sw"),
              KITCHEN_FULL("kitchen_full");

              private final String serializedName;

              FloorTransition(String serializedName) {
                  this.serializedName = serializedName;
              }

              private FloorTransition asKitchen() {
                  return switch (this) {
                      case CORNER_SW -> KITCHEN_CORNER_SW;
                      case CORNER_NW -> KITCHEN_CORNER_NW;
                      case CORNER_NE -> KITCHEN_CORNER_NE;
                      case CORNER_SE -> KITCHEN_CORNER_SE;
                      case EDGE_W -> KITCHEN_EDGE_W;
                      case EDGE_N -> KITCHEN_EDGE_N;
                      case EDGE_E -> KITCHEN_EDGE_E;
                      case EDGE_S -> KITCHEN_EDGE_S;
                      case INNER_NW -> KITCHEN_INNER_NW;
                      case INNER_NE -> KITCHEN_INNER_NE;
                      case INNER_SE -> KITCHEN_INNER_SE;
                      case INNER_SW -> KITCHEN_INNER_SW;
                      case FULL -> KITCHEN_FULL;
                      default -> this;
                  };
              }

              @Override
              public String getSerializedName() {
                  return serializedName;
              }
          }
'''
          text = text[:transition_start] + replacement_transition + text[transition_end:]
          java_path.write_text(text, encoding='utf-8')

          variants = {
              'transition=none': {'model': 'scp_ublocks:block/sl_1_floor_2'},
              'transition=corner_sw': {'model': 'scp_ublocks:block/sl_1_floor_2_a1'},
              'transition=edge_w': {'model': 'scp_ublocks:block/sl_1_floor_2_a2'},
              'transition=inner_nw': {'model': 'scp_ublocks:block/sl_1_floor_2_a3'},
              'transition=corner_nw': {'model': 'scp_ublocks:block/sl_1_floor_2_a4'},
              'transition=edge_n': {'model': 'scp_ublocks:block/sl_1_floor_2_a5'},
              'transition=inner_ne': {'model': 'scp_ublocks:block/sl_1_floor_2_a6'},
              'transition=corner_ne': {'model': 'scp_ublocks:block/sl_1_floor_2_a7'},
              'transition=edge_e': {'model': 'scp_ublocks:block/sl_1_floor_2_a8'},
              'transition=inner_se': {'model': 'scp_ublocks:block/sl_1_floor_2_a9'},
              'transition=corner_se': {'model': 'scp_ublocks:block/sl_1_floor_2_a10'},
              'transition=edge_s': {'model': 'scp_ublocks:block/sl_1_floor_2_a11'},
              'transition=inner_sw': {'model': 'scp_ublocks:block/sl_1_floor_2_a12'},
              'transition=full': {'model': 'scp_ublocks:block/sl_1_floor_1'},
              'transition=kitchen_corner_sw': {'model': 'scp_additions:block/sl_1_kitchen_floor_1'},
              'transition=kitchen_edge_w': {'model': 'scp_additions:block/sl_1_kitchen_floor_2'},
              'transition=kitchen_inner_nw': {'model': 'scp_additions:block/sl_1_kitchen_floor_3'},
              'transition=kitchen_corner_nw': {'model': 'scp_additions:block/sl_1_kitchen_floor_4'},
              'transition=kitchen_edge_n': {'model': 'scp_additions:block/sl_1_kitchen_floor_5'},
              'transition=kitchen_inner_ne': {'model': 'scp_additions:block/sl_1_kitchen_floor_6'},
              'transition=kitchen_corner_ne': {'model': 'scp_additions:block/sl_1_kitchen_floor_7'},
              'transition=kitchen_edge_e': {'model': 'scp_additions:block/sl_1_kitchen_floor_8'},
              'transition=kitchen_inner_se': {'model': 'scp_additions:block/sl_1_kitchen_floor_9'},
              'transition=kitchen_corner_se': {'model': 'scp_additions:block/sl_1_kitchen_floor_10'},
              'transition=kitchen_edge_s': {'model': 'scp_additions:block/sl_1_kitchen_floor_11'},
              'transition=kitchen_inner_sw': {'model': 'scp_additions:block/sl_1_kitchen_floor_12'},
              'transition=kitchen_full': {'model': 'scp_additions:block/sl_1_kitchen_floor'},
          }
          blue_state = json.dumps({'variants': variants}, indent=2) + '\n'
          for blue_path in (
              Path('src/main/resources/assets/scp_additions/blockstates/sl_1_floor_2.json'),
              Path('src/main/resources/assets/scp_ublocks/blockstates/sl_1_floor_2.json'),
          ):
              blue_path.parent.mkdir(parents=True, exist_ok=True)
              blue_path.write_text(blue_state, encoding='utf-8')

          kitchen_state = json.dumps({
              'variants': {
                  '': {'model': 'scp_additions:block/sl_1_kitchen_floor'}
              }
          }, indent=2) + '\n'
          Path('src/main/resources/assets/scp_additions/blockstates/sl_1_kitchen_floor.json').write_text(
              kitchen_state, encoding='utf-8')
          PY

      - name: Validate implementation
        run: ./gradlew clean verifyMoreMcmetaDevRuntime build --no-daemon --stacktrace

      - name: Commit corrected implementation
        shell: bash
        run: |
          rm .github/workflows/apply-blue-kitchen-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Blue and Kitchen floor transition ownership"
          git push origin HEAD:master
