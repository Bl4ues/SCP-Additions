name: Build

on:
  push:
    branches:
      - master
      - integration/scp-additions-3.0
      - 'feature/**'
  pull_request:
    branches:
      - master
      - integration/scp-additions-3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply elevator arrival display
        id: apply
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/elevator-arrival-display' && hashFiles('tools/hotfix/apply_elevator_arrival_display.py') != ''
        run: |
          python tools/hotfix/apply_elevator_arrival_display.py
          rm tools/hotfix/apply_elevator_arrival_display.py
          git show 95b7c16f8f5b5f0c62013add013e32d36f780652:.github/workflows/build.yml > .github/workflows/build.yml
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Commit validated elevator arrival display
        if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement configurable elevator arrival display"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scp-additions-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
