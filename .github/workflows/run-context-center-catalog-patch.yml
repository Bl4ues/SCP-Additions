name: Run context center catalog patch

on:
  push:
    branches:
      - 'fix/config-center-integrated-context'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run context center catalog patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and apply source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-context-center-catalog.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n      - name: Commit patch", start)
          body = workflow[start:end]
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          exec(compile(body, '.context-center-patch.py', 'exec'))
          PY
      - name: Commit source changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-context-center-catalog.yml
          rm -f .github/workflows/run-context-center-catalog-patch.yml
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git commit -m "Show integrated contextual interactions in Config Center"
          git push origin HEAD:fix/config-center-integrated-context
