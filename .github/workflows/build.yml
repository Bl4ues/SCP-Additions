name: Build

on:
  push:
    branches:
      - master
      - integration/scp-additions-3.0
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - master
      - integration/scp-additions-3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and verify development runtime
        run: ./gradlew clean verifyMoreMcmetaDevRuntime build --stacktrace

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scp-additions-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Finalize native emissive integration
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'feature/native-block-emissives'
        shell: bash
        run: |
          if [ ! -f tools/hotfix/RUN_NATIVE_EMISSIVE_DOCS ]; then
            exit 0
          fi

          python3 tools/hotfix/apply_native_emissive_docs.py
          rm -f tools/hotfix/RUN_NATIVE_EMISSIVE_DOCS
          rm -f tools/hotfix/apply_native_emissive_docs.py

          git fetch origin master
          git show origin/master:.github/workflows/build.yml \
            > .github/workflows/build.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add native emissive block rendering" \
            -m "Render authored block *_e.png masks through native full-bright overlays, retain LabPBR shader emission, remove the MoreMcmeta requirement for block emissivity, avoid empty render passes, and document the new behavior."
          git push origin "HEAD:${{ github.head_ref }}"
