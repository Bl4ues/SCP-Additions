name: Remove Legacy Emissive Runtime

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths:
      - tools/hotfix/RUN_REMOVE_LEGACY_EMISSIVE_RUNTIME
      - tools/hotfix/remove_legacy_emissive_runtime.py
      - tools/hotfix/adjust_cleanup_runner.py
      - .github/workflows/remove-legacy-emissive-runtime.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check cleanup marker
        id: marker
        shell: bash
        run: |
          if [ -f tools/hotfix/RUN_REMOVE_LEGACY_EMISSIVE_RUNTIME ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        if: steps.marker.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply cleanup
        if: steps.marker.outputs.run == 'true'
        shell: bash
        run: |
          python3 tools/hotfix/adjust_cleanup_runner.py
          python3 tools/hotfix/remove_legacy_emissive_runtime.py

      - name: Validate native-only build
        if: steps.marker.outputs.run == 'true'
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace
          ./gradlew dependencies --configuration runtimeClasspath --no-daemon > build/runtime-classpath.txt
          if grep -qi 'moremcmeta' build/runtime-classpath.txt; then
            echo 'Removed emissive runtime is still present on runtimeClasspath.' >&2
            cat build/runtime-classpath.txt
            exit 1
          fi

      - name: Commit cleanup
        if: steps.marker.outputs.run == 'true'
        shell: bash
        run: |
          rm -f build/runtime-classpath.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove MoreMcmeta development runtime" -m "Remove the obsolete download, extraction, cache and optional metadata for MoreMcmeta; retain the native block emissive and LabPBR pipeline; and validate a clean runtime classpath without the removed dependency."
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
