name: Diagnose Real Creative Tab Sections

on:
  pull_request:
    branches:
      - master

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          show-progress: false

      - name: Apply creative tab redesign
        run: python3 scripts/apply_real_creative_sections.py
