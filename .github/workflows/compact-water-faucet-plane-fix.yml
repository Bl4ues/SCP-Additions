name: Compact Water Faucet Plane Fix

on:
  push:
    branches:
      - fix/water-faucet-planes-collision

permissions:
  contents: write

jobs:
  rewrite:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/water-faucet-planes-collision
          fetch-depth: 0

      - name: Rewrite only the zero-thickness planes
        run: python scripts/compact_water_faucet_plane_fix.py

      - name: Commit compact model diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/scp_additions/models/block/water_faucet.json
          git commit -m "Keep Water Faucet plane fix compact [skip ci]"
          git push origin HEAD:fix/water-faucet-planes-collision
