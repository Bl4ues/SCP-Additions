name: Add facility chat interface

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  implement:
    if: contains(github.event.head_commit.message, '[facility-chat]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Implement facility chat interface
        shell: bash
        run: |
          cat > /tmp/add_facility_chat.py <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing patch marker in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, count), encoding='utf-8')

          prefs = 'src/main/java/net/mcreator/scpadditions/client/ClientModulePreferences.java'
          replace(prefs,
              '            "hud.disable_text_drop_shadows",\n',
              '            "hud.disable_text_drop_shadows",\n            "hud.facility_chat_interface",\n')
          replace(prefs,
              '        next.hud.disableTextDropShadows = bool(hud,\n                "disable_text_drop_shadows",\n                next.hud.disableTextDropShadows);\n',
              '        next.hud.disableTextDropShadows = bool(hud,\n                "disable_text_drop_shadows",\n                next.hud.disableTextDropShadows);\n        next.hud.facilityChatInterface = bool(hud,\n                "facility_chat_interface",\n                next.hud.facilityChatInterface);\n')
          replace(prefs,
              '        hud.addProperty("disable_text_drop_shadows",\n                value.hud.disableTextDropShadows);\n',
              '        hud.addProperty("disable_text_drop_shadows",\n                value.hud.disableTextDropShadows);\n        hud.addProperty("facility_chat_interface",\n                value.hud.facilityChatInterface);\n')
          replace(prefs,
              '    public static boolean disableTextDropShadows() {\n        return current.hud.disableTextDropShadows;\n    }\n',
              '    public static boolean disableTextDropShadows() {\n        return current.hud.disableTextDropShadows;\n    }\n\n    public static boolean facilityChatInterfaceEnabled() {\n        return current.hud.facilityChatInterface;\n    }\n')
          replace(prefs,
              '        private boolean disableTextDropShadows = true;\n',
              '        private boolean disableTextDropShadows = true;\n        private boolean facilityChatInterface = true;\n')

          modules_config = 'src/main/java/net/mcreator/scpadditions/config/ScpAdditionsModulesConfig.java'
          replace(modules_config,
              '\t\t@SerializedName("disable_text_drop_shadows")\n\t\tpublic boolean disableTextDropShadows = true;\n',
              '\t\t@SerializedName("disable_text_drop_shadows")\n\t\tpublic boolean disableTextDropShadows = true;\n\n\t\t@SerializedName("facility_chat_interface")\n\t\tpublic boolean facilityChatInterface = true;\n')

          modules_json = Path('config/scpadditions/modules.json')
          text = modules_json.read_text(encoding='utf-8')
          old = '    "action_bars_roboto": true,\n    "disable_text_drop_shadows": true\n'
          new = '    "action_bars_roboto": true,\n    "disable_text_drop_shadows": true,\n    "facility_chat_interface": true\n'
          if old not in text:
              raise SystemExit('modules.json HUD marker not found')
          modules_json.write_text(text.replace(old, new, 1), encoding='utf-8')

          ui = 'src/main/java/net/mcreator/scpadditions/config/ui/AdditionalGameplayModulesUi.java'
          marker = '''            if (!labels.contains("Disable Text Drop Shadows")) {
                additions.add(constructor.newInstance(
                        "hud", "disable_text_drop_shadows",
                        "Disable Text Drop Shadows",
                        "Removes Minecraft's dark offset shadow from rendered text while preserving the text itself.",
                        true));
            }
'''
          addition = marker + '''            if (!labels.contains("Facility Chat Interface")) {
                additions.add(constructor.newInstance(
                        "hud", "facility_chat_interface",
                        "Facility Chat Interface",
                        "Reanchors vanilla chat to the upper-left and presents it as a top-down SCP Additions communications console.",
                        true));
            }
'''
          replace(ui, marker, addition)

          layout = r'''package net.mcreator.scpadditions.client;

import com.bl4ues.scpinventory.client.ScpFonts;
import net.minecraft.client.Minecraft;
import net.minecraft.client.gui.GuiGraphics;
import net.minecraft.client.gui.components.ChatComponent;
import net.minecraft.client.gui.components.EditBox;
import net.minecraft.network.chat.Component;
import net.minecraft.util.Mth;

/** Shared geometry and presentation constants for the optional top-down chat. */
public final class FacilityChatLayout {
    public static final int PANEL = 0xFF111317;
    public static final int HEADER = 0xFF24282E;
    public static final int NAVY = 0xFF081022;
    public static final int NAVY_HOVER = 0xFF131E36;
    public static final int BORDER = 0xFF46536C;
    public static final int BORDER_HOVER = 0xFF73809A;
    public static final int ACCENT = 0xFFC59A2A;
    public static final int PALE_GOLD = 0xFFE5D49A;
    public static final int WHITE = 0xFFF7F8FC;
    public static final int MUTED = 0xFF9CA3AF;
    public static final int LIVE = 0xFF79D58B;

    public static final int TOP_MARGIN = 6;
    public static final int HEADER_HEIGHT = 18;
    public static final int INPUT_GAP = 4;
    private static final int INPUT_LEFT = 17;

    private FacilityChatLayout() {
    }

    public static int lineHeight() {
        Minecraft minecraft = Minecraft.getInstance();
        return (int) (9.0D * (minecraft.options.chatLineSpacing().get() + 1.0D));
    }

    public static int topScaled(ChatComponent chat) {
        double scale = Math.max(0.01D, chat.getScale());
        return Mth.floor((double) TOP_MARGIN / scale);
    }

    public static int messageTopScaled(ChatComponent chat, boolean focused) {
        return topScaled(chat) + (focused ? HEADER_HEIGHT : 0);
    }

    public static int messageRegionHeightScaled(ChatComponent chat) {
        return chat.getLinesPerPage() * lineHeight();
    }

    public static int panelScreenRight(ChatComponent chat) {
        double scale = Math.max(0.01D, chat.getScale());
        int logicalWidth = Mth.ceil((float) chat.getWidth() / (float) scale);
        return Mth.ceil((logicalWidth + 12) * scale);
    }

    public static int inputY(ChatComponent chat) {
        double scale = Math.max(0.01D, chat.getScale());
        int logical = messageTopScaled(chat, true)
                + messageRegionHeightScaled(chat) + INPUT_GAP;
        int desired = Mth.ceil(logical * scale);
        int screenHeight = Minecraft.getInstance().getWindow().getGuiScaledHeight();
        return Math.min(desired, Math.max(TOP_MARGIN + 18, screenHeight - 16));
    }

    public static int inputX() {
        return INPUT_LEFT;
    }

    public static int inputWidth(ChatComponent chat) {
        int screenWidth = Minecraft.getInstance().getWindow().getGuiScaledWidth();
        int right = Math.min(panelScreenRight(chat) - 4, screenWidth - 4);
        return Math.max(40, right - INPUT_LEFT);
    }

    public static int suggestionTop(EditBox input, int screenHeight, int lineLimit) {
        int desired = input.getY() + input.getHeight() + 4;
        int reserve = Math.max(12, lineLimit * 12) + 4;
        return Math.max(4, Math.min(desired, screenHeight - reserve));
    }

    public static void drawInputFrame(GuiGraphics graphics,
            ChatComponent chat, EditBox input) {
        int left = 2;
        int right = Math.min(panelScreenRight(chat),
                Minecraft.getInstance().getWindow().getGuiScaledWidth() - 2);
        int top = input.getY() - 2;
        int bottom = input.getY() + input.getHeight() + 2;

        graphics.fill(left, top, right, bottom, 0xE6081022);
        graphics.fill(left, top, left + 2, bottom, ACCENT);
        graphics.fill(left + 2, top, right, top + 1, BORDER);
        graphics.fill(left + 2, bottom - 1, right, bottom, BORDER);
        graphics.fill(right - 1, top, right, bottom, BORDER);

        Component prompt = ScpFonts.roboto(">");
        graphics.drawString(Minecraft.getInstance().font, prompt,
                7, input.getY() + 2, PALE_GOLD, false);
    }

    public static int withAlpha(int color, int alpha) {
        return (Mth.clamp(alpha, 0, 255) << 24) | (color & 0x00FFFFFF);
    }
}
'''
          Path('src/main/java/net/mcreator/scpadditions/client/FacilityChatLayout.java').write_text(layout, encoding='utf-8')

          chat_mixin = r'''package net.mcreator.scpadditions.mixin.client;

import com.bl4ues.scpinventory.client.ScpFonts;
import net.minecraft.client.GuiMessage;
import net.minecraft.client.GuiMessageTag;
import net.minecraft.client.Minecraft;
import net.minecraft.client.gui.GuiGraphics;
import net.minecraft.client.gui.components.ChatComponent;
import net.minecraft.network.chat.Component;
import net.minecraft.util.Mth;
import net.mcreator.scpadditions.client.ClientModulePreferences;
import net.mcreator.scpadditions.client.FacilityChatLayout;
import org.spongepowered.asm.mixin.Final;
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.Shadow;
import org.spongepowered.asm.mixin.injection.At;
import org.spongepowered.asm.mixin.injection.Inject;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

import java.util.ArrayList;
import java.util.Collections;
import java.util.List;

/**
 * Reuses Minecraft's chat history, scrolling, filtering and interaction model,
 * replacing only its presentation while the personal facility-chat toggle is on.
 */
@Mixin(ChatComponent.class)
public abstract class ChatComponentMixin {
    @Shadow @Final private Minecraft minecraft;
    @Shadow @Final private List<GuiMessage.Line> trimmedMessages;
    @Shadow private int chatScrollbarPos;
    @Shadow private boolean newMessageSinceScroll;

    @Shadow private boolean isChatHidden() { throw new AssertionError(); }
    @Shadow private boolean isChatFocused() { throw new AssertionError(); }
    @Shadow private static double getTimeFactor(int age) { throw new AssertionError(); }
    @Shadow private int getLineHeight() { throw new AssertionError(); }
    @Shadow private double screenToChatX(double x) { throw new AssertionError(); }
    @Shadow private double screenToChatY(double y) { throw new AssertionError(); }
    @Shadow private int getMessageEndIndexAt(double x, double y) { throw new AssertionError(); }
    @Shadow private int getTagIconLeft(GuiMessage.Line line) { throw new AssertionError(); }
    @Shadow private void drawTagIcon(GuiGraphics graphics, int x, int y,
            GuiMessageTag.Icon icon) { throw new AssertionError(); }

    @Shadow public abstract int getWidth();
    @Shadow public abstract double getScale();
    @Shadow public abstract int getLinesPerPage();

    @Inject(method = "render", at = @At("HEAD"), cancellable = true)
    private void scpAdditions$renderFacilityChat(GuiGraphics graphics,
            int tickCount, int mouseX, int mouseY, CallbackInfo ci) {
        if (!ClientModulePreferences.facilityChatInterfaceEnabled()) return;
        ci.cancel();
        if (this.isChatHidden()) return;

        boolean focused = this.isChatFocused();
        int total = this.trimmedMessages.size();
        if (total <= 0 && !focused) return;

        ChatComponent self = (ChatComponent) (Object) this;
        int linesPerPage = this.getLinesPerPage();
        float scale = (float) Math.max(0.01D, this.getScale());
        int width = Mth.ceil((float) this.getWidth() / scale);
        int lineHeight = this.getLineHeight();
        int top = FacilityChatLayout.topScaled(self);
        int messageTop = FacilityChatLayout.messageTopScaled(self, focused);
        int messageBottom = messageTop + linesPerPage * lineHeight;
        double textOpacity = this.minecraft.options.chatOpacity().get() * 0.9D + 0.1D;
        double backgroundOpacity = this.minecraft.options.textBackgroundOpacity().get();
        double lineSpacing = this.minecraft.options.chatLineSpacing().get();
        int textOffset = (int) Math.round(-8.0D * (lineSpacing + 1.0D)
                + 4.0D * lineSpacing);
        long queued = this.minecraft.getChatListener().queueSize();

        graphics.pose().pushPose();
        graphics.pose().scale(scale, scale, 1.0F);
        graphics.pose().translate(4.0F, 0.0F, 0.0F);

        if (focused) {
            scpAdditions$drawFocusedFrame(graphics, width, top,
                    messageTop, messageBottom, backgroundOpacity, queued);
        }

        int available = Math.max(0, total - this.chatScrollbarPos);
        int windowCount = Math.min(linesPerPage, available);
        List<Integer> displayIndices = new ArrayList<>(windowCount);
        for (int offset = 0; offset < windowCount; ++offset) {
            int index = this.chatScrollbarPos + offset;
            GuiMessage.Line line = this.trimmedMessages.get(index);
            int age = tickCount - line.addedTime();
            if (focused || age < 200) displayIndices.add(index);
        }
        Collections.reverse(displayIndices);

        int hoveredEnd = -1;
        if (focused && !displayIndices.isEmpty()) {
            hoveredEnd = this.getMessageEndIndexAt(
                    this.screenToChatX(mouseX), this.screenToChatY(mouseY));
        }

        int row = 0;
        for (int index : displayIndices) {
            GuiMessage.Line line = this.trimmedMessages.get(index);
            int age = tickCount - line.addedTime();
            double fade = focused ? 1.0D : getTimeFactor(age);
            int textAlpha = (int) (255.0D * fade * textOpacity);
            int backgroundAlpha = (int) (255.0D * fade * backgroundOpacity);
            if (textAlpha <= 3) continue;

            int rowTop = messageTop + row * lineHeight;
            int rowBottom = rowTop + lineHeight;
            int textY = rowBottom + textOffset;

            graphics.pose().pushPose();
            graphics.pose().translate(0.0F, 0.0F, 50.0F);

            if (!focused) {
                graphics.fill(-4, rowTop, width + 8, rowBottom,
                        FacilityChatLayout.withAlpha(FacilityChatLayout.NAVY,
                                Math.min(220, backgroundAlpha)));
                graphics.fill(-4, rowTop, -3, rowBottom,
                        FacilityChatLayout.withAlpha(FacilityChatLayout.BORDER,
                                Math.max(28, textAlpha / 3)));
            }

            GuiMessageTag tag = line.tag();
            if (tag != null) {
                int tagColor = tag.indicatorColor() | (textAlpha << 24);
                graphics.fill(-4, rowTop, -2, rowBottom, tagColor);
                if (index == hoveredEnd && tag.icon() != null) {
                    int iconX = this.getTagIconLeft(line);
                    this.drawTagIcon(graphics, iconX, textY + 9, tag.icon());
                }
            }

            graphics.pose().translate(0.0F, 0.0F, 50.0F);
            graphics.drawString(this.minecraft.font, line.content(), 0, textY,
                    0x00FFFFFF | (textAlpha << 24),
                    !ClientModulePreferences.disableTextDropShadows());
            graphics.pose().popPose();
            ++row;
        }

        if (focused) {
            scpAdditions$drawScrollbar(graphics, width, messageTop,
                    linesPerPage * lineHeight, total, linesPerPage);
        }

        graphics.pose().popPose();
    }

    private void scpAdditions$drawFocusedFrame(GuiGraphics graphics,
            int width, int top, int messageTop, int messageBottom,
            double backgroundOpacity, long queued) {
        int bodyAlpha = 72 + (int) Math.round(148.0D * backgroundOpacity);
        graphics.fill(-4, top, width + 8, messageBottom,
                FacilityChatLayout.withAlpha(FacilityChatLayout.NAVY, bodyAlpha));
        graphics.fill(-4, top, width + 8,
                top + FacilityChatLayout.HEADER_HEIGHT,
                FacilityChatLayout.withAlpha(FacilityChatLayout.HEADER, 238));
        graphics.fill(-4, top + FacilityChatLayout.HEADER_HEIGHT - 1,
                width + 8, top + FacilityChatLayout.HEADER_HEIGHT,
                FacilityChatLayout.ACCENT);
        graphics.fill(-4, top, -3, messageBottom, FacilityChatLayout.BORDER);
        graphics.fill(width + 7, top, width + 8, messageBottom,
                FacilityChatLayout.BORDER);
        graphics.fill(-4, messageBottom - 1, width + 8, messageBottom,
                FacilityChatLayout.BORDER);

        Component title = ScpFonts.roboto("//FACILITY_COMMS");
        graphics.drawString(this.minecraft.font, title, 2, top + 5,
                FacilityChatLayout.PALE_GOLD, false);

        String statusText;
        int statusColor;
        if (queued > 0L) {
            statusText = "QUEUE " + queued;
            statusColor = FacilityChatLayout.ACCENT;
        } else if (this.newMessageSinceScroll) {
            statusText = "NEW";
            statusColor = FacilityChatLayout.PALE_GOLD;
        } else {
            statusText = "LIVE";
            statusColor = FacilityChatLayout.LIVE;
        }
        Component status = ScpFonts.roboto(statusText);
        int statusX = width + 3 - this.minecraft.font.width(status);
        graphics.drawString(this.minecraft.font, status, statusX,
                top + 5, statusColor, false);
    }

    private void scpAdditions$drawScrollbar(GuiGraphics graphics, int width,
            int trackTop, int trackHeight, int total, int pageLines) {
        int visible = Math.min(pageLines, total);
        if (total <= visible || trackHeight <= 0) return;

        int maxScroll = Math.max(1, total - visible);
        double progress = 1.0D - Mth.clamp(
                (double) this.chatScrollbarPos / (double) maxScroll,
                0.0D, 1.0D);
        int thumbHeight = Math.max(8, trackHeight * visible / total);
        int thumbTop = trackTop + (int) Math.round(
                (trackHeight - thumbHeight) * progress);
        int x = width + 5;

        graphics.fill(x, trackTop, x + 1, trackTop + trackHeight,
                FacilityChatLayout.withAlpha(FacilityChatLayout.BORDER, 130));
        graphics.fill(x - 1, thumbTop, x + 2, thumbTop + thumbHeight,
                this.newMessageSinceScroll
                        ? FacilityChatLayout.ACCENT
                        : FacilityChatLayout.BORDER_HOVER);
    }

    @Inject(method = "screenToChatY", at = @At("HEAD"), cancellable = true)
    private void scpAdditions$mapTopDownMouseY(double screenY,
            CallbackInfoReturnable<Double> cir) {
        if (!ClientModulePreferences.facilityChatInterfaceEnabled()) return;

        ChatComponent self = (ChatComponent) (Object) this;
        double scale = Math.max(0.01D, this.getScale());
        int lineHeight = this.getLineHeight();
        int count = Math.min(this.getLinesPerPage(),
                Math.max(0, this.trimmedMessages.size() - this.chatScrollbarPos));
        double localY = screenY / scale
                - FacilityChatLayout.messageTopScaled(self, this.isChatFocused());
        if (count <= 0 || localY < 0.0D
                || localY >= (double) count * lineHeight) {
            cir.setReturnValue(-1.0D);
            return;
        }

        int row = Mth.floor(localY / lineHeight);
        double fraction = (localY - row * lineHeight) / lineHeight;
        cir.setReturnValue((double) (count - 1 - row) + fraction);
    }

    @Inject(method = "handleChatQueueClicked", at = @At("HEAD"),
            cancellable = true)
    private void scpAdditions$handleHeaderQueue(double mouseX, double mouseY,
            CallbackInfoReturnable<Boolean> cir) {
        if (!ClientModulePreferences.facilityChatInterfaceEnabled()) return;
        cir.setReturnValue(false);

        if (!this.isChatFocused() || this.minecraft.options.hideGui
                || this.isChatHidden()) return;
        long queued = this.minecraft.getChatListener().queueSize();
        if (queued <= 0L) return;

        ChatComponent self = (ChatComponent) (Object) this;
        double scale = Math.max(0.01D, this.getScale());
        int top = Mth.floor(FacilityChatLayout.topScaled(self) * scale);
        int bottom = Mth.ceil((FacilityChatLayout.topScaled(self)
                + FacilityChatLayout.HEADER_HEIGHT) * scale);
        int right = FacilityChatLayout.panelScreenRight(self);
        int left = Math.max(0, right - 96);
        if (mouseX >= left && mouseX <= right
                && mouseY >= top && mouseY <= bottom) {
            this.minecraft.getChatListener().acceptNextDelayedMessage();
            cir.setReturnValue(true);
        }
    }
}
'''
          mixin_dir = Path('src/main/java/net/mcreator/scpadditions/mixin/client')
          mixin_dir.mkdir(parents=True, exist_ok=True)
          (mixin_dir / 'ChatComponentMixin.java').write_text(chat_mixin, encoding='utf-8')

          screen_mixin = r'''package net.mcreator.scpadditions.mixin.client;

import net.minecraft.client.Minecraft;
import net.minecraft.client.gui.GuiGraphics;
import net.minecraft.client.gui.components.ChatComponent;
import net.minecraft.client.gui.components.EditBox;
import net.minecraft.client.gui.screens.ChatScreen;
import net.mcreator.scpadditions.client.ClientModulePreferences;
import net.mcreator.scpadditions.client.FacilityChatLayout;
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.Shadow;
import org.spongepowered.asm.mixin.injection.At;
import org.spongepowered.asm.mixin.injection.Inject;
import org.spongepowered.asm.mixin.injection.Redirect;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

/** Moves the vanilla chat input field underneath the top-down facility console. */
@Mixin(ChatScreen.class)
public abstract class ChatScreenMixin {
    @Shadow protected EditBox input;

    @Inject(method = "init", at = @At("TAIL"))
    private void scpAdditions$positionFacilityInput(CallbackInfo ci) {
        if (!ClientModulePreferences.facilityChatInterfaceEnabled()) return;
        Minecraft minecraft = Minecraft.getInstance();
        ChatComponent chat = minecraft.gui.getChat();
        this.input.setX(FacilityChatLayout.inputX());
        this.input.setY(FacilityChatLayout.inputY(chat));
        this.input.setWidth(FacilityChatLayout.inputWidth(chat));
    }

    @Redirect(method = "render",
            at = @At(value = "INVOKE",
                    target = "Lnet/minecraft/client/gui/GuiGraphics;fill(IIIII)V",
                    ordinal = 0))
    private void scpAdditions$renderFacilityInputFrame(GuiGraphics graphics,
            int left, int top, int right, int bottom, int color) {
        if (!ClientModulePreferences.facilityChatInterfaceEnabled()) {
            graphics.fill(left, top, right, bottom, color);
            return;
        }
        FacilityChatLayout.drawInputFrame(graphics,
                Minecraft.getInstance().gui.getChat(), this.input);
    }
}
'''
          (mixin_dir / 'ChatScreenMixin.java').write_text(screen_mixin, encoding='utf-8')

          suggestions_mixin = r'''package net.mcreator.scpadditions.mixin.client;

import net.minecraft.client.gui.components.CommandSuggestions;
import net.minecraft.client.gui.components.EditBox;
import net.minecraft.client.gui.screens.Screen;
import net.mcreator.scpadditions.client.ClientModulePreferences;
import net.mcreator.scpadditions.client.FacilityChatLayout;
import org.spongepowered.asm.mixin.Final;
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.Mutable;
import org.spongepowered.asm.mixin.Shadow;
import org.spongepowered.asm.mixin.injection.At;
import org.spongepowered.asm.mixin.injection.Constant;
import org.spongepowered.asm.mixin.injection.Inject;
import org.spongepowered.asm.mixin.injection.ModifyConstant;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

/** Keeps command completion and usage hints attached to the relocated input box. */
@Mixin(CommandSuggestions.class)
public abstract class CommandSuggestionsMixin {
    @Shadow @Final private Screen screen;
    @Shadow @Final private EditBox input;
    @Shadow @Final private int suggestionLineLimit;
    @Shadow @Final @Mutable private boolean anchorToBottom;
    @Shadow @Final @Mutable private int fillColor;

    @Inject(method = "<init>", at = @At("TAIL"))
    private void scpAdditions$useFacilitySuggestionStyle(CallbackInfo ci) {
        if (!ClientModulePreferences.facilityChatInterfaceEnabled()) return;
        this.anchorToBottom = false;
        this.fillColor = 0xE6081022;
    }

    @ModifyConstant(method = "showSuggestions",
            constant = @Constant(intValue = 72))
    private int scpAdditions$moveSuggestionList(int original) {
        if (!ClientModulePreferences.facilityChatInterfaceEnabled()) return original;
        return FacilityChatLayout.suggestionTop(this.input,
                this.screen.height, this.suggestionLineLimit);
    }

    @ModifyConstant(method = "renderUsage",
            constant = @Constant(intValue = 72))
    private int scpAdditions$moveUsageHints(int original) {
        if (!ClientModulePreferences.facilityChatInterfaceEnabled()) return original;
        return FacilityChatLayout.suggestionTop(this.input,
                this.screen.height, this.suggestionLineLimit);
    }
}
