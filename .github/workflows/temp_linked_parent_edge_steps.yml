name: Validate linked roof parent boundary tessellation
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch parent edge subdivisions
        run: python3 .github/scripts/temp_linked_parent_edge_steps.py
      - name: Verify integrity
        run: python3 .github/scripts/verify_project_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Publish validated code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Match linked parent border tessellation to roof profiles'
          git pull --rebase origin master
          git push origin HEAD:master
