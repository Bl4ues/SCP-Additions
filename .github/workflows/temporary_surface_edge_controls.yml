name: Validate independent Surface edge editing
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_surface_edge_controls.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply independent edge control changes
        run: python3 .github/scripts/temporary_surface_edge_controls.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build changed editor and HUD
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit verified changes to master
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientControls.java src/main/java/com/bl4ues/scpclassifieddirective/client/BuilderToolGuideHud.java
          git commit -m 'Add independent curved Surface edge handles and align gizmos to curves'
          git pull --rebase origin master
          git push origin HEAD:master
