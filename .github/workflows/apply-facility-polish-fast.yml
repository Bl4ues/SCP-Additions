name: Apply facility polish fast
on:
  push:
    branches: [master]
    paths: [tools/hotfix/APPLY_FACILITY_POLISH_FAST]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute implementation payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/apply-facility-elevator-polish.yml').read_text()
          payload = source.split("          python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(payload), '<facility-polish>', 'exec'))
          PY
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/main/resources
          git commit -m "Polish facility blocks and Core Room elevator interactions"
          git push origin HEAD:master
