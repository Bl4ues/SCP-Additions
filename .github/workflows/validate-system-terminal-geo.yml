name: Validate System Terminal Geometry

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/validate-system-terminal-geo.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Remove temporary workflow from validation tree
        shell: bash
        run: rm -f .github/workflows/validate-system-terminal-geo.yml

      - name: Validate GeckoLib geometry JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('src/main/resources/assets/scp_additions/geo/block/system_terminal.geo.json')
          with path.open(encoding='utf-8') as handle:
              model = json.load(handle)
          version = model.get('format_version')
          if version != '1.12.0':
              raise SystemExit(f'{path}: unsupported GeckoLib geometry version {version!r}')
          geometry = model.get('minecraft:geometry')
          if not isinstance(geometry, list) or not geometry:
              raise SystemExit(f'{path}: missing minecraft:geometry array')
          if not isinstance(geometry[0].get('bones'), list):
              raise SystemExit(f'{path}: missing bones array')
          print(f'Validated {path}: format_version={version}, bones={len(geometry[0]["bones"])}')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build final tree
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Remove temporary workflow from master
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-system-terminal-geo.yml
          git commit -m "Remove temporary terminal geometry validation workflow"
          git push origin HEAD:master
