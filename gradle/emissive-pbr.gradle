// Adds LabPBR emission to every authored OptiFine-style *_e.png overlay.
// Existing _s RGB material channels are preserved; only their alpha emission
// channel is generated. When no _s map exists, a neutral non-metal material is
// created so the emissive texture still works with shader packs.
gradle.afterProject { evaluatedProject, state ->
    if (state.failure != null) {
        return
    }

    def resourceTask = evaluatedProject.tasks.findByName('processResources')
    if (resourceTask == null) {
        return
    }

    resourceTask.doLast {
        File assetsRoot = evaluatedProject.file(
                "${evaluatedProject.buildDir}/resources/main/assets")
        if (!assetsRoot.isDirectory()) {
            return
        }

        // One malformed optional material must not abort the complete resource
        // build. Record the exact path so the source asset can be repaired,
        // while allowing every other valid emissive texture to be processed.
        def readPng = { File imageFile ->
            try {
                return javax.imageio.ImageIO.read(imageFile)
            } catch (Exception exception) {
                evaluatedProject.logger.warn(
                        "Skipping unreadable PNG ${imageFile}: ${exception.message}")
                return null
            }
        }

        // The Floor Station is a GeckoLib block entity, but its authored light
        // artwork uses the same glowmask convention as entities. Mirror that
        // mask to an _e overlay in processed resources so shader packs also see
        // it through the normal LabPBR material path. The GeckoLib glowing layer
        // remains as the renderer-level emissive path.
        [
                'scp_additions/textures/entities/core_room_elevator_floor_station',
                'scp_additions/textures/block/core_room_elevator_floor_station'
        ].each { relativeBase ->
            File glowmask = new File(assetsRoot,
                    "${relativeBase}_glowmask.png")
            File emissive = new File(assetsRoot,
                    "${relativeBase}_e.png")
            if (glowmask.isFile()) {
                emissive.parentFile.mkdirs()
                java.nio.file.Files.copy(glowmask.toPath(), emissive.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }

        evaluatedProject.fileTree(assetsRoot).matching {
            include '**/*_e.png'
        }.files.sort { first, second ->
            first.path <=> second.path
        }.each { File emissiveFile ->
            def emissiveImage = readPng(emissiveFile)
            if (emissiveImage == null) {
                return
            }

            String specularName = emissiveFile.name.replaceFirst(
                    /_e\.png$/, '_s.png')
            File specularFile = new File(emissiveFile.parentFile,
                    specularName)
            java.awt.image.BufferedImage specularImage

            if (specularFile.isFile()) {
                def sourceSpecular = readPng(specularFile)
                if (sourceSpecular == null
                        || sourceSpecular.width != emissiveImage.width
                        || sourceSpecular.height != emissiveImage.height) {
                    evaluatedProject.logger.warn(
                            'Skipping LabPBR emission for {} because {} is unreadable or has incompatible dimensions',
                            emissiveFile, specularFile)
                    return
                }

                specularImage = new java.awt.image.BufferedImage(
                        sourceSpecular.width, sourceSpecular.height,
                        java.awt.image.BufferedImage.TYPE_INT_ARGB)
                def graphics = specularImage.createGraphics()
                try {
                    graphics.drawImage(sourceSpecular, 0, 0, null)
                } finally {
                    graphics.dispose()
                }
            } else {
                specularImage = new java.awt.image.BufferedImage(
                        emissiveImage.width, emissiveImage.height,
                        java.awt.image.BufferedImage.TYPE_INT_ARGB)
                for (int y = 0; y < specularImage.height; y++) {
                    for (int x = 0; x < specularImage.width; x++) {
                        // LabPBR defaults: rough dielectric, no porosity/SSS,
                        // and alpha 255 so non-emissive pixels are ignored.
                        specularImage.setRGB(x, y, 0xFF000000 as int)
                    }
                }
            }

            for (int y = 0; y < emissiveImage.height; y++) {
                for (int x = 0; x < emissiveImage.width; x++) {
                    int mask = emissiveImage.getRGB(x, y)
                    int maskAlpha = (mask >>> 24) & 0xFF
                    int red = (mask >>> 16) & 0xFF
                    int green = (mask >>> 8) & 0xFF
                    int blue = mask & 0xFF
                    int brightness = Math.max(red, Math.max(green, blue))
                    if (maskAlpha == 0 || brightness == 0) {
                        continue
                    }

                    // The separate _e artwork already defines which pixels are
                    // emissive and carries their light color. Use maximum LabPBR
                    // strength so shaders produce decisive bloom instead of a
                    // merely full-bright surface.
                    int material = specularImage.getRGB(x, y)
                    specularImage.setRGB(x, y,
                            (254 << 24) | (material & 0x00FFFFFF))
                }
            }

            specularFile.parentFile.mkdirs()
            javax.imageio.ImageIO.write(specularImage, 'png', specularFile)
        }
    }
}
