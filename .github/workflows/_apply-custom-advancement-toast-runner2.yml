name: Apply Custom Advancement Toast v2

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/_apply-custom-advancement-toast-runner2.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64, json, zlib

          carrier = Path('.github/workflows/_apply-custom-advancement-toast.yml').read_text(encoding='utf-8')
          marker = "base64.b64decode('"
          start = carrier.find(marker)
          if start < 0:
              raise RuntimeError('Embedded source payload marker not found')
          start += len(marker)
          end = carrier.find("')", start)
          if end < 0:
              raise RuntimeError('Embedded source payload terminator not found')
          payload = carrier[start:end]
          files = json.loads(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
          for path, content in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def one(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Anchor missing in {path}: {old[:80]}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = 'src/main/java/net/mcreator/scpadditions/client/ClientModulePreferences.java'
          one(p, '            "ui.custom_loading_screen",\n',
              '            "ui.custom_loading_screen",\n            "ui.custom_advancement_toasts",\n')
          one(p, '        next.ui.customLoadingScreen = bool(ui, "custom_loading_screen",\n                next.ui.customLoadingScreen);\n',
              '        next.ui.customLoadingScreen = bool(ui, "custom_loading_screen",\n                next.ui.customLoadingScreen);\n        next.ui.customAdvancementToasts = bool(ui, "custom_advancement_toasts",\n                next.ui.customAdvancementToasts);\n')
          one(p, '        ui.addProperty("custom_loading_screen", value.ui.customLoadingScreen);\n',
              '        ui.addProperty("custom_loading_screen", value.ui.customLoadingScreen);\n        ui.addProperty("custom_advancement_toasts",\n                value.ui.customAdvancementToasts);\n')
          one(p, '    public static boolean customLoadingScreenEnabled() {\n        return current.ui.customLoadingScreen;\n    }\n',
              '    public static boolean customLoadingScreenEnabled() {\n        return current.ui.customLoadingScreen;\n    }\n\n    public static boolean customAdvancementToastsEnabled() {\n        return current.ui.customAdvancementToasts;\n    }\n')
          one(p, '        private boolean customLoadingScreen = true;\n',
              '        private boolean customLoadingScreen = true;\n        private boolean customAdvancementToasts = true;\n')

          p = 'src/main/java/net/mcreator/scpadditions/config/ui/CustomLoadingScreenModulesUi.java'
          one(p, '    private static final String LOADING_LABEL = "Custom Loading Screen";\n',
              '    private static final String LOADING_LABEL = "Custom Loading Screen";\n    private static final String ADVANCEMENT_LABEL = "Custom Advancement Toasts";\n')
          one(p, '            boolean needsLoading = !containsLabel(rows, LOADING_LABEL);\n            if (!needsMainMenu && !needsPauseMenu && !needsLoading) return;\n',
              '            boolean needsLoading = !containsLabel(rows, LOADING_LABEL);\n            boolean needsAdvancement = !containsLabel(rows, ADVANCEMENT_LABEL);\n            if (!needsMainMenu && !needsPauseMenu && !needsLoading\n                    && !needsAdvancement) return;\n')
          one(p, '            List<Object> expanded = new ArrayList<>(rows.size() + 3);\n',
              '            List<Object> expanded = new ArrayList<>(rows.size() + 4);\n')
          one(p, '            if (needsLoading) {\n                expanded.add(insertion, constructor.newInstance(\n                        "ui", "custom_loading_screen", LOADING_LABEL,\n                        "Replaces Minecraft\'s spawn-region loading display with the SCP Additions presentation.",\n                        true));\n            }\n',
              '            if (needsLoading) {\n                expanded.add(insertion++, constructor.newInstance(\n                        "ui", "custom_loading_screen", LOADING_LABEL,\n                        "Replaces Minecraft\'s spawn-region loading display with the SCP Additions presentation.",\n                        true));\n            }\n            if (needsAdvancement) {\n                expanded.add(insertion, constructor.newInstance(\n                        "ui", "custom_advancement_toasts", ADVANCEMENT_LABEL,\n                        "Replaces advancement popups and their vanilla sounds with the animated SCP Additions presentation.",\n                        true));\n            }\n')

          p = 'src/main/java/net/mcreator/scpadditions/ScpAdditionsMod.java'
          one(p, 'import net.mcreator.scpadditions.sound.GameplaySounds;\n',
              'import net.mcreator.scpadditions.sound.GameplaySounds;\nimport net.mcreator.scpadditions.sound.AchievementSounds;\n')
          one(p, '        GameplaySounds.REGISTRY.register(bus);\n',
              '        GameplaySounds.REGISTRY.register(bus);\n        AchievementSounds.REGISTRY.register(bus);\n')

          p = Path('src/main/resources/scp_additions.mixins.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          for entry in ('client.AdvancementToastMixin', 'client.ToastVisibilityMixin'):
              if entry not in data['client']:
                  data['client'].append(entry)
          p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          p = Path('src/main/resources/assets/scp_additions/sounds.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          if 'achievement' not in data:
              data = {'achievement': {'sounds': [{'name': 'scp_additions:achievement',
                      'stream': False, 'volume': 1.0}]}, **data}
          p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          bullet = '- Added a default-enabled **Custom Advancement Toasts** client preference that replaces vanilla advancement popups with animated SCP Additions cards, advancement icons, frame-based rarity indicators, the paired loading-logo animation, and the dedicated `achievement.ogg` cue while preserving vanilla toasts when disabled;\n'
          if bullet not in text:
              anchor = '- Added a default-enabled client-side **Disable Text Drop Shadows** preference'
              if anchor not in text:
                  raise RuntimeError('Changelog anchor missing')
              text = text.replace(anchor, bullet + anchor, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Compile
        run: ./gradlew compileJava processResources --no-daemon
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD --staged --worktree .github/workflows/_apply-custom-advancement-toast-runner2.yml
          git add src/main/java/net/mcreator/scpadditions/client/ClientModulePreferences.java
          git add src/main/java/net/mcreator/scpadditions/client/CustomAdvancementToastClient.java
          git add src/main/java/net/mcreator/scpadditions/config/ui/CustomLoadingScreenModulesUi.java
          git add src/main/java/net/mcreator/scpadditions/mixin/client/AdvancementToastMixin.java
          git add src/main/java/net/mcreator/scpadditions/mixin/client/ToastVisibilityMixin.java
          git add src/main/java/net/mcreator/scpadditions/sound/AchievementSounds.java
          git add src/main/java/net/mcreator/scpadditions/ScpAdditionsMod.java
          git add src/main/resources/scp_additions.mixins.json
          git add src/main/resources/assets/scp_additions/sounds.json
          git add CHANGELOG.md
          git commit -m "Add custom advancement toast presentation"
          git push origin HEAD:master
