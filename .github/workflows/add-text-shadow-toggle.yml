name: Add client text shadow preference

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  implement:
    if: contains(github.event.head_commit.message, '[text-shadow-toggle]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Implement text shadow preference
        shell: bash
        run: |
          cat > /tmp/add_text_shadow.py <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing patch marker in {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, count), encoding='utf-8')

          replace('settings.gradle',
              "        gradlePluginPortal()\n        maven {\n            name = 'MinecraftForge'",
              "        gradlePluginPortal()\n        maven {\n            name = 'SpongePowered'\n            url = 'https://repo.spongepowered.org/repository/maven-public/'\n        }\n        maven {\n            name = 'MinecraftForge'")

          replace('build.gradle',
              "    id 'net.minecraftforge.gradle' version '[6.0,6.2)'\n}",
              "    id 'net.minecraftforge.gradle' version '[6.0,6.2)'\n    id 'org.spongepowered.mixin' version '0.7.+'\n}")
          replace('build.gradle',
              "repositories {\n    maven {\n        name = 'GeckoLib'",
              "repositories {\n    maven {\n        name = 'SpongePowered'\n        url = 'https://repo.spongepowered.org/repository/maven-public/'\n    }\n\n    maven {\n        name = 'GeckoLib'")
          replace('build.gradle',
              "    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')\n",
              "    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')\n    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'\n")
          mixin_block = "\nmixin {\n    add sourceSets.main, 'scp_additions.refmap.json'\n    config 'scp_additions.mixins.json'\n}\n"
          replace('build.gradle', "\nrepositories {\n",
              mixin_block + "\nrepositories {\n")

          prefs = 'src/main/java/net/mcreator/scpadditions/client/ClientModulePreferences.java'
          replace(prefs,
              '            "hud.action_bars_roboto",\n',
              '            "hud.action_bars_roboto",\n            "hud.disable_text_drop_shadows",\n')
          replace(prefs,
              '        next.hud.actionBarsRoboto = bool(hud, "action_bars_roboto",\n                next.hud.actionBarsRoboto);\n',
              '        next.hud.actionBarsRoboto = bool(hud, "action_bars_roboto",\n                next.hud.actionBarsRoboto);\n        next.hud.disableTextDropShadows = bool(hud,\n                "disable_text_drop_shadows",\n                next.hud.disableTextDropShadows);\n')
          replace(prefs,
              '        hud.addProperty("action_bars_roboto", value.hud.actionBarsRoboto);\n',
              '        hud.addProperty("action_bars_roboto", value.hud.actionBarsRoboto);\n        hud.addProperty("disable_text_drop_shadows",\n                value.hud.disableTextDropShadows);\n')
          replace(prefs,
              '    public static boolean mainMenuMusicEnabled() {\n        return current.audio.mainMenuMusicEnabled;\n    }\n',
              '    public static boolean mainMenuMusicEnabled() {\n        return current.audio.mainMenuMusicEnabled;\n    }\n\n    public static boolean disableTextDropShadows() {\n        return current.hud.disableTextDropShadows;\n    }\n')
          replace(prefs,
              '        private boolean actionBarsRoboto = true;\n',
              '        private boolean actionBarsRoboto = true;\n        private boolean disableTextDropShadows = true;\n')

          modules_config = 'src/main/java/net/mcreator/scpadditions/config/ScpAdditionsModulesConfig.java'
          replace(modules_config,
              '\t\t@SerializedName("action_bars_roboto")\n\t\tpublic boolean actionBarsRoboto = true;\n',
              '\t\t@SerializedName("action_bars_roboto")\n\t\tpublic boolean actionBarsRoboto = true;\n\n\t\t@SerializedName("disable_text_drop_shadows")\n\t\tpublic boolean disableTextDropShadows = true;\n')

          modules_json = Path('config/scpadditions/modules.json')
          text = modules_json.read_text(encoding='utf-8')
          old = '    "custom_oxygen_bar": true,\n    "action_bars_roboto": true\n'
          new = '    "custom_oxygen_bar": true,\n    "action_bars_roboto": true,\n    "disable_text_drop_shadows": true\n'
          if old not in text:
              raise SystemExit('modules.json HUD marker not found')
          modules_json.write_text(text.replace(old, new, 1), encoding='utf-8')

          ui = 'src/main/java/net/mcreator/scpadditions/config/ui/AdditionalGameplayModulesUi.java'
          marker = ('            if (!labels.contains("Custom Oxygen Bar")) {\n'
                    '                additions.add(constructor.newInstance(\n'
                    '                        "hud", "custom_oxygen_bar", "Custom Oxygen Bar",\n'
                    '                        "Replaces vanilla air bubbles with a centered survival-horror oxygen meter.",\n'
                    '                        true));\n'
                    '            }\n')
          addition = marker + ('            if (!labels.contains("Disable Text Drop Shadows")) {\n'
                    '                additions.add(constructor.newInstance(\n'
                    '                        "hud", "disable_text_drop_shadows",\n'
                    '                        "Disable Text Drop Shadows",\n'
                    '                        "Removes Minecraft\'s dark offset shadow from rendered text while preserving the text itself.",\n'
                    '                        true));\n'
                    '            }\n')
          replace(ui, marker, addition)

          mixin_dir = Path('src/main/java/net/mcreator/scpadditions/mixin/client')
          mixin_dir.mkdir(parents=True, exist_ok=True)
          font_mixin = """package net.mcreator.scpadditions.mixin.client;

          import net.minecraft.client.gui.Font;
          import net.mcreator.scpadditions.client.ClientModulePreferences;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.ModifyVariable;

          /** Removes the shadow pass from normal Minecraft text when the personal toggle is enabled. */
          @Mixin(Font.class)
          public abstract class FontMixin {
              @ModifyVariable(
                      method = "drawInternal(Ljava/lang/String;FFIZLorg/joml/Matrix4f;Lnet/minecraft/client/renderer/MultiBufferSource;Lnet/minecraft/client/gui/Font$DisplayMode;IIZ)I",
                      at = @At("HEAD"), argsOnly = true, ordinal = 0)
              private boolean scpAdditions$disableStringShadow(boolean dropShadow) {
                  return ClientModulePreferences.disableTextDropShadows()
                          ? false : dropShadow;
              }

              @ModifyVariable(
                      method = "drawInternal(Lnet/minecraft/util/FormattedCharSequence;FFIZLorg/joml/Matrix4f;Lnet/minecraft/client/renderer/MultiBufferSource;Lnet/minecraft/client/gui/Font$DisplayMode;II)I",
                      at = @At("HEAD"), argsOnly = true, ordinal = 0)
              private boolean scpAdditions$disableFormattedShadow(boolean dropShadow) {
                  return ClientModulePreferences.disableTextDropShadows()
                          ? false : dropShadow;
              }
          }
          """
          font_mixin = '\n'.join(line[10:] if line.startswith('          ') else line
                                 for line in font_mixin.splitlines()) + '\n'
          (mixin_dir / 'FontMixin.java').write_text(font_mixin, encoding='utf-8')

          mixin_json = """{
            "required": true,
            "minVersion": "0.8",
            "package": "net.mcreator.scpadditions.mixin",
            "compatibilityLevel": "JAVA_17",
            "refmap": "scp_additions.refmap.json",
            "client": [
              "client.FontMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          """
          mixin_json = '\n'.join(line[10:] if line.startswith('          ') else line
                                 for line in mixin_json.splitlines()) + '\n'
          Path('src/main/resources/scp_additions.mixins.json').write_text(
              mixin_json, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## Interface and presentation\n\n'
          entry = ('- Added a default-enabled client-side **Disable Text Drop Shadows** preference '
                   'that removes Minecraft\'s dark offset shadow pass from rendered text without '
                   'changing font, color, or layout;\n')
          if marker not in text:
              raise SystemExit('CHANGELOG interface marker not found')
          if entry not in text:
              text = text.replace(marker, marker + entry, 1)
          changelog.write_text(text, encoding='utf-8')
          PY
          python3 /tmp/add_text_shadow.py
          rm -f .github/workflows/add-text-shadow-toggle.yml

      - name: Build final tree
        run: ./gradlew clean build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Add client text shadow preference"
          git push origin HEAD:master
