name: Temporary read-only resource audit
on:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize temporary scanner for large repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/temp_unused_resource_audit.py')
          source = path.read_text()
          old = '    for source, content in text_files.items():\n'
          new = "    for source, content in {'repository': all_text}.items():\n"
          assert source.count(old) == 1
          source = source.replace(old, new)
          source = source.replace("counts = collections.Counter()", "all_text = '\\n'.join(text_files.values())\ncounts = collections.Counter()", 1)
          path.write_text(source)
          PY
      - name: Inventory potential unused game assets without modifying files
        run: python3 .github/scripts/temp_unused_resource_audit.py
