name: Apply Facility Creative Tab Reorganization

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply reorganization
        run: python3 scripts/apply_facility_tab_reorganization.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Commit validated source
        shell: bash
        run: |
          rm scripts/apply_facility_tab_reorganization.py
          git config user.name "Bl4ues"
          git config user.email "28213049+Bl4ues@users.noreply.github.com"
          git add -A
          git commit -m "Promote 3.1.0 and organize facility creative tabs"
          git push origin HEAD:agent/3.1-facility-tabs
