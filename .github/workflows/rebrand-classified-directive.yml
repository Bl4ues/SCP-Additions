name: Classified Directive Rebrand

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/rebrand_classified_directive.py'
      - 'scripts/rebrand_classified_directive_compat.py'
      - '.github/workflows/rebrand-classified-directive.yml'

permissions:
  contents: write

concurrency:
  group: classified-directive-rebrand
  cancel-in-progress: true

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to current master
        run: |
          git fetch origin master
          git reset --hard origin/master

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run migration
        run: |
          python3 scripts/rebrand_classified_directive.py
          python3 scripts/rebrand_classified_directive_compat.py

      - name: Remove one-shot migration files
        run: |
          rm scripts/rebrand_classified_directive.py
          rm scripts/rebrand_classified_directive_compat.py
          rm .github/workflows/rebrand-classified-directive.yml

      - name: Validate migrated build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Commit migrated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand as SCP: Classified Directive"

      - name: Rebase onto current master and revalidate
        run: |
          git fetch origin master
          git rebase origin/master
          ./gradlew clean build --stacktrace

      - name: Push rebrand to master
        run: git push origin HEAD:master
