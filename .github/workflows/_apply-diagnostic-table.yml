name: Apply Archivist Table and UI fixes

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested fixes
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one occurrence of {old!r}, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Loading cards: rotate every 25 seconds instead of 60.
          replace_once(
              'src/main/java/net/mcreator/scpadditions/client/CustomWorldLoadingScreenClient.java',
              'private static final long CARD_LIFETIME_MS = 60_000L;',
              'private static final long CARD_LIFETIME_MS = 25_000L;')

          # Achievements: vertically center root titles and the title/description block with their 16px icons.
          pause_path = Path('src/main/java/net/mcreator/scpadditions/client/PauseMenuNativePanelsClient.java')
          pause = pause_path.read_text(encoding='utf-8')
          replacements = [
              ('layout.sidebarX + 29, y + 7,', 'layout.sidebarX + 29, y + 9,'),
              ('ScpFonts.roboto(title), textX, y + 7,', 'ScpFonts.roboto(title), textX, y + 9,'),
              ('textX, y + 23, applyAlpha(MUTED, alpha), false);', 'textX, y + 24, applyAlpha(MUTED, alpha), false);'),
              ('layout.contentRight - 10 - font.width(status), y + 7,', 'layout.contentRight - 10 - font.width(status), y + 9,'),
          ]
          for old, new in replacements:
              count = pause.count(old)
              if count != 1:
                  raise RuntimeError(f'PauseMenuNativePanelsClient.java: expected one occurrence of {old!r}, found {count}')
              pause = pause.replace(old, new, 1)
          pause_path.write_text(pause, encoding='utf-8')

          # Preserve the registry ID for world compatibility; only the player-facing name changes.
          lang_path = Path('src/main/resources/assets/scp_additions/lang/en_us.json')
          lang = lang_path.read_text(encoding='utf-8')
          old_lang = '"block.scp_additions.diagnostic_table": "Diagnostic Table"'
          new_lang = '"block.scp_additions.diagnostic_table": "Archivist\'s Table"'
          if old_lang not in lang:
              raise RuntimeError('Diagnostic Table translation entry was not found')
          lang_path.write_text(lang.replace(old_lang, new_lang, 1), encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          changelog = changelog.replace('**Diagnostic Table**', "**Archivist's Table**")
          changelog_path.write_text(changelog, encoding='utf-8')

          # Fix coplanar decorative planes exported by Blockbench. Minecraft renders both
          # opposing faces of a zero-thickness cuboid on the exact same plane, which causes
          # the paper/desk props to fight with themselves. Give only above-desk decorative
          # planes a microscopic 0.01 model-unit thickness.
          model_path = Path('src/main/resources/assets/scp_additions/models/block/diagnostic_table.json')
          model = json.loads(model_path.read_text(encoding='utf-8'))
          fixed_planes = 0
          for element in model.get('elements', []):
              frm = element.get('from')
              to = element.get('to')
              if not (isinstance(frm, list) and isinstance(to, list) and len(frm) == 3 and len(to) == 3):
                  continue
              if max(float(frm[1]), float(to[1])) <= 16.0:
                  continue
              for axis in range(3):
                  if abs(float(to[axis]) - float(frm[axis])) < 1.0e-9:
                      to[axis] = round(float(to[axis]) + 0.01, 5)
                      fixed_planes += 1

          # Move the complete table 1 cm toward its front. One Minecraft block is treated
          # as one metre here, so 1 cm = 0.16 of the model's 16-units-per-block coordinates.
          for element in model.get('elements', []):
              for key in ('from', 'to'):
                  point = element.get(key)
                  if isinstance(point, list) and len(point) == 3:
                      point[2] = round(float(point[2]) - 0.16, 5)
              rotation = element.get('rotation')
              if isinstance(rotation, dict):
                  origin = rotation.get('origin')
                  if isinstance(origin, list) and len(origin) == 3:
                      origin[2] = round(float(origin[2]) - 0.16, 5)
          model_path.write_text(json.dumps(model, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'Fixed {fixed_planes} zero-thickness decorative axes in diagnostic_table.json')

          # Keep the model-derived multipart collision aligned with the 1 cm visual shift.
          facility_path = Path('src/main/java/net/mcreator/scpadditions/facility/FacilityModule.java')
          facility = facility_path.read_text(encoding='utf-8')
          class_start = facility.index('private static final class DiagnosticTableBlock')
          brace_start = facility.index('{', class_start)
          depth = 0
          class_end = None
          for index in range(brace_start, len(facility)):
              char = facility[index]
              if char == '{':
                  depth += 1
              elif char == '}':
                  depth -= 1
                  if depth == 0:
                      class_end = index + 1
                      break
          if class_end is None:
              raise RuntimeError('Could not isolate DiagnosticTableBlock')
          block = facility[class_start:class_end]

          number = re.compile(r'^\s*(-?\d+(?:\.\d+)?)D\s*$')
          changed_boxes = 0
          def shift_box(match):
              nonlocal_holder[0] += 1
              args = [part.strip() for part in match.group(1).split(',')]
              if len(args) != 6:
                  return match.group(0)
              for idx in (2, 5):
                  parsed = number.match(args[idx])
                  if not parsed:
                      raise RuntimeError(f'Unexpected DiagnosticTableBlock box coordinate: {args[idx]}')
                  value = float(parsed.group(1)) - 0.16
                  rendered = f'{value:.2f}'.rstrip('0').rstrip('.')
                  if '.' not in rendered:
                      rendered += '.0'
                  args[idx] = rendered + 'D'
              return 'box(' + ', '.join(args) + ')'

          nonlocal_holder = [0]
          shifted = re.sub(r'box\(([^\)]*)\)', shift_box, block)
          changed_boxes = nonlocal_holder[0]
          if changed_boxes < 3:
              raise RuntimeError(f'Expected DiagnosticTableBlock collision boxes, changed only {changed_boxes}')
          facility = facility[:class_start] + shifted + facility[class_end:]
          facility_path.write_text(facility, encoding='utf-8')
          print(f'Shifted {changed_boxes} DiagnosticTableBlock collision boxes')

      - name: Compile Java
        run: ./gradlew compileJava --no-daemon

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md \
            src/main/java/net/mcreator/scpadditions/client/CustomWorldLoadingScreenClient.java \
            src/main/java/net/mcreator/scpadditions/client/PauseMenuNativePanelsClient.java \
            src/main/java/net/mcreator/scpadditions/facility/FacilityModule.java \
            src/main/resources/assets/scp_additions/lang/en_us.json \
            src/main/resources/assets/scp_additions/models/block/diagnostic_table.json
          git diff --cached --check
          git commit -m "Refine Archivist's Table and pause UI"
          git push
