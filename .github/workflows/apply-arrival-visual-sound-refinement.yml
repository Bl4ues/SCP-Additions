name: Apply arrival visual and sound refinement

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/refine-arrival-display-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply refinement
        run: |
          python tools/hotfix/apply_arrival_visual_and_sound_refinement.py
          rm -f tools/hotfix/apply_arrival_visual_and_sound_refinement.py
          rm -f tools/hotfix/APPLY_ARRIVAL_VISUAL_AND_SOUND_REFINEMENT
          git show origin/master:.github/workflows/build.yml > .github/workflows/build.yml

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine elevator arrival display and add zone splash cue"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
