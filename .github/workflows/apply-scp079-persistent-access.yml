name: Apply SCP-079 persistent access

on:
  push:
    branches:
      - feature/scp079-persistent-access-reindex
    paths:
      - .github/workflows/apply-scp079-persistent-access.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/scp079-persistent-access-reindex
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply implementation
        run: python3 tools/hotfix/apply_scp079_persistent_access.py

      - name: Remove temporary integration files
        run: |
          rm -f tools/hotfix/apply_scp079_persistent_access.py
          rm -f .github/workflows/apply-scp079-persistent-access.yml

      - name: Build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Commit implementation
        run: |
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git commit -m "Refine SCP-079 auxiliary isolation and SCiPNET reindexing"
          git push origin HEAD:feature/scp079-persistent-access-reindex
