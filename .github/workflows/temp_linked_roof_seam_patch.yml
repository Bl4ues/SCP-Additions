name: Validate linked roof seam correction
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply linked roof seam patch
        run: python3 .github/scripts/temp_linked_roof_seam_patch.py
      - name: Verify project integrity
        run: python3 .github/scripts/verify_project_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run available tests
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Commit validated geometry changes to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/ConstructionSurface.java
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Keep linked roof contact vertices and adjacent mesh cuts consistent'
          git fetch origin master
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/master)"
          git push origin HEAD:master
