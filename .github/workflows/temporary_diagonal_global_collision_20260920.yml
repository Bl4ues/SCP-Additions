name: Validate diagonal passage across transformed owners
on:
  push:
    paths:
      - .github/workflows/temporary_diagonal_global_collision_20260920.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply shared doorway collision patch
        run: python3 .github/scripts/temporary_diagonal_global_collision_20260920.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate full build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit validated door fixes
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformDoorwayCollision.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformConstructionManager.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientState.java
          git commit -m 'Carve open angled doorways after merging collision from every transformed owner'
          git push origin HEAD:master
