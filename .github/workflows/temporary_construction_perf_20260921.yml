name: Validate construction rendering performance changes
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/temporary_construction_perf_20260921.yml
jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - name: Apply deterministic render optimizations
        run: python3 .github/scripts/temporary_construction_perf_20260921.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify integrity and build complete mod
        run: |
          python3 .github/scripts/verify_project_integrity.py
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace
      - name: Commit only validated source changes to master
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git diff --cached --check
          git commit -m 'Cull offscreen curved surface batches and avoid redundant editor meshes'
          git push origin HEAD:master
