name: Build

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define rebuilt SCP-914 sounds
        if: github.ref == 'refs/heads/master'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('src/main/resources/assets/scp_classified_directive/sounds.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          sound_ids = ['scp914wind', 'scp914close', 'scp914open'] + [f'scp914gear_{i}' for i in range(1, 10)]
          changed = False
          for sound_id in sound_ids:
              expected = {
                  'sounds': [
                      {
                          'name': f'scp_classified_directive:{sound_id}',
                          'stream': False,
                          'volume': 1.0,
                      }
                  ]
              }
              if data.get(sound_id) != expected:
                  data[sound_id] = expected
                  changed = True

          if changed:
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          if ! git diff --quiet -- src/main/resources/assets/scp_classified_directive/sounds.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main/resources/assets/scp_classified_directive/sounds.json
            git commit -m "Define rebuilt SCP-914 sound resources"
            git push origin HEAD:master
          fi

      - name: Verify Classified Directive integrity
        run: python3 .github/scripts/verify_project_integrity.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scp-classified-directive-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
