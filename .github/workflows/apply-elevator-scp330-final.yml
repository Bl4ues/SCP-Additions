name: Apply Elevator and SCP-330 Final Repairs

on:
  push:
    branches: [ master ]
    paths:
      - '.github/elevator-scp330-final-trigger.txt'
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/elevator-scp330-final-trigger.txt'

permissions:
  contents: write

jobs:
  apply-build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply elevator and SCP-330 changes
        run: python .github/scripts/apply_elevator_scp330_final.py

      - name: Verify source and asset contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          carriage = json.loads((root / 'src/main/resources/assets/scp_additions/geo/entity/core_room_elevator_carriage.geo.json').read_text())
          cabin = carriage['minecraft:geometry'][0]['bones'][0]
          assert cabin['rotation'] == [0, -90, 0]
          assert cabin['locators']['cable_attachment_front'] == [-7, 53, 0]
          assert cabin['locators']['cable_attachment_rear'] == [7, 53, 0]
          station = json.loads((root / 'src/main/resources/assets/scp_additions/geo/block/core_room_elevator_floor_station.geo.json').read_text())
          assert 'station_glass' in [bone['name'] for bone in station['minecraft:geometry'][0]['bones']]
          scp330 = json.loads((root / 'src/main/resources/assets/scp_additions/geo/block/scp330.geo.json').read_text())
          assert scp330['minecraft:geometry'][0]['description']['identifier'] == 'geometry.scp330'
          assert scp330['minecraft:geometry'][0]['bones'][0]['name'] == 'scp330'
          required = [
              'src/main/java/net/mcreator/scpadditions/block/entity/Scp330BlockEntity.java',
              'src/main/java/net/mcreator/scpadditions/client/Scp330Client.java',
              'src/main/java/net/mcreator/scpadditions/item/Scp330CandyItem.java',
              'src/main/java/net/mcreator/scpadditions/scp330/Scp330Hands.java',
              'src/main/java/net/mcreator/scpadditions/scp330/Scp330HandsEvents.java',
              'src/main/java/net/mcreator/scpadditions/scp330/Scp330HandsClientEvents.java',
              'src/main/resources/assets/scp_additions/models/item/scp_330_pink_candy.json',
          ]
          for path in required: assert (root / path).is_file(), path
          obsolete = [
              'src/main/java/net/mcreator/scpadditions/item/Scp330RedCandyItem.java',
              'src/main/java/net/mcreator/scpadditions/item/Scp330GreenCandyItem.java',
              'src/main/java/net/mcreator/scpadditions/procedures/RedCandyProcedure.java',
              'src/main/java/net/mcreator/scpadditions/procedures/GreenCandyProcedure.java',
              'src/main/java/net/mcreator/scpadditions/procedures/BlueCandyProcedure.java',
              'src/main/java/net/mcreator/scpadditions/procedures/YellowCandyProcedure.java',
              'src/main/java/net/mcreator/scpadditions/procedures/Scp330CandyGiveProcedure.java',
              'src/main/java/net/mcreator/scpadditions/procedures/Scp330CandyClearProcedure.java',
              'src/main/resources/assets/scp_additions/models/custom/scp330.json',
          ]
          for path in obsolete: assert not (root / path).exists(), path
          context = (root / 'src/main/java/com/bl4ues/scpinventory/client/ContextPromptClient.java').read_text()
          assert 'double depth = -transformed.z();' in context
          assert 'Scp330Hands.isDisabled(player)' in context
          packet = (root / 'src/main/java/com/bl4ues/scpinventory/network/ContextInteractPacket.java').read_text()
          assert 'Scp330Hands.isDisabled(player)' in packet
          assert '## SCP-330' in (root / 'CHANGELOG.md').read_text()
          PY

      - name: Convert elevator sounds to positional mono
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          for name in elevator_door_close station_close elevator_moving elevator_door_open elevator_cabin_loop; do
            file="src/main/resources/assets/scp_additions/sounds/${name}.ogg"
            test -f "$file"
            channels=$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=nw=1:nk=1 "$file")
            if [ "$channels" != "1" ]; then
              ffmpeg -y -v error -i "$file" -ac 1 -c:a libvorbis -q:a 6 "${file}.mono.ogg"
              mv "${file}.mono.ogg" "$file"
            fi
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=nw=1:nk=1 "$file")" = "1"
          done

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Remove temporary integration tooling
        run: |
          rm -f .github/scripts/apply_elevator_scp330_final.py
          rm -f .github/workflows/apply-elevator-scp330-final.yml
          rm -f .github/elevator-scp330-final-trigger.txt

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Core Room elevator and rebuild SCP-330'
          git push origin HEAD:master
