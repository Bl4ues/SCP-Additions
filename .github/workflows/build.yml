name: Build

on:
  push:
    branches:
      - master
      - integration/scp-additions-3.0
      - 'feature/**'
  pull_request:
    branches:
      - master
      - integration/scp-additions-3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/scp106-ranged-audio-debug-order
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply SCP-106 fixes and animation
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          raw = Path('.github/workflows/apply-scp106-ranged-test-fixes.yml').read_text()
          start_marker = '        run: |\n'
          start = raw.index(start_marker, raw.index('      - name: Apply fixes')) + len(start_marker)
          end = raw.index('\n      - name: Build', start)
          lines = []
          for line in raw[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-scp106-ranged.sh').write_text('set -e\n' + '\n'.join(lines) + '\n')
          PY

          set +e
          bash -e /tmp/apply-scp106-ranged.sh > /tmp/scp106-ranged-patch.log 2>&1
          patch_status=$?
          set -e
          cat /tmp/scp106-ranged-patch.log
          if [ "$patch_status" != "0" ] && ! grep -q "ranged_attack animation is missing" /tmp/scp106-ranged-patch.log; then
            exit "$patch_status"
          fi

          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected wall-emergence block not found in {path}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'src/main/java/net/mcreator/scpadditions/roamer/Scp106EmergenceLocator.java',
              '''            // emerge_wall is authored opposite the normal entity forward axis.
            float wallYaw = Mth.wrapDegrees(yawFor(outward.getStepX(),
                    outward.getStepZ()) + 180.0F);
            return new Placement(center, wallYaw, Emergence.WALL);''',
              '''            // Face the open side of the wall. The animation moves from
            // behind the model toward this final position, so no extra yaw
            // compensation is needed.
            float wallYaw = yawFor(outward.getStepX(), outward.getStepZ());
            return new Placement(center, wallYaw, Emergence.WALL);''')

          replace(
              'src/main/java/net/mcreator/scpadditions/event/Scp106SurfaceEvents.java',
              '''        // The wall emergence animation moves opposite the model's ordinary
        // forward axis, so its real surface normal is the inverse direction.
        Vec3 outward = modelForward.scale(-1.0D);''',
              '''        // The model faces away from the wall. Its ordinary forward
        // vector is therefore the outward surface normal.
        Vec3 outward = modelForward;''')

          animation_path = Path(
              'src/main/resources/assets/scp_additions/animations/entity/scp106.animation.json')
          root = json.loads(animation_path.read_text(encoding='utf-8'))
          animations = root.setdefault('animations', {})

          def frame(vector, mode='catmullrom'):
              return {'post': {'vector': vector}, 'lerp_mode': mode}

          animations['ranged_attack'] = {
              'loop': False,
              'animation_length': 3.45,
              'bones': {
                  '106': {
                      'position': {
                          '0.0': frame([0, 0, 0]),
                          '0.55': frame([0.05, -1.4, 0.10]),
                          '1.20': frame([0.12, -3.7, 0.28]),
                          '1.75': frame([0.18, -4.8, 0.42]),
                          '2.00': frame([0.16, -5.1, 0.48]),
                          '2.10': frame([0.02, -5.3, -0.72], 'linear'),
                          '2.28': frame([-0.08, -4.5, -1.05]),
                          '2.72': frame([0.0, -2.2, -0.35]),
                          '3.45': frame([0, 0, 0])
                      }
                  },
                  'head': {
                      'rotation': {
                          '0.0': frame([22.5, 0, -12.5]),
                          '0.75': frame([16, 0, -11]),
                          '1.65': frame([8, 0, -8]),
                          '2.00': frame([5, 0, -6]),
                          '2.10': frame([18, 0, -10], 'linear'),
                          '2.45': frame([25, 0, -13]),
                          '3.45': frame([22.5, 0, -12.5])
                      }
                  },
                  'body': {
                      'rotation': {
                          '0.0': frame([5, 0, -5]),
                          '0.70': frame([14, 0, -5]),
                          '1.55': frame([26, -2, -4]),
                          '2.00': frame([31, -3, -3]),
                          '2.10': frame([18, 4, -6], 'linear'),
                          '2.35': frame([9, 7, -7]),
                          '2.85': frame([6, 2, -5]),
                          '3.45': frame([5, 0, -5])
                      }
                  },
                  'torso': {
                      'rotation': {
                          '0.0': frame([-7.5, 0, 5]),
                          '0.70': frame([-15, 0, 5]),
                          '1.55': frame([-25, 2, 4]),
                          '2.00': frame([-29, 3, 3]),
                          '2.10': frame([-17, -4, 6], 'linear'),
                          '2.35': frame([-10, -7, 7]),
                          '2.85': frame([-8, -2, 5]),
                          '3.45': frame([-7.5, 0, 5])
                      }
                  },
                  'right_arm': {
                      'rotation': {
                          '0.0': frame([2.5, 0, 7.5]),
                          '0.65': frame([-12, -5, 12]),
                          '1.35': frame([-43, -12, 20]),
                          '1.90': frame([-62, -18, 25]),
                          '2.00': frame([-70, -20, 27]),
                          '2.10': frame([58, 4, 4], 'linear'),
                          '2.25': frame([92, 10, -5]),
                          '2.55': frame([66, 7, 0]),
                          '2.95': frame([18, 2, 6]),
                          '3.45': frame([2.5, 0, 7.5])
                      },
                      'position': {
                          '0.0': frame([0, 0, 0]),
                          '1.90': frame([0.1, -0.2, 0.35]),
                          '2.10': frame([0.0, -0.4, -0.85], 'linear'),
                          '2.55': frame([0, -0.15, -0.25]),
                          '3.45': frame([0, 0, 0])
                      }
                  },
                  'right_hand': {
                      'rotation': {
                          '0.0': frame([-7.5, 0, 0]),
                          '1.35': frame([-32, 0, 6]),
                          '2.00': frame([-58, 0, 10]),
                          '2.10': frame([24, 0, -6], 'linear'),
                          '2.30': frame([38, 0, -10]),
                          '2.70': frame([6, 0, -2]),
                          '3.45': frame([-7.5, 0, 0])
                      }
                  },
                  'left_arm': {
                      'rotation': {
                          '0.0': frame([-2.5, 0, 0]),
                          '0.80': frame([12, 5, -6]),
                          '1.70': frame([28, 12, -12]),
                          '2.10': frame([18, -4, -8], 'linear'),
                          '2.55': frame([8, -6, -3]),
                          '3.45': frame([-2.5, 0, 0])
                      },
                      'position': {
                          '0.0': frame([0, -0.5, 0]),
                          '2.10': frame([0, -0.7, -0.15]),
                          '3.45': frame([0, -0.5, 0])
                      }
                  },
                  'left_hand': {
                      'rotation': {
                          '0.0': frame([-2.5, 0, 0]),
                          '1.70': frame([-22, 0, 0]),
                          '2.10': frame([-8, 0, 0], 'linear'),
                          '3.45': frame([-2.5, 0, 0])
                      }
                  },
                  'right_leg': {
                      'rotation': {
                          '0.0': frame([0, 0, 5]),
                          '0.75': frame([18, 0, 5]),
                          '1.65': frame([35, 0, 4]),
                          '2.10': frame([42, 0, 3]),
                          '2.65': frame([18, 0, 4]),
                          '3.45': frame([0, 0, 5])
                      }
                  },
                  'left_leg': {
                      'rotation': {
                          '0.0': frame([-2.5, 0, -5]),
                          '0.75': frame([16, 0, -5]),
                          '1.65': frame([33, 0, -4]),
                          '2.10': frame([40, 0, -3]),
                          '2.65': frame([16, 0, -4]),
                          '3.45': frame([-2.5, 0, -5])
                      }
                  },
                  'right_feet': {
                      'rotation': {
                          '0.0': frame([2.5, 0, 0]),
                          '1.65': frame([-18, 0, 0]),
                          '2.10': frame([-24, 0, 0]),
                          '2.65': frame([-5, 0, 0]),
                          '3.45': frame([2.5, 0, 0])
                      }
                  },
                  'left_feet': {
                      'rotation': {
                          '0.0': frame([7.5, 0, 0]),
                          '1.65': frame([-14, 0, 0]),
                          '2.10': frame([-20, 0, 0]),
                          '2.65': frame([-2, 0, 0]),
                          '3.45': frame([7.5, 0, 0])
                      }
                  }
              }
          }

          animation_path.write_text(json.dumps(root, ensure_ascii=False,
                  separators=(',', ':')), encoding='utf-8')
          print('Added ranged_attack animation with',
                  len(animations['ranged_attack']['bones']), 'animated bones')
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Commit implementation
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine SCP-106 ranged attack and emergence"
          git push origin HEAD:fix/scp106-ranged-audio-debug-order

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scp-additions-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
