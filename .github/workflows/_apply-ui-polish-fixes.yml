name: Apply achievement and chair UI polish fixes

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/_apply-ui-polish-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Apply requested polish fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import shutil

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          # Archivist's Chair: keep the corrected shape but move it slightly right.
          chair = 'src/main/java/net/mcreator/scpadditions/facility/ArchivistsChairBlock.java'
          replace_exact(
              chair,
              '    private static final double MODEL_ORIGIN = 8.0D;\n',
              '    private static final double MODEL_ORIGIN_X = 10.0D;\n'
              '    private static final double MODEL_ORIGIN_Z = 8.0D;\n')
          replace_exact(
              chair,
              '        return box(minX + MODEL_ORIGIN, minY, minZ + MODEL_ORIGIN,\n'
              '                maxX + MODEL_ORIGIN, maxY, maxZ + MODEL_ORIGIN);',
              '        return box(minX + MODEL_ORIGIN_X, minY, minZ + MODEL_ORIGIN_Z,\n'
              '                maxX + MODEL_ORIGIN_X, maxY, maxZ + MODEL_ORIGIN_Z);')
          replace_exact(
              chair,
              ' * therefore shifted by eight model units on X/Z before it is rotated with the\n',
              ' * therefore uses independent X/Z offsets before it is rotated with the\n')

          # Chat input: shift the frame upward two pixels around the unchanged EditBox,
          # which visually centers the typed text and prompt inside the field.
          chat_layout = 'src/main/java/net/mcreator/scpadditions/client/FacilityChatLayout.java'
          replace_exact(
              chat_layout,
              '        int top = input.getY() - 2;\n'
              '        int bottom = input.getY() + input.getHeight() + 2;\n',
              '        int top = input.getY() - 4;\n'
              '        int bottom = input.getY() + input.getHeight();\n')

          # Minecraft Font forces extremely low-alpha text back to opaque. Stop drawing
          # toast text below that threshold so the whole card actually fades cleanly.
          toast = 'src/main/java/net/mcreator/scpadditions/client/CustomAdvancementToastClient.java'
          replace_exact(
              toast,
              '        renderIcon(graphics, display.getIcon(), iconLeft, iconTop, alpha);\n\n'
              '        int textLeft = left + 50;\n',
              '        renderIcon(graphics, display.getIcon(), iconLeft, iconTop, alpha);\n\n'
              '        // Font.adjustColor treats near-zero alpha as opaque. Avoid the\n'
              '        // resulting text flash at the very beginning/end of the toast.\n'
              '        if (alpha < 0.025F) return;\n\n'
              '        int textLeft = left + 50;\n')

          # Achievement panel: retain each advancement frame, use the mod logo for the
          # root row too, and mirror the toast rarity blocks beneath OPEN/DONE.
          achievements = 'src/main/java/net/mcreator/scpadditions/client/PauseMenuNativePanelsClient.java'
          replace_exact(
              achievements,
              'import com.mojang.blaze3d.systems.RenderSystem;\nimport net.minecraft.Util;\n',
              'import com.mojang.blaze3d.systems.RenderSystem;\nimport net.minecraft.Util;\nimport net.minecraft.advancements.FrameType;\n')
          replace_exact(
              achievements,
              '    private static final int TRACK = 0x563D4652;\n',
              '    private static final int TRACK = 0x563D4652;\n'
              '    private static final int TASK = 0xFF79D58B;\n'
              '    private static final int GOAL = 0xFFC99B18;\n'
              '    private static final int CHALLENGE = 0xFFFF7373;\n')
          replace_exact(
              achievements,
              '                Component title = component(invokeNoArg(display, "getTitle"),\n'
              '                        humanize(idOf(advancement)));\n'
              '                Component description = component(\n'
              '                        invokeNoArg(display, "getDescription"), "");\n'
              '                ItemStack icon = itemStack(invokeNoArg(display, "getIcon"));\n'
              '                byRoot.get(root).add(new AdvancementRow(title, description,\n'
              '                        icon, done));\n',
              '                String advancementId = idOf(advancement);\n'
              '                Component title = component(invokeNoArg(display, "getTitle"),\n'
              '                        humanize(advancementId));\n'
              '                Component description = component(\n'
              '                        invokeNoArg(display, "getDescription"), "");\n'
              '                ItemStack icon = itemStack(invokeNoArg(display, "getIcon"));\n'
              '                FrameType frame = frameType(invokeNoArg(display, "getFrame"));\n'
              '                boolean useModLogo = (ScpAdditionsMod.MODID\n'
              '                        + ":scp_additions_ach").equals(advancementId);\n'
              '                byRoot.get(root).add(new AdvancementRow(title, description,\n'
              '                        icon, done, frame, useModLogo));\n')
          replace_exact(
              achievements,
              '            if (!entry.icon.isEmpty()) graphics.renderItem(entry.icon,\n'
              '                    layout.contentX + 9, y + 13);\n'
              '            int textX = layout.contentX + 34;\n'
              '            String title = compactToWidth(font, entry.title.getString(),\n'
              '                    layout.contentRight - textX - 78);\n',
              '            if (entry.useModLogo) {\n'
              '                renderScpAdditionsLogo(graphics, layout.contentX + 9,\n'
              '                        y + 13, alpha);\n'
              '            } else if (!entry.icon.isEmpty()) {\n'
              '                graphics.renderItem(entry.icon, layout.contentX + 9, y + 13);\n'
              '            }\n'
              '            int textX = layout.contentX + 34;\n'
              '            String title = compactToWidth(font, entry.title.getString(),\n'
              '                    layout.contentRight - textX - 86);\n')
          replace_exact(
              achievements,
              '            String description = compactToWidth(font,\n'
              '                    entry.description.getString(),\n'
              '                    layout.contentRight - textX - 12);\n',
              '            String description = compactToWidth(font,\n'
              '                    entry.description.getString(),\n'
              '                    layout.contentRight - textX - 86);\n')
          replace_exact(
              achievements,
              '            graphics.drawString(font, status,\n'
              '                    layout.contentRight - 10 - font.width(status), y + 9,\n'
              '                    applyAlpha(entry.done ? ACCENT_BRIGHT : MUTED, alpha), false);\n',
              '            graphics.drawString(font, status,\n'
              '                    layout.contentRight - 10 - font.width(status), y + 9,\n'
              '                    applyAlpha(entry.done ? ACCENT_BRIGHT : MUTED, alpha), false);\n'
              '            drawAchievementRarity(graphics, entry.frame,\n'
              '                    layout.contentRight - 10, y + 26, alpha);\n')
          replace_exact(
              achievements,
              '    private static void handleAchievementClick(State state,\n',
              '    private static void drawAchievementRarity(GuiGraphics graphics,\n'
              '            FrameType frame, int right, int y, float alpha) {\n'
              '        int filled;\n'
              '        int color;\n'
              '        if (frame == FrameType.CHALLENGE) {\n'
              '            filled = 5;\n'
              '            color = CHALLENGE;\n'
              '        } else if (frame == FrameType.GOAL) {\n'
              '            filled = 3;\n'
              '            color = GOAL;\n'
              '        } else {\n'
              '            filled = 1;\n'
              '            color = TASK;\n'
              '        }\n\n'
              '        int blockWidth = 4;\n'
              '        int blockHeight = 2;\n'
              '        int gap = 1;\n'
              '        int total = blockWidth * 5 + gap * 4;\n'
              '        int left = right - total;\n'
              '        for (int index = 0; index < 5; index++) {\n'
              '            int x = left + index * (blockWidth + gap);\n'
              '            graphics.fill(x, y, x + blockWidth, y + blockHeight,\n'
              '                    index < filled\n'
              '                            ? applyAlpha(color, alpha * 0.78F)\n'
              '                            : applyAlpha(TRACK, alpha * 0.52F));\n'
              '        }\n'
              '    }\n\n'
              '    private static void handleAchievementClick(State state,\n')
          replace_exact(
              achievements,
              '    private static ItemStack itemStack(Object value) {\n'
              '        return value instanceof ItemStack stack ? stack : ItemStack.EMPTY;\n'
              '    }\n',
              '    private static ItemStack itemStack(Object value) {\n'
              '        return value instanceof ItemStack stack ? stack : ItemStack.EMPTY;\n'
              '    }\n\n'
              '    private static FrameType frameType(Object value) {\n'
              '        return value instanceof FrameType frame ? frame : FrameType.TASK;\n'
              '    }\n')
          replace_exact(
              achievements,
              '    private record AdvancementRow(Component title, Component description,\n'
              '            ItemStack icon, boolean done) {\n'
              '    }\n',
              '    private record AdvancementRow(Component title, Component description,\n'
              '            ItemStack icon, boolean done, FrameType frame,\n'
              '            boolean useModLogo) {\n'
              '    }\n')

          # Make the logo item model resolve from an ordinary item texture path.
          logo_model = Path('src/main/resources/assets/scp_additions/models/item/scp_additions_logo.json')
          logo_data = json.loads(logo_model.read_text())
          logo_data['textures']['layer0'] = 'scp_additions:item/scp_additions_logo'
          logo_model.write_text(json.dumps(logo_data, indent=2) + '\n')
          src_logo = Path('src/main/resources/assets/scp_additions/textures/screens/logo.png')
          dst_logo = Path('src/main/resources/assets/scp_additions/textures/item/scp_additions_logo.png')
          dst_logo.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(src_logo, dst_logo)

          # Normalize achievement copy. Keep punctuation such as question marks, but no
          # trailing full stops/ellipses in descriptions.
          lang_path = Path('src/main/resources/assets/scp_additions/lang/en_us.json')
          lang = json.loads(lang_path.read_text())
          lang['advancements.tesla.title'] = 'Fatal Discharge'
          lang['advancements.tesla.descr'] = 'Be killed by a Tesla Gate discharge'
          lang['advancements.scp_additions_ach.descr'] = 'Unravel the secrets of the Foundation'
          for key, value in list(lang.items()):
              if key.startswith('advancements.') and key.endswith('.descr') and isinstance(value, str):
                  lang[key] = value.rstrip('.')
          lang_path.write_text(json.dumps(lang, ensure_ascii=False, indent=2) + '\n')

          # Restore translation-backed root/Tesla text and give meaningful rarity frames.
          root_path = Path('src/main/resources/data/scp_additions/advancements/scp_additions_ach.json')
          root = json.loads(root_path.read_text())
          root['display']['description'] = {'translate': 'advancements.scp_additions_ach.descr'}
          root['display']['frame'] = 'task'
          root_path.write_text(json.dumps(root, indent=2) + '\n')

          tesla_path = Path('src/main/resources/data/scp_additions/advancements/tesla.json')
          tesla = json.loads(tesla_path.read_text())
          tesla['display']['title'] = {'translate': 'advancements.tesla.title'}
          tesla['display']['description'] = {'translate': 'advancements.tesla.descr'}
          tesla['display']['frame'] = 'goal'
          tesla_path.write_text(json.dumps(tesla, indent=2) + '\n')

          frame_updates = {
              'scp_330_achievement.json': 'goal',
              'scp_902_achievement.json': 'goal',
              'scp_914_metamorphosis.json': 'goal',
              'scp_079control_achi.json': 'challenge',
          }
          advancements_dir = Path('src/main/resources/data/scp_additions/advancements')
          for filename, frame in frame_updates.items():
              path = advancements_dir / filename
              data = json.loads(path.read_text())
              data['display']['frame'] = frame
              path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit fixes to master
        run: |
          rm .github/workflows/_apply-ui-polish-fixes.yml
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Polish achievement UI and chair alignment"
          git push origin HEAD:master
