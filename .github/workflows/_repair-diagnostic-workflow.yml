name: Repair Diagnostic Integration Workflow

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair workflow escapes
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/_apply-diagnostic-table.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace("    if: github.actor != 'github-actions[bot]'\n", "", 1)
          text = text.replace('\\\\n', '\\n')
          path.write_text(text, encoding='utf-8')
      - name: Commit repaired workflow
        run: |
          rm .github/workflows/_repair-diagnostic-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair temporary diagnostic integration workflow"
          git push
