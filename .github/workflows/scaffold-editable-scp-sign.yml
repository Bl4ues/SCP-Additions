name: Scaffold Editable SCP Sign

on:
  push:
    branches:
      - feature/editable-scp-sign-support
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/editable-scp-sign-support
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Kokoro font and license
        run: |
          mkdir -p src/main/resources/assets/scp_additions/font
          mkdir -p src/main/resources/META-INF/licenses
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/google/fonts/main/ofl/kokoro/Kokoro-Regular.ttf \
            --output src/main/resources/assets/scp_additions/font/kokoro.ttf
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/google/fonts/main/ofl/kokoro/OFL.txt \
            --output src/main/resources/META-INF/licenses/Kokoro-OFL-1.1.txt

      - name: Apply integration patches once
        run: |
          if grep -Fq 'registerBlock("sign_support", SignSupportBlock::new' \
              src/main/java/net/mcreator/scpadditions/facility/FacilityModule.java; then
            python3 scripts/scaffold_editable_scp_sign.py
          else
            echo "SCP sign integration patches already applied"
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Commit generated scaffold when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE.md src/main/java src/main/resources
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Scaffold editable SCP Sign Support [skip ci]"
          git push origin HEAD:feature/editable-scp-sign-support
