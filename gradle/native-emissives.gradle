// Converts every authored OptiFine-style *_e.png mask into complementary
// emission paths:
//   1. block masks become private, atlas-stitched textures used by SCP
//      Additions' native full-bright baked-model overlay; and
//   2. every mask continues to write LabPBR emission into matching _s alpha.
//
// Block source *_e.png files remain the authoring convention, but are removed
// from processed resources after native conversion so external emissive-texture
// loaders cannot draw a second copy of the same overlay. Entity masks
// are left untouched because their renderer path is separate from baked blocks.
gradle.afterProject { evaluatedProject, state ->
    if (state.failure != null) {
        return
    }

    def resourceTask = evaluatedProject.tasks.findByName('processResources')
    if (resourceTask == null) {
        return
    }

    resourceTask.doLast {
        File assetsRoot = evaluatedProject.file(
                "${evaluatedProject.buildDir}/resources/main/assets")
        if (!assetsRoot.isDirectory()) {
            return
        }

        final String runtimeSuffix = '_native_emissive'
        def nativeSprites = new TreeSet<String>()
        def nativeBaseTextures = new TreeSet<String>()

        // One malformed optional material must not abort the complete resource
        // build. Record the exact path so the source asset can be repaired,
        // while allowing every other valid emissive texture to be processed.
        def readPng = { File imageFile ->
            try {
                return javax.imageio.ImageIO.read(imageFile)
            } catch (Exception exception) {
                evaluatedProject.logger.warn(
                        "Skipping unreadable PNG ${imageFile}: ${exception.message}")
                return null
            }
        }

        // GeckoLib block entities travel through Minecraft's entity material
        // pipeline. A full-bright glowmask pass is visible there, but BSL/Iris
        // only receives authored HDR emission strength when the base texture has
        // a matching LabPBR _s map. Merge either authoring convention (_e or
        // _glowmask) into that companion map while preserving existing material
        // channels.
        def mergeLabPbrEmission = { File maskFile, String sourceSuffix ->
            def maskImage = readPng(maskFile)
            if (maskImage == null) {
                return null
            }

            String quotedSuffix = java.util.regex.Pattern.quote(sourceSuffix)
            String specularName = maskFile.name.replaceFirst(
                    quotedSuffix + /\.png$/, '_s.png')
            File specularFile = new File(maskFile.parentFile, specularName)
            java.awt.image.BufferedImage specularImage

            if (specularFile.isFile()) {
                def sourceSpecular = readPng(specularFile)
                if (sourceSpecular == null
                        || sourceSpecular.width != maskImage.width
                        || sourceSpecular.height != maskImage.height) {
                    evaluatedProject.logger.warn(
                            'Skipping LabPBR emission for {} because {} is unreadable or has incompatible dimensions',
                            maskFile, specularFile)
                    return null
                }

                specularImage = new java.awt.image.BufferedImage(
                        sourceSpecular.width, sourceSpecular.height,
                        java.awt.image.BufferedImage.TYPE_INT_ARGB)
                def graphics = specularImage.createGraphics()
                try {
                    graphics.drawImage(sourceSpecular, 0, 0, null)
                } finally {
                    graphics.dispose()
                }
            } else {
                specularImage = new java.awt.image.BufferedImage(
                        maskImage.width, maskImage.height,
                        java.awt.image.BufferedImage.TYPE_INT_ARGB)
                for (int y = 0; y < specularImage.height; y++) {
                    for (int x = 0; x < specularImage.width; x++) {
                        // LabPBR defaults. Alpha 255 means non-emissive.
                        specularImage.setRGB(x, y, 0xFF000000 as int)
                    }
                }
            }

            for (int y = 0; y < maskImage.height; y++) {
                for (int x = 0; x < maskImage.width; x++) {
                    int mask = maskImage.getRGB(x, y)
                    int maskAlpha = (mask >>> 24) & 0xFF
                    int red = (mask >>> 16) & 0xFF
                    int green = (mask >>> 8) & 0xFF
                    int blue = mask & 0xFF
                    int brightness = Math.max(red, Math.max(green, blue))
                    if (maskAlpha == 0 || brightness == 0) {
                        continue
                    }

                    int material = specularImage.getRGB(x, y)
                    // LabPBR alpha 254 is maximum emission. Alpha 255 is
                    // intentionally reserved for "not emissive".
                    specularImage.setRGB(x, y,
                            (254 << 24) | (material & 0x00FFFFFF))
                }
            }

            specularFile.parentFile.mkdirs()
            javax.imageio.ImageIO.write(specularImage, 'png', specularFile)
            return maskImage
        }

        // Give GeckoLib-style glowmasks the same shader-native LabPBR emission
        // path as _e-authored materials. Keep the source mask for the existing
        // vanilla/full-bright fallback render layer. The moving elevator cabin
        // is intentionally excluded: its large cutout entity mesh renders its
        // lamp through an explicit eyes pass, while LabPBR emission on the base
        // entity material causes some shader packs to bloom the whole ceiling UV
        // island into a floating white rectangle.
        evaluatedProject.fileTree(assetsRoot).matching {
            include '**/*_glowmask.png'
        }.files.sort { first, second ->
            first.path <=> second.path
        }.each { File glowmaskFile ->
            String normalizedPath = glowmaskFile.path.replace('\\', '/')
            boolean elevatorCarriage = glowmaskFile.name ==
                    'core_room_elevator_carriage_glowmask.png'
                    && normalizedPath.contains('/textures/entities/')
            if (!elevatorCarriage) {
                mergeLabPbrEmission(glowmaskFile, '_glowmask')
            }
        }

        // The Floor Station is a GeckoLib block entity, but its authored light
        // artwork uses the same glowmask convention as entities. Mirror that
        // mask to an _e source before the common LabPBR conversion. Its ordinary
        // baked block texture additionally receives the native overlay below.
        [
                'scp_classified_directive/textures/entities/core_room_elevator_floor_station',
                'scp_classified_directive/textures/block/core_room_elevator_floor_station'
        ].each { relativeBase ->
            File glowmask = new File(assetsRoot,
                    "${relativeBase}_glowmask.png")
            File emissive = new File(assetsRoot,
                    "${relativeBase}_e.png")
            if (glowmask.isFile()) {
                emissive.parentFile.mkdirs()
                java.nio.file.Files.copy(glowmask.toPath(), emissive.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }

        def emissiveFiles = evaluatedProject.fileTree(assetsRoot).matching {
            include '**/*_e.png'
        }.files.sort { first, second ->
            first.path <=> second.path
        }

        emissiveFiles.each { File emissiveFile ->
            def emissiveImage = mergeLabPbrEmission(emissiveFile, '_e')
            if (emissiveImage == null) {
                return
            }

            String sourceRelative = assetsRoot.toPath()
                    .relativize(emissiveFile.toPath())
                    .toString().replace('\\', '/')
            boolean bakedBlockTexture = sourceRelative.contains('/textures/block/')
                    || sourceRelative.contains('/textures/blocks/')
            if (!bakedBlockTexture) {
                return
            }

            int sourceTextureMarker = sourceRelative.indexOf('/textures/')
            if (sourceTextureMarker > 0 && sourceRelative.endsWith('.png')) {
                String namespace = sourceRelative.substring(0,
                        sourceTextureMarker)
                String authoredTexturePath = sourceRelative.substring(
                        sourceTextureMarker + '/textures/'.length(),
                        sourceRelative.length() - '.png'.length())
                String baseTexturePath = authoredTexturePath.replaceFirst(
                        /_e$/, '')
                nativeBaseTextures.add("${namespace}:${baseTexturePath}")
            }

            String runtimeName = emissiveFile.name.replaceFirst(
                    /_e\.png$/, "${runtimeSuffix}.png")
            File runtimeFile = new File(emissiveFile.parentFile, runtimeName)

            // Legacy emissive-mask conventions treat opaque black as a non-emissive value, but
            // a native cutout overlay would render that black over the original
            // block. Convert every zero-brightness pixel to transparent while
            // preserving the authored color and alpha of actual light pixels.
            def runtimeImage = new java.awt.image.BufferedImage(
                    emissiveImage.width, emissiveImage.height,
                    java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for (int y = 0; y < emissiveImage.height; y++) {
                for (int x = 0; x < emissiveImage.width; x++) {
                    int mask = emissiveImage.getRGB(x, y)
                    int maskAlpha = (mask >>> 24) & 0xFF
                    int red = (mask >>> 16) & 0xFF
                    int green = (mask >>> 8) & 0xFF
                    int blue = mask & 0xFF
                    int brightness = Math.max(red, Math.max(green, blue))
                    runtimeImage.setRGB(x, y,
                            maskAlpha == 0 || brightness == 0 ? 0 : mask)
                }
            }
            runtimeFile.parentFile.mkdirs()
            javax.imageio.ImageIO.write(runtimeImage, 'png', runtimeFile)

            File sourceMetadata = new File(emissiveFile.parentFile,
                    emissiveFile.name + '.mcmeta')
            if (sourceMetadata.isFile()) {
                File runtimeMetadata = new File(runtimeFile.parentFile,
                        runtimeFile.name + '.mcmeta')
                java.nio.file.Files.copy(sourceMetadata.toPath(),
                        runtimeMetadata.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }

            String relative = assetsRoot.toPath()
                    .relativize(runtimeFile.toPath())
                    .toString().replace('\\', '/')
            int textureMarker = relative.indexOf('/textures/')
            if (textureMarker > 0 && relative.endsWith('.png')) {
                String namespace = relative.substring(0, textureMarker)
                String texturePath = relative.substring(
                        textureMarker + '/textures/'.length(),
                        relative.length() - '.png'.length())
                nativeSprites.add("${namespace}:${texturePath}")
            }

            // The public JAR contains only the private native mask and generated
            // LabPBR map for baked block textures, preventing duplicate overlays
            // from external emissive-texture loaders.
            evaluatedProject.delete(emissiveFile)
            if (sourceMetadata.isFile()) {
                evaluatedProject.delete(sourceMetadata)
            }
        }

        // Runtime model wrappers consult this manifest before adding render
        // passes, so blocks without emissive artwork incur no empty cutout pass.
        File manifestFile = new File(assetsRoot,
                'scp_classified_directive/native_emissive_textures.txt')
        manifestFile.parentFile.mkdirs()
        String manifestText = nativeBaseTextures.join(System.lineSeparator())
        if (!manifestText.isEmpty()) {
            manifestText += System.lineSeparator()
        }
        manifestFile.setText(manifestText, 'UTF-8')

        if (!nativeSprites.isEmpty()) {
            // Atlas configuration files from multiple resource packs are merged
            // by Minecraft. Add every private mask explicitly because no normal
            // JSON model references these second-pass textures directly.
            File atlasFile = new File(assetsRoot,
                    'minecraft/atlases/blocks.json')
            def atlasData = atlasFile.isFile()
                    ? new groovy.json.JsonSlurper().parse(atlasFile)
                    : [:]
            def sources = atlasData.sources instanceof List
                    ? new ArrayList(atlasData.sources)
                    : []

            sources.removeAll { source ->
                source instanceof Map
                        && source.type == 'single'
                        && source.resource instanceof String
                        && source.resource.endsWith(runtimeSuffix)
            }
            nativeSprites.each { sprite ->
                sources.add([type: 'single', resource: sprite])
            }
            atlasData.sources = sources

            atlasFile.parentFile.mkdirs()
            atlasFile.setText(
                    groovy.json.JsonOutput.prettyPrint(
                            groovy.json.JsonOutput.toJson(atlasData))
                            + System.lineSeparator(),
                    'UTF-8')
        }
    }
}
