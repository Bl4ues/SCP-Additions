name: Apply context item variants

on:
  push:
    branches:
      - feature/context-item-variants

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[context-variant-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          cat > /tmp/context_patch.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/context_patch.gz.b64 | gzip -d > /tmp/context_patch.py
          python3 /tmp/context_patch.py
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/apply-context-item-variants.yml
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git commit -m "Add item-specific contextual interaction runtime"
          git push origin HEAD:feature/context-item-variants
