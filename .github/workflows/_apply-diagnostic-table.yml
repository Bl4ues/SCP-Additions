name: Archivist Chair Integration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/_apply-diagnostic-table.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Add Archivist Chair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64, json, zlib
          files = json.loads(zlib.decompress(base64.b64decode('')).decode('utf-8'))
          for path, content in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          facility_path = Path('src/main/java/net/mcreator/scpadditions/facility/FacilityModule.java')
          facility = facility_path.read_text(encoding='utf-8')
          for old, new in [
              ('    public static final RegistryObject<Block> ARCHIVISTS_TABLE = registerBlock(\n            "archivists_table", ArchivistsTableBlock::new, true);\n    public static final RegistryObject<Block> TRASHBIN = registerBlock("trashbin", TrashbinBlock::new, true);', '    public static final RegistryObject<Block> ARCHIVISTS_TABLE = registerBlock(\n            "archivists_table", ArchivistsTableBlock::new, true);\n    public static final RegistryObject<Block> ARCHIVISTS_CHAIR =\n            BLOCKS.register("archivists_chair", ArchivistsChairBlock::new);\n    public static final RegistryObject<Item> ARCHIVISTS_CHAIR_ITEM =\n            ITEMS.register("archivists_chair", () -> new ArchivistsChairBlockItem(\n                    ARCHIVISTS_CHAIR.get(), new Item.Properties()));\n    static {\n        BLOCKS_BY_PATH.put("archivists_chair", ARCHIVISTS_CHAIR);\n        ITEMS_BY_PATH.put("archivists_chair", ARCHIVISTS_CHAIR_ITEM);\n        CREATIVE_ITEMS.add(ARCHIVISTS_CHAIR_ITEM);\n    }\n    public static final RegistryObject<Block> TRASHBIN = registerBlock("trashbin", TrashbinBlock::new, true);'),
              ('    public static final RegistryObject<BlockEntityType<WetFloorBlockEntity>>\n            WET_FLOOR_BLOCK_ENTITY = BLOCK_ENTITY_TYPES.register(\n                    "wet_floor", () -> BlockEntityType.Builder.of(\n                            WetFloorBlockEntity::new, WET_FLOOR.get()).build(null));', '    public static final RegistryObject<BlockEntityType<ArchivistsChairBlockEntity>>\n            ARCHIVISTS_CHAIR_BLOCK_ENTITY = BLOCK_ENTITY_TYPES.register(\n                    "archivists_chair", () -> BlockEntityType.Builder.of(\n                            ArchivistsChairBlockEntity::new,\n                            ARCHIVISTS_CHAIR.get()).build(null));\n    public static final RegistryObject<BlockEntityType<WetFloorBlockEntity>>\n            WET_FLOOR_BLOCK_ENTITY = BLOCK_ENTITY_TYPES.register(\n                    "wet_floor", () -> BlockEntityType.Builder.of(\n                            WetFloorBlockEntity::new, WET_FLOOR.get()).build(null));'),
              ('        addFacilityCreativeItem(props, "archivists_table");\n        addUBlockCreativeItem(props, "vent_open");', '        addFacilityCreativeItem(props, "archivists_table");\n        addFacilityCreativeItem(props, "archivists_chair");\n        addUBlockCreativeItem(props, "vent_open");'),
          ]:
              if old not in facility:
                  raise RuntimeError('FacilityModule anchor not found: ' + old[:80])
              facility = facility.replace(old, new, 1)
          facility_path.write_text(facility, encoding='utf-8')

          lang_path = Path('src/main/resources/assets/scp_additions/lang/en_us.json')
          lang = lang_path.read_text(encoding='utf-8')
          old = '  "block.scp_additions.archivists_table": "Archivist\'s Table",'
          new = old + '\n  "block.scp_additions.archivists_chair": "Archivist\'s Chair",'
          if old not in lang:
              raise RuntimeError('Archivist table lang anchor not found')
          lang_path.write_text(lang.replace(old, new, 1), encoding='utf-8')

          geo = json.loads(Path('src/main/resources/assets/scp_additions/geo/archivists_chair.geo.json').read_text())
          desc = geo['minecraft:geometry'][0]['description']
          assert desc['identifier'] == 'geometry.archivists_chair'
          assert desc['texture_width'] == 64 and desc['texture_height'] == 64
          assert Path('src/main/resources/assets/scp_additions/textures/block/archivists_chair.png').exists()
          assert facility.index('addFacilityCreativeItem(props, "archivists_table")') < facility.index('addFacilityCreativeItem(props, "archivists_chair")') < facility.index('addUBlockCreativeItem(props, "vent_open")')
          print('Prepared Archivist Chair integration with authored offset and 49-piece collision approximation.')

          PY
      - name: Compile
        run: ./gradlew compileJava processResources --no-daemon
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/net/mcreator/scpadditions/facility/FacilityModule.java
          git add src/main/java/net/mcreator/scpadditions/facility/ArchivistsChairBlock.java
          git add src/main/java/net/mcreator/scpadditions/facility/ArchivistsChairBlockEntity.java
          git add src/main/java/net/mcreator/scpadditions/facility/ArchivistsChairBlockItem.java
          git add src/main/java/net/mcreator/scpadditions/client/ArchivistsChairBlockModel.java
          git add src/main/java/net/mcreator/scpadditions/client/ArchivistsChairItemModel.java
          git add src/main/java/net/mcreator/scpadditions/client/ArchivistsChairBlockRenderer.java
          git add src/main/java/net/mcreator/scpadditions/client/ArchivistsChairItemRenderer.java
          git add src/main/java/net/mcreator/scpadditions/client/ArchivistsChairClient.java
          git add src/main/resources/assets/scp_additions/geo/archivists_chair.geo.json
          git add src/main/resources/assets/scp_additions/animations/archivists_chair.animation.json
          git add src/main/resources/assets/scp_additions/models/item/archivists_chair.json
          git add src/main/resources/assets/scp_additions/blockstates/archivists_chair.json
          git add src/main/resources/assets/scp_additions/models/block/archivists_chair_particle.json
          git add src/main/resources/assets/scp_additions/lang/en_us.json
          git commit -m "Add decorative Archivist's Chair"
          git push origin HEAD:master
