name: Validate transformed fixture routing
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_transform_fixture_routing.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixture routing changes
        run: python3 .github/scripts/temporary_transform_fixture_routing.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build source changes
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit tested fixture routing
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformPlacementStateRuntime.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformSurfacePlacementClient.java
          git commit -m 'Correct curved Surface pipe facing and allow screwdriver Alarm use'
          git pull --rebase origin master
          git push origin HEAD:master
