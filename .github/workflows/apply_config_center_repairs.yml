name: Apply Configuration Center Repairs

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply_config_center_repairs.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply repairs
        run: |
          python3 tools/prepare_config_center_repair.py
          python3 tools/apply_config_center_repairs.py
          python3 tools/fix_generated_widget_suppression.py
      - name: Build
        run: ./gradlew clean build --stacktrace
      - name: Commit repairs
        run: |
          rm -f .github/workflows/apply_config_center_repairs.yml
          rm -f tools/apply_config_center_repairs.py
          rm -f tools/prepare_config_center_repair.py
          rm -f tools/fix_generated_widget_suppression.py
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git commit -m "Fix Configuration Center layout regressions"
          git push origin HEAD:master
