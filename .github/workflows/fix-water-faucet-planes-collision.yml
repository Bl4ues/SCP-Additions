name: Fix Water Faucet Planes and Collision

on:
  push:
    branches:
      - fix/water-faucet-planes-collision

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/water-faucet-planes-collision
          fetch-depth: 0

      - name: Expand zero-thickness planes and simplify collision
        run: python scripts/fix_water_faucet_planes_collision.py

      - name: Commit corrected geometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/scp_additions/models/block/water_faucet.json
          git add src/main/java/net/mcreator/scpadditions/facility/FacilityModule.java
          git commit -m "Fix Water Faucet planes and collision [skip ci]"
          git push origin HEAD:fix/water-faucet-planes-collision
