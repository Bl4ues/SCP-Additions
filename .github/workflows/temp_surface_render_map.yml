name: Validate Surface regions and SCP-079 map contours
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Surface and map patches
        run: python3 .github/scripts/temp_surface_render_map.py
      - name: Project integrity
        run: python3 .github/scripts/verify_project_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Publish validated changes to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Cull Surface rendering by logical region and reduce curve tessellation'
          git add src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java src/main/java/com/bl4ues/scpclassifieddirective/facility/mapping/client/FacilityRoomOutlineGeometry.java
          git commit -m 'Keep SCP-079 map contour raster within exact room geometry'
          git pull --rebase origin master
          git push origin HEAD:master
