name: Asset Audit

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/scp106-audio-particle-fades'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/scp106-audio-particle-fades
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply SCP-106 presentation tweaks
        run: python3 scripts/apply_scp106_presentation_tweaks.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Restore workflow and commit implementation
        run: |
          git checkout origin/master -- .github/workflows/asset-audit.yml
          rm -f scripts/apply_scp106_presentation_tweaks.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish SCP-106 audio and portal fades"
          git push origin HEAD:fix/scp106-audio-particle-fades

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: scp106-presentation-tweaks-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
