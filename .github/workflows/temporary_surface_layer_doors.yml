name: Apply Surface layer door runtime
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_surface_layer_doors.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply precise Surface door patch
        run: python3 .github/scripts/temporary_surface_layer_doors.py
      - name: Check Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build patched mod before pushing source
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit the runtime and network changes separately
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/TransformSurfaceDoorRuntime.java
          git commit -m 'Drive Surface doors independently on main and overlay layers'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/network/TransformConstructionNetwork.java
          git commit -m 'Route Surface overlay door use to authoritative runtime'
          git push origin HEAD:master
