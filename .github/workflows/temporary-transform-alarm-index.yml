name: Apply transformed Alarm render index
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary-transform-alarm-index.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply targeted source patch
        run: python3 .github/scripts/temporary_transform_alarm_index.py
      - name: Commit incremental Alarm rendering
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformAlarmClientRenderer.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientState.java
          git commit -m 'Index transformed Alarm render hosts by changed logical cell'
          git push origin HEAD:master
