name: Validate linked-surface HUD and transformed button prompts
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply precise source patch
        run: python3 .github/scripts/temp_linked_context_fix.py
      - name: Check repository integrity
        run: python3 .github/scripts/verify_project_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build entire mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Commit validated code to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/client/BuilderToolGuideHud.java
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformContextTargetClient.java
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientState.java
          git add src/main/java/com/bl4ues/scpclassifieddirective/inventory/client/ContextPromptClient.java
          git commit -m 'Show linked Surface shortcut and unify transformed door button prompts'
          git push origin HEAD:master
