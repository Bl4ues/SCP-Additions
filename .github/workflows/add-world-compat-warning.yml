name: Add 4.0 World Compatibility Warning

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/add-world-compat-warning.yml

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update changelog warning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')

          heading = '# SCP: Classified Directive 4.0.0 — In Development\n\n'
          warning = (
              '> [!WARNING]\n'
              '> **World compatibility notice:** Worlds created with SCP Additions before the 4.0.0 rebrand are **not block-compatible** with SCP: Classified Directive. Because the registry namespace changed, blocks placed by older versions will not be preserved when those worlds are loaded under 4.0.0 and may be removed from the world. **Back up old worlds before updating.** Configuration, player-capability, and SavedData migrations remain supported where explicitly described below, but placed legacy blocks should be treated as non-migrating content.\n\n'
          )
          if warning not in text:
              if heading not in text:
                  raise SystemExit('4.0.0 heading not found')
              text = text.replace(heading, heading + warning, 1)

          old = '- Added Forge missing-mapping migration so legacy registered world content resolves to the new namespace;'
          new = '- Added Forge missing-mapping handling for legacy registry identifiers where Forge exposes them during migration; placed blocks from pre-4.0 worlds are not block-compatible across the namespace change and are not guaranteed to survive loading;'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('legacy mapping bullet not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changelog update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Document 4.0 world block incompatibility"
          git push origin HEAD:master
