name: Apply Configuration Center toggle UI fix

on:
  push:
    branches:
      - 'fix/config-center-toggle-ui'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Trigger config UI regression patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI regression fixes
        run: python3 .github/scripts/fix_config_center_toggle_ui.py
      - name: Commit fixes
        run: |
          git config user.name 'Deyvid Campos'
          git config user.email 'deyvid04campos@gmail.com'
          git add src/main/java/net/mcreator/scpadditions/config/ui/ConfigCenterClient.java \
                  src/main/java/net/mcreator/scpadditions/client/UnityConfigurationUiEvents.java \
                  CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Configuration Center toggle regressions'
          git push
