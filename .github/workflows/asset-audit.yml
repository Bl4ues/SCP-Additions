name: Asset Audit

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/scp106-ranged-audio-debug-order
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply prepared implementation
        if: github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path
          raw = Path('.github/workflows/build.yml').read_text()
          step = raw.index('      - name: Apply SCP-106 fixes and animation')
          start_marker = '        run: |\n'
          start = raw.index(start_marker, step) + len(start_marker)
          end = raw.index('\n      - name: Make Gradle wrapper executable', start)
          lines = []
          for line in raw[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-complete-scp106.sh').write_text('set -e\n' + '\n'.join(lines) + '\n')
          PY
          bash -e /tmp/apply-complete-scp106.sh

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Commit implementation
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine SCP-106 ranged attack and emergence"
          git push origin HEAD:fix/scp106-ranged-audio-debug-order

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scp106-ranged-fix-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
