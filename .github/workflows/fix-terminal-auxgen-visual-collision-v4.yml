name: Correct Terminal Shader Emission Fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-terminal-auxgen-visual-collision-v4.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install image tooling
        run: python3 -m pip install --quiet pillow

      - name: Apply corrected patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('.github/workflows/fix-terminal-auxgen-visual-collision-v3.yml')
          if not source_path.exists():
              raise SystemExit('Expected v3 workflow source is missing; refusing to guess at a partial patch')
          workflow = source_path.read_text(encoding='utf-8')
          old = 'alpha = max(alpha, max(160, luminance))'
          new = 'alpha = min(alpha, max(0, 255 - luminance))'
          if workflow.count(old) != 1:
              raise SystemExit(f'Expected one legacy emission expression, found {workflow.count(old)}')
          workflow = workflow.replace(old, new, 1)

          lines = workflow.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          payload = lines[start:end]
          nonblank = [len(line) - len(line.lstrip()) for line in payload if line.strip()]
          indent = min(nonblank)
          script = '\n'.join(line[indent:] if line.strip() else '' for line in payload)
          namespace = {'__name__': '__main__'}
          exec(compile(script, '<terminal-auxgen-fix>', 'exec'), namespace, namespace)
          PY

      - name: Remove temporary workflows from build tree
        run: |
          rm -f .github/workflows/fix-terminal-auxgen-visual-collision-v3.yml
          rm -f .github/workflows/fix-terminal-auxgen-visual-collision-v4.yml

      - name: Build final tree
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/net/mcreator/scpadditions/block/SCP079SystemControlBlock.java \
                  src/main/java/net/mcreator/scpadditions/block/Scp079AuxiliaryPowerBlock.java \
                  src/main/resources/assets/scp_additions/textures/block/system_terminal_s.png \
                  .github/workflows/fix-terminal-auxgen-visual-collision-v3.yml \
                  .github/workflows/fix-terminal-auxgen-visual-collision-v4.yml
          git commit -m "Fix terminal shader display and model collisions"
          git push origin HEAD:master
