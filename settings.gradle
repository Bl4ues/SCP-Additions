pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}

// Keep resource-processing details out of the already crowded main build
// script while still installing the hooks before the root project is evaluated.
apply from: file('gradle/decontamination-glowmask.gradle')
apply from: file('gradle/native-emissives.gradle')
apply from: file('gradle/roomba-sound.gradle')
