name: Apply Document Holder context and 4.0.0

on:
  push:
    branches:
      - 'feature/document-holder-context-4.0'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[document-holder-context-4]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply-document-holder-context-4.py
      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/scripts/apply-document-holder-context-4.py
          rm -f .github/workflows/apply-document-holder-context-4.yml
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add -A
          git commit -m "Add Document Holder contextual prompt and set 4.0.0"
          git push origin HEAD:feature/document-holder-context-4.0
