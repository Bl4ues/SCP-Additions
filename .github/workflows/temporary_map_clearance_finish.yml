name: Validate fixed SCP-079 clearance and ping palette
on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary_map_clearance_finish.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update SCP-079 badge and activity palette
        run: python3 .github/scripts/temporary_map_clearance_finish.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build before committing
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit verified SCP-079 map fixes
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapScreen.java src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079FacilityMapNetworkOverlay.java src/main/java/com/bl4ues/scpclassifieddirective/client/scp079/Scp079UiTheme.java src/main/java/com/bl4ues/scpclassifieddirective/mixin/client/Scp079PlayableVisualsV2CursorMixin.java
          git commit -m 'Keep clearance badges fixed and align SCP-079 activity amber'
          git pull --rebase origin master
          git push origin HEAD:master
