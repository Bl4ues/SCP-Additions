name: Validate Surface boundary welding
on:
  push:
    paths:
      - .github/workflows/temporary_surface_seam_weld_20260920.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Reconcile nearby independently authored curves
        run: python3 .github/scripts/temporary_surface_seam_weld_20260920.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate compiled mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Commit verified seam algorithm
        run: |
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Weld near-coincident existing curved surfaces at shared face intersections'
          git push origin HEAD:master
