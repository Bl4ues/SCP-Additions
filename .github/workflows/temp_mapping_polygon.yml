name: Validate curved facility mapping polygon precision
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mapped outline precision patch
        run: python3 .github/scripts/temp_mapping_polygon.py
      - name: Verify project integrity
        run: python3 .github/scripts/verify_project_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Commit verified mapping correction to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/mapping/FacilitySurfaceBoundaryConformer.java
          git commit -m 'Preserve curved mapping outline corners when reducing polygon detail'
          git pull --rebase origin master
          git push origin HEAD:master
