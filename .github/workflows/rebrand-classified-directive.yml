name: Classified Directive Final Validation

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/rebrand-classified-directive.yml'

permissions:
  contents: write

concurrency:
  group: classified-directive-final-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate final Classified Directive build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Record successful validation
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'status=success\nvalidated_sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .github/classified-directive-validation.txt
          git add .github/classified-directive-validation.txt
          git commit -m "Record successful Classified Directive validation [skip ci]"
          git push origin HEAD:master

      - name: Record failed validation
        if: failure()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'status=failure\nvalidated_sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .github/classified-directive-validation.txt
          git add .github/classified-directive-validation.txt
          git commit -m "Record failed Classified Directive validation [skip ci]"
          git push origin HEAD:master
