name: Build

on:
  push:
    branches:
      - master
      - integration/scp-additions-3.0
      - 'feature/**'
  pull_request:
    branches:
      - master
      - integration/scp-additions-3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply prepared elevator repair
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/elevator-collision-prompts-v3'
        run: |
          python tools/hotfix/apply_elevator_fix_v3.py
          rm -f tools/hotfix/apply_elevator_fix_v3.py
          rm -f tools/hotfix/APPLY_ELEVATOR_FIX_V3
          rm -f .github/workflows/apply-elevator-fix-v3.yml

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Commit validated elevator repair
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/elevator-collision-prompts-v3'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix elevator collision, prompts, rendering, and SCP-330 scale"
          git push origin HEAD:fix/elevator-collision-prompts-v3

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scp-additions-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
