name: Apply Configuration Center UI cleanup

on:
  push:
    branches: [ master ]
    paths:
      - '.github/scripts/apply_config_ui_cleanup.py'
      - '.github/workflows/apply-config-ui-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply fixes
        run: python3 .github/scripts/apply_config_ui_cleanup.py
      - name: Check diff
        run: git diff --check
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - name: Commit fixes
        run: |
          git config user.name "Deyvid Campos"
          git config user.email "deyvid04campos@gmail.com"
          git add src/main/java
          git commit -m "Polish Configuration Center UI details"
          git push origin master
