name: Classified Directive Rebrand

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/rebrand_classified_directive.py'
      - 'scripts/rebrand_classified_directive_hotfix.py'
      - 'scripts/rebrand_classified_directive_compat.py'
      - '.github/workflows/rebrand-classified-directive.yml'

permissions:
  contents: write

concurrency:
  group: classified-directive-rebrand
  cancel-in-progress: true

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to current master
        run: |
          git fetch origin master
          git reset --hard origin/master
          rm -f .github/rebrand-failure.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run migration
        run: |
          python3 scripts/rebrand_classified_directive_hotfix.py
          python3 scripts/rebrand_classified_directive.py
          python3 scripts/rebrand_classified_directive_compat.py

      - name: Remove one-shot migration files
        run: |
          rm scripts/rebrand_classified_directive.py
          rm scripts/rebrand_classified_directive_hotfix.py
          rm scripts/rebrand_classified_directive_compat.py
          rm .github/workflows/rebrand-classified-directive.yml
          rm -f .github/rebrand-failure.txt

      - name: Validate migrated build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace

      - name: Commit migrated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand as SCP: Classified Directive"

      - name: Rebase, revalidate and publish handoff
        run: |
          set -euo pipefail
          git fetch origin master
          git rebase origin/master
          ./gradlew build --stacktrace
          git push --force origin HEAD:refs/heads/classified-directive-handoff
          echo "Validated migration published for atomic master handoff"

      - name: Wait for master landing and clean handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=$(git rev-parse HEAD)
          for attempt in $(seq 1 120); do
            current=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
            if [ "${current}" = "${expected}" ]; then
              curl -fsSL -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/classified-directive-handoff"
              echo "Master landed at ${expected}; handoff branch removed"
              exit 0
            fi
            sleep 5
          done
          echo "Handoff remains available because master was not advanced in time"
          exit 1

      - name: Record failed run
        if: failure()
        run: |
          git rebase --abort 2>/dev/null || true
          if git ls-remote --exit-code --heads origin classified-directive-handoff >/dev/null 2>&1; then
            echo "Validated handoff exists; preserving it instead of writing a misleading failure marker"
            exit 0
          fi
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            printf 'run_id=%s\nrun_url=%s/actions/runs/%s\n' "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > .github/rebrand-failure.txt
            git add .github/rebrand-failure.txt
            git commit -m "Record failed Classified Directive migration [skip ci]" || true
            if git push origin HEAD:master; then
              exit 0
            fi
          done
          exit 1
