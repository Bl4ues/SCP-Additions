name: Apply terminal and audio polish

on:
  push:
    branches:
      - fix/scipnet-legibility-generator-loop
    paths:
      - tools/hotfix/APPLY_TERMINAL_AUDIO_POLISH

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/scipnet-legibility-generator-loop
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply implementation
        run: python3 tools/hotfix/apply_terminal_audio_polish.py

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish SCiPNET legibility and generator audio"
          git push origin HEAD:fix/scipnet-legibility-generator-loop
