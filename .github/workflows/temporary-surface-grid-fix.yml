name: Apply Surface edit-preview cache correction

on:
  push:
    branches: [master]
    paths: ['.github/workflows/temporary-surface-grid-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Defer heavy mesh baking until Surface drag is committed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          controls = Path('src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientControls.java')
          text = controls.read_text(encoding='utf-8')
          anchor = '''    private TransformConstructionClientControls() {
              }
          '''.replace('              ', '    ')
          addition = '''    /** Live handle movement only changes the authoring preview; collision,
                * lighting and expensive payload meshes are finalized on release. */
               static boolean previewingSurface(UUID id) {
                   return id != null && drag != null && drag.remembered()
                           && drag.selection().type() == SelectionType.SURFACE
                           && id.equals(drag.selection().id());
               }

          '''.replace('               ', '    ').replace('                ', '     ')
          if text.count(anchor) != 1:
              raise RuntimeError('Surface editor class layout changed')
          text = text.replace(anchor, anchor + addition, 1)
          controls.write_text(text, encoding='utf-8')

          renderer = Path('src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java')
          text = renderer.read_text(encoding='utf-8')
          old = '''        } else if (cached.surface() != surface) {
                      if (!sameSurfaceGeometry(cached.surface(), surface)) {'''.replace('                      ', '            ')
          new = '''        } else if (cached.surface() != surface
                      && !TransformConstructionClientControls.previewingSurface(
                              surface.id())) {
                      if (!sameSurfaceGeometry(cached.surface(), surface)) {'''.replace('                      ', '            ')
          if text.count(old) != 1:
              raise RuntimeError('Surface renderer cache path changed')
          text = text.replace(old, new, 1)
          renderer.write_text(text, encoding='utf-8')
          PY
          git config user.name 'SCP CD CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientControls.java src/main/java/com/bl4ues/scpclassifieddirective/facility/transform/client/TransformConstructionClientRenderer.java
          git commit -m 'Defer full Surface payload mesh rebakes until handle release'
          git push origin HEAD:master
