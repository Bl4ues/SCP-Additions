name: Apply elevator repair on trigger branch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'automation/elevator-fix-trigger' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/elevator-fix-trigger
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply structural repair
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def regex_once(path, pattern, replacement, label, flags=0):
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text,
                                       count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(updated, encoding='utf-8')

          # SCP-330: enlarge from the present 2.24 visible-bounds model to 2.80,
          # preserving the authored lowest Y so the plate remains on the surface.
          scp330_geo = Path('src/main/resources/assets/scp_additions/geo/block/scp330.geo.json')
          document = json.loads(scp330_geo.read_text(encoding='utf-8'))
          scale = 1.25
          for geometry in document.get('minecraft:geometry', []):
              description = geometry.get('description', {})
              width = float(description.get('visible_bounds_width', 0.0))
              if not 2.20 <= width <= 2.30:
                  raise SystemExit(f'Unexpected SCP-330 visible bounds: {width}')
              cubes = [cube for bone in geometry.get('bones', [])
                       for cube in bone.get('cubes', [])
                       if isinstance(cube.get('origin'), list)]
              base_y = min(float(cube['origin'][1]) for cube in cubes)

              def scale_position(vector):
                  if not isinstance(vector, list) or len(vector) < 3:
                      return
                  vector[0] = round(float(vector[0]) * scale, 6)
                  vector[1] = round(base_y
                                    + (float(vector[1]) - base_y) * scale, 6)
                  vector[2] = round(float(vector[2]) * scale, 6)

              def scale_size(vector):
                  if not isinstance(vector, list) or len(vector) < 3:
                      return
                  for index in range(3):
                      vector[index] = round(float(vector[index]) * scale, 6)

              description['visible_bounds_width'] = round(width * scale, 6)
              if 'visible_bounds_height' in description:
                  description['visible_bounds_height'] = round(
                      float(description['visible_bounds_height']) * scale, 6)
              if isinstance(description.get('visible_bounds_offset'), list):
                  offset = description['visible_bounds_offset']
                  offset[0] = round(float(offset[0]) * scale, 6)
                  offset[1] = round(float(offset[1]) * scale, 6)
                  offset[2] = round(float(offset[2]) * scale, 6)
              for bone in geometry.get('bones', []):
                  scale_position(bone.get('pivot'))
                  for cube in bone.get('cubes', []):
                      scale_position(cube.get('origin'))
                      scale_size(cube.get('size'))
                      scale_position(cube.get('pivot'))
                  for locator in bone.get('locators', {}).values():
                      scale_position(locator)
          scp330_geo.write_text(json.dumps(document, separators=(',', ':')) + '\n',
                                encoding='utf-8')

          scp330_block = Path('src/main/java/net/mcreator/scpadditions/block/Scp330Block.java')
          regex_once(
              scp330_block,
              r'private static final VoxelShape SHAPE = box\(\s*'
              r'5\.75D, 0\.0D, 5\.75D, 10\.25D, 1\.75D, 10\.25D\);',
              '''private static final VoxelShape SHAPE = box(
                      5.1875D, 0.0D, 5.1875D,
                      10.8125D, 2.1875D, 10.8125D);''',
              'SCP-330 collision', re.S)

          # Floor-station geometry. Its root has no -90 degree Y transform.
          geometry_path = Path('src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorGeometry.java')
          geometry_text = geometry_path.read_text(encoding='utf-8')
          if 'stationButtonWorld' not in geometry_text:
              marker = '    private static AABB modelBox(double x0, double y0, double z0,'
              helper = '''    private static final double STATION_BUTTON_X = 14.64492D / 16.0D;
              private static final double STATION_BUTTON_Z = -16.69749D / 16.0D;

              public static Vec3 stationButtonWorld(BlockPos master,
                      Direction facing, boolean up) {
                  Vec3 local = new Vec3(STATION_BUTTON_X,
                          (up ? 21.25D : 19.25D) / 16.0D,
                          STATION_BUTTON_Z);
                  Vec3 rotated = rotateLocalVector(facing,
                          local.x, local.y, local.z);
                  return Vec3.atLowerCornerOf(master)
                          .add(0.5D, 0.0D, 0.5D)
                          .add(rotated);
              }

          '''
              if marker not in geometry_text:
                  raise SystemExit('Geometry helper insertion point not found')
              geometry_text = geometry_text.replace(marker, helper + marker, 1)
          old_station_call = ('return cellShape(boxes, facing, localX, localY, '
                              'localZ, true);')
          if geometry_text.count(old_station_call) != 1:
              raise SystemExit('Station collision root call not found exactly once')
          geometry_text = geometry_text.replace(
              old_station_call,
              'return cellShape(boxes, facing, localX, localY, localZ, false);', 1)
          geometry_path.write_text(geometry_text, encoding='utf-8')

          module_path = Path('src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorModule.java')
          module_text = module_path.read_text(encoding='utf-8')

          # Direct right-clicks use the exact same world anchors as the prompt.
          station_pattern = re.compile(
              r'            Vec3 local = CoreRoomElevatorGeometry\.worldToModelLocal\(.*?'
              r'            double downDistance = local\.distanceToSqr\(downButton\);',
              re.S)
          station_replacement = '''            Vec3 upButton = CoreRoomElevatorGeometry.stationButtonWorld(
                      pos, state.getValue(FACING), true);
              Vec3 downButton = CoreRoomElevatorGeometry.stationButtonWorld(
                      pos, state.getValue(FACING), false);
              double upDistance = hit.getLocation().distanceToSqr(upButton);
              double downDistance = hit.getLocation().distanceToSqr(downButton);'''
          module_text, count = station_pattern.subn(station_replacement,
                                                     module_text, count=1)
          if count != 1:
              raise SystemExit(f'Station direct hit block: found {count}')

          # Make manually placed and generated beam pieces targetable/breakable.
          module_text, beam_strength_count = re.subn(
              r'\.strength\(-1\.0F, 3600000\.0F\)',
              '.strength(5.0F, 15.0F)', module_text)
          if beam_strength_count != 2:
              raise SystemExit(f'Beam strength replacements: {beam_strength_count}')

          # Synchronize structure-part metadata to clients so selection and
          # collision shapes know their master and local cell.
          part_start = module_text.index(
              '    public static final class StructurePartBlockEntity')
          part_end = module_text.index(
              '    public static final class StationBlockEntity', part_start)
          part_section = module_text[part_start:part_end]
          part_section, configure_count = re.subn(
              r'(            this\.localZ = localZ;\n'
              r'            setChanged\(\);)',
              r'''\1
              if (level != null) {
                  level.sendBlockUpdated(worldPosition, getBlockState(),
                          getBlockState(), 3);
              }''',
              part_section, count=1)
          if configure_count != 1:
              raise SystemExit(f'Part configure synchronization: {configure_count}')
          if 'public CompoundTag getUpdateTag()' not in part_section:
              closing = part_section.rfind('    }\n')
              if closing < 0:
                  raise SystemExit('Structure part class closing brace not found')
              packet_methods = '''
              @Override
              public CompoundTag getUpdateTag() {
                  return saveWithoutMetadata();
              }

              @Nullable
              @Override
              public ClientboundBlockEntityDataPacket getUpdatePacket() {
                  return ClientboundBlockEntityDataPacket.create(this);
              }

              @Override
              public void onDataPacket(Connection net,
                      ClientboundBlockEntityDataPacket packet) {
                  CompoundTag tag = packet.getTag();
                  if (tag != null) load(tag);
              }
          '''
              part_section = (part_section[:closing] + packet_methods
                              + part_section[closing:])
          module_text = (module_text[:part_start] + part_section
                         + module_text[part_end:])
          module_path.write_text(module_text, encoding='utf-8')

          # Registry anchors use model coordinates directly, without the
          # erroneous extra EAST rotation.
          registry_path = Path('src/main/java/com/bl4ues/scpinventory/context/ContextInteractionRegistry.java')
          registry_text = registry_path.read_text(encoding='utf-8')
          registry_text, coordinate_count = re.subn(
              r'            Vec3 modelAligned = CoreRoomElevatorGeometry\.rotateLocalVector\(.*?'
              r'            double z = 0\.5D \+ modelAligned\.z;',
              '            double x = 0.5D;\n            double z = 0.5D;',
              registry_text, count=1, flags=re.S)
          if coordinate_count != 1:
              raise SystemExit(f'Registry station coordinate cleanup: {coordinate_count}')
          if 'public boolean requiresPreciseAim()' not in registry_text:
              marker = '        public double promptScale() { return promptScale; }\n'
              addition = '''        public boolean requiresPreciseAim() {
                  return interactionKey.startsWith("elevator_station_")
                          || interactionKey.startsWith("elevator_carriage_");
              }
          '''
              if marker not in registry_text:
                  raise SystemExit('Prompt-scale getter not found')
              registry_text = registry_text.replace(marker,
                                                     marker + addition, 1)
          anchor_signature = '''        public Vec3 resolveBlockAnchor(BlockPos pos, BlockState state) {
          '''
          if anchor_signature not in registry_text:
              raise SystemExit('Block anchor method not found')
          station_anchor = '''        public Vec3 resolveBlockAnchor(BlockPos pos, BlockState state) {
              if (block == CoreRoomElevatorModule.STATION.get()) {
                  return CoreRoomElevatorGeometry.stationButtonWorld(pos,
                          state.getValue(CoreRoomElevatorModule.FACING),
                          interactionKey.endsWith("up"));
              }
          '''
          registry_text = registry_text.replace(anchor_signature,
                                                 station_anchor, 1)
          registry_path.write_text(registry_text, encoding='utf-8')

          # Prompt targeting gets the same forward-ray and soft-radius rules as
          # dropped-item pickup, only for elevator buttons.
          prompt_path = Path('src/main/java/com/bl4ues/scpinventory/client/ContextPromptClient.java')
          prompt_text = prompt_path.read_text(encoding='utf-8')
          constant_marker = ('    private static final double TARGET_STICKINESS_BONUS = 0.045D;\n')
          if 'PRECISE_AIM_RADIUS_SQR' not in prompt_text:
              if constant_marker not in prompt_text:
                  raise SystemExit('Context prompt constant marker not found')
              prompt_text = prompt_text.replace(
                  constant_marker,
                  constant_marker
                  + '    private static final double PRECISE_AIM_RADIUS_SQR = 0.52D * 0.52D;\n',
                  1)
          prompt_text, score_call_count = re.subn(
              r'scorePoint\(anchor, eye, look, rule\.range\(\),\s*'
              r'directHit, rule\.priority\(\)\)',
              'scorePoint(anchor, eye, look, rule.range(),\n'
              '                        directHit, rule.priority(),\n'
              '                        rule.requiresPreciseAim())',
              prompt_text)
          if score_call_count != 2:
              raise SystemExit(f'Context score call replacements: {score_call_count}')
          score_method = '''    private static double scorePoint(Vec3 point, Vec3 eye, Vec3 look,
                  double reach, boolean directHit, int priority,
                  boolean preciseAim) {
              Vec3 toPoint = point.subtract(eye);
              double distanceSqr = toPoint.lengthSqr();
              if (distanceSqr > reach * reach) return Double.MAX_VALUE;
              double distance = Math.sqrt(distanceSqr);
              Vec3 direction = distance <= 0.001D ? look
                      : toPoint.scale(1.0D / distance);
              double dot = direction.dot(look);
              double alongRay = toPoint.dot(look);
              if (preciseAim && (alongRay < 0.0D || alongRay > reach)) {
                  return Double.MAX_VALUE;
              }
              double centerPenalty;
              if (dot > 0.0D) {
                  Vec3 closest = eye.add(look.scale(Math.max(0.0D, alongRay)));
                  centerPenalty = closest.distanceToSqr(point);
              } else {
                  centerPenalty = 0.58D * 0.58D + (1.0D - dot) * 0.35D;
              }
              if (preciseAim && centerPenalty > PRECISE_AIM_RADIUS_SQR) {
                  return Double.MAX_VALUE;
              }
              return centerPenalty + distance * 0.035D - priority * 0.01D
                      - (directHit ? 0.35D : 0.0D);
          }

          '''
          prompt_text, score_method_count = re.subn(
              r'    private static double scorePoint\(.*?'
              r'(?=    private static ScreenPoint projectToScreen)',
              score_method, prompt_text, count=1, flags=re.S)
          if score_method_count != 1:
              raise SystemExit(f'Context score method replacement: {score_method_count}')
          prompt_path.write_text(prompt_text, encoding='utf-8')

          # Cabin collision: cancel accumulated downward velocity and recover
          # entities that crossed the moving floor during a server tick.
          carriage_path = Path('src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorCarriageEntity.java')
          carriage_text = carriage_path.read_text(encoding='utf-8')
          carriage_text, standing_count = re.subn(
              r'                if \(standing\) entity\.setOnGround\(true\);',
              '                if (standing) stabilizeGroundedEntity(entity);',
              carriage_text, count=1)
          if standing_count != 1:
              raise SystemExit(f'Standing passenger stabilization: {standing_count}')
          swept_method = '''    private void resolveSweptFloorCollision(Entity entity, Vec3 previous) {
              AABB floor = shellBoxes().get(0);
              AABB box = entity.getBoundingBox();
              boolean horizontalOverlap = box.maxX > floor.minX
                      && box.minX < floor.maxX && box.maxZ > floor.minZ
                      && box.minZ < floor.maxZ;
              boolean crossedFloor = previous.y >= floor.maxY - 0.18D
                      && box.minY < floor.maxY;
              boolean recoverBelowFloor = box.minY < floor.maxY
                      && box.minY > floor.minY - 1.50D;
              if (!horizontalOverlap || (!crossedFloor && !recoverBelowFloor)) return;
              placeEntityOnFloor(entity, floor);
          }

              private static void placeEntityOnFloor(Entity entity, AABB floor) {
              AABB box = entity.getBoundingBox();
              entity.move(MoverType.SHULKER, new Vec3(0.0D,
                      floor.maxY - box.minY + COLLISION_EPSILON, 0.0D));
              stabilizeGroundedEntity(entity);
          }

              private static void stabilizeGroundedEntity(Entity entity) {
              Vec3 motion = entity.getDeltaMovement();
              if (motion.y < 0.0D) {
                  entity.setDeltaMovement(motion.x, 0.0D, motion.z);
              }
              entity.setOnGround(true);
              entity.fallDistance = 0.0F;
          }

          '''
          carriage_text, swept_count = re.subn(
              r'    private void resolveSweptFloorCollision\(.*?'
              r'(?=    private void playCabinFootstep)',
              swept_method, carriage_text, count=1, flags=re.S)
          if swept_count != 1:
              raise SystemExit(f'Swept cabin floor replacement: {swept_count}')
          floor_method = '''    private void resolveFloorCollision(Entity entity, AABB floor) {
              AABB box = entity.getBoundingBox();
              if (!box.intersects(floor)) return;
              if (box.getCenter().y >= floor.getCenter().y) {
                  placeEntityOnFloor(entity, floor);
              }
          }

          '''
          carriage_text, floor_count = re.subn(
              r'    private void resolveFloorCollision\(.*?'
              r'(?=    private void resolveCeilingCollision)',
              floor_method, carriage_text, count=1, flags=re.S)
          if floor_count != 1:
              raise SystemExit(f'Cabin floor overlap replacement: {floor_count}')
          shell_old = '''            AABB facingAligned = CoreRoomElevatorGeometry.rotateAabb(
                      modelAligned, facing(), 0.0D, 0.0D);'''
          shell_new = '''            AABB facingAligned = CoreRoomElevatorGeometry.rotateAabb(
                      modelAligned, facing().getOpposite(), 0.0D, 0.0D);'''
          if carriage_text.count(shell_old) != 1:
              raise SystemExit('Cabin shell facing transform not found')
          carriage_text = carriage_text.replace(shell_old, shell_new, 1)
          anchor_old = '''        Vec3 facingRotated = CoreRoomElevatorGeometry.rotateLocalVector(
                  facing(), modelAligned.x, modelAligned.y, modelAligned.z);'''
          anchor_new = '''        Vec3 facingRotated = CoreRoomElevatorGeometry.rotateLocalVector(
                  facing().getOpposite(), modelAligned.x,
                  modelAligned.y, modelAligned.z);'''
          if carriage_text.count(anchor_old) != 1:
              raise SystemExit('Cabin button facing transform not found')
          carriage_text = carriage_text.replace(anchor_old, anchor_new, 1)
          carriage_path.write_text(carriage_text, encoding='utf-8')

          # Render carriage before translucent station glass so transparent
          # station pixels cannot erase it through depth writes.
          client_path = Path('src/main/java/net/mcreator/scpadditions/facility/elevator/CoreRoomElevatorClient.java')
          client_text = client_path.read_text(encoding='utf-8')
          renderer_start = client_text.index(
              '    public static final class CarriageRenderer')
          prefix = client_text[:renderer_start]
          suffix = client_text[renderer_start:]
          if suffix.count('return RenderType.entityTranslucentCull(texture);') != 1:
              raise SystemExit('Carriage translucent render call not found')
          suffix = suffix.replace(
              'return RenderType.entityTranslucentCull(texture);',
              'return RenderType.entityCutoutNoCull(texture);', 1)
          client_path.write_text(prefix + suffix, encoding='utf-8')
          PY

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Commit validated repair to trigger branch
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-elevator-collision-interaction-fix.yml \
            .github/workflows/pr-apply-elevator-collision-interaction-fix.yml \
            .github/workflows/pr-branch-apply-elevator-fix.yml \
            tools/hotfix/APPLY_ELEVATOR_COLLISION_INTERACTION_FIX \
            tools/hotfix/TRIGGER_ELEVATOR_FIX_PR \
            tools/hotfix/TRIGGER_ELEVATOR_FIX_PR_2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Core Room elevator collision and interaction alignment"
          git push origin HEAD:automation/elevator-fix-trigger
